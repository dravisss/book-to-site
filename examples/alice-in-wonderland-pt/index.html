 muito rude.\"</p><p>Ao ouvir isso, o Chapeleiro abriu bem os olhos; mas tudo o que _disse_ foi: \"Por que um corvo se parece com uma escrivaninha?\"</p><p>\"Ora, agora vamos nos divertir!\", pensou Alice. \"Que bom que começaram a fazer charadas. Acho que consigo adivinhar essa\", acrescentou em voz alta.</p><p>\"Você quer dizer que acha que pode descobrir a resposta dela?\", disse a Lebre de Março.</p><p><h2 id=\"a-charada-do-corvo-e-da-escrivaninha\">A charada do corvo e da escrivaninha</h2></p><p>\"Exatamente\", disse Alice.</p><p>\"Então você deveria dizer o que quer dizer\", continuou a Lebre de Março.</p><p>\"Eu digo\", respondeu Alice apressadamente; \"pelo menos — pelo menos eu quero dizer o que digo — é a mesma coisa, sabe.\"</p><p>\"Não é nada a mesma coisa!\", disse o Chapeleiro. \"Você poderia muito bem dizer que 'eu vejo o que como' é a mesma coisa que 'eu como o que vejo'!\"</p><p>\"Você poderia muito bem dizer\", acrescentou a Lebre de Março, \"que 'eu gosto do que recebo' é a mesma coisa que 'eu recebo o que gosto'!\"</p><p>\"Você poderia muito bem dizer\", acrescentou o Arganaz, que parecia estar falando dormindo, \"que 'eu respiro quando durmo' é a mesma coisa que 'eu durmo quando respiro'!\"</p><p>\"_É_ a mesma coisa com você\", disse o Chapeleiro; e aí a conversa morreu, e o grupo ficou em silêncio por um minuto, enquanto Alice pensava em tudo o que conseguia lembrar sobre corvos e escrivaninhas, que não era muito.</p><p><h2 id=\"o-rel-gio-do-chapeleiro\">O relógio do Chapeleiro</h2></p><p>O Chapeleiro foi o primeiro a quebrar o silêncio. \"Que dia do mês é hoje?\", disse, virando-se para Alice; ele tirara o relógio do bolso e o olhava com inquietação, sacudindo-o de vez em quando e levando-o ao ouvido.</p><p>Alice pensou um pouco e então disse: \"Dia quatro.\"</p><p>\"Dois dias de atraso!\", suspirou o Chapeleiro. \"Eu te disse que manteiga não combinava com o mecanismo!\", acrescentou, olhando com raiva para a Lebre de Março.</p><p>\"Era da _melhor_ manteiga\", respondeu a Lebre de Março, humildemente.</p><p>\"Sim, mas deve ter entrado também umas migalhas\", resmungou o Chapeleiro; \"você não devia tê-la passado com a faca de pão.\"</p><p>A Lebre de Março pegou o relógio e o examinou com ar sombrio; depois o mergulhou na xícara de chá e o examinou de novo; mas não conseguiu pensar em nada melhor para dizer do que sua primeira observação: \"Era da _melhor_ manteiga, sabe.\"</p><p>Alice vinha olhando por cima do ombro dele com certa curiosidade. \"Que relógio engraçado!\", observou. \"Ele diz o dia do mês e não diz que horas são!\"</p><p>\"Por que haveria de dizer?\", murmurou o Chapeleiro. \"O _seu_ relógio lhe diz que ano é?\"</p><p>\"Claro que não\", respondeu Alice prontamente; \"mas isso é porque ele fica no mesmo ano por um tempo tão longo.\"</p><p>\"Que é exatamente o caso do _meu_\", disse o Chapeleiro.</p><p>Alice se sentiu terrivelmente intrigada. A observação do Chapeleiro parecia não ter sentido algum e, no entanto, era certamente inglês. \"Não entendo bem o que você quer dizer\", disse ela, o mais educadamente que pôde.</p><p>\"O Arganaz está dormindo de novo\", disse o Chapeleiro, e derramou um pouco de chá quente no nariz dele.</p><p>O Arganaz sacudiu a cabeça, impaciente, e disse, sem abrir os olhos: \"Claro, claro; exatamente o que eu ia observar.\"</p><p>\"Já adivinhou a charada?\", disse o Chapeleiro, voltando-se de novo para Alice.</p><p>\"Não, desisto\", respondeu Alice; \"qual é a resposta?\"</p><p>\"Não faço a menor ideia\", disse o Chapeleiro.</p><p>\"Eu também não\", disse a Lebre de Março.</p><p>Alice suspirou, cansada. \"Acho que vocês poderiam fazer algo melhor com o tempo\", disse ela, \"do que desperdiçá-lo fazendo charadas que não têm resposta.\"</p><p><h2 id=\"o-tempo\">O Tempo</h2></p><p>\"Se você conhecesse o Tempo tão bem quanto eu\", disse o Chapeleiro, \"não falaria em desperdiçá-_lo_. É _ele_.\"</p><p>\"Não sei o que você quer dizer\", disse Alice.</p><p>\"Claro que não sabe!\", disse o Chapeleiro, sacudindo a cabeça com desdém. \"Aposto que você nunca sequer falou com o Tempo!\"</p><p>\"Talvez não\", respondeu Alice, cautelosa; \"mas sei que preciso marcar o tempo quando aprendo música.\"</p><p>\"Ah! Isso explica tudo\", disse o Chapeleiro. \"Ele não tolera pancada. Ora, se você apenas mantivesse boas relações com ele, ele faria quase tudo o que você quisesse com o relógio. Por exemplo, suponha que sejam nove horas da manhã, bem na hora de começar as aulas: bastaria sussurrar uma dica ao Tempo, e o relógio gira num piscar de olhos! Uma e meia, hora do jantar!\"</p><p>(\"Quem me dera\", disse a Lebre de Março consigo mesma, num sussurro.)</p><p>\"Seria magnífico, com certeza\", disse Alice, pensativa; \"mas então — eu não estaria com fome, sabe.\"</p><p>\"Talvez não de início\", disse o Chapeleiro; \"mas você poderia mantê-lo na uma e meia pelo tempo que quisesse.\"</p><p>\"É assim que você faz?\", perguntou Alice.</p><p>O Chapeleiro sacudiu a cabeça, lastimosamente. \"Eu, não!\", respondeu. \"Nós brigamos em março passado — pouco antes de _ele_ enlouquecer, sabe —\" (apontando com a colher de chá para a Lebre de Março) \"— foi no grande concerto dado pela Rainha de Copas, e eu tive de cantar</p><blockquote>\n\"Brilha, brilha, morceguinho!\nQue estás fazendo, meu bichinho?\"\n</blockquote><p>Conhece a canção, talvez?\"</p><p>\"Já ouvi algo parecido\", disse Alice.</p><p>\"Ela continua, sabe\", prosseguiu o Chapeleiro, \"deste modo:—</p><blockquote>\n\"Acima do mundo tu voas,\nComo uma bandeja no céu.\nBrilha, brilha—\"\n</blockquote><p>Nesse ponto, o Arganaz se sacudiu e começou a cantar dormindo \"_Brilha, brilha, brilha, brilha_—\" e continuou por tanto tempo que tiveram de beliscá-lo para fazê-lo parar.</p><p>\"Bem, eu mal tinha terminado o primeiro verso\", disse o Chapeleiro, \"quando a Rainha se levantou de um pulo e gritou: 'Ele está assassinando o tempo! Cortem-lhe a cabeça!'\"</p><p>\"Que selvageria medonha!\", exclamou Alice.</p><p>\"E desde então\", continuou o Chapeleiro num tom lastimoso, \"ele não faz nada do que eu peço! Agora são sempre seis horas.\"</p><p><h2 id=\"sempre-hora-do-ch-\">Sempre hora do chá</h2></p><p>Uma ideia luminosa passou pela cabeça de Alice. \"É por isso que há tantos utensílios de chá postos aqui?\", perguntou.</p><p>\"Sim, é isso\", disse o Chapeleiro com um suspiro; \"é sempre hora do chá, e não temos tempo de lavar as coisas nos intervalos.\"</p><p>\"Então vocês ficam sempre se movendo em volta, suponho?\", disse Alice.</p><p>\"Exatamente\", disse o Chapeleiro; \"à medida que as coisas vão sendo usadas.\"</p><p>\"Mas o que acontece quando vocês chegam de novo ao começo?\", atreveu-se a perguntar Alice.</p><p>\"Que tal mudarmos de assunto\", interrompeu a Lebre de Março, bocejando. \"Estou me cansando disso. Proponho que a jovem senhorita nos conte uma história.\"</p><p>\"Receio não conhecer nenhuma\", disse Alice, bastante alarmada com a proposta.</p><p>\"Então o Arganaz contará!\", gritaram os dois. \"Acorde, Arganaz!\" E o beliscaram dos dois lados ao mesmo tempo.</p><p>O Arganaz abriu lentamente os olhos. \"Eu não estava dormindo\", disse com voz rouca e débil; \"ouvi cada palavra que vocês disseram.\"</p><p>\"Conte-nos uma história!\", disse a Lebre de Março.</p><p>\"Sim, por favor, conte!\", suplicou Alice.</p><p>\"E seja rápido\", acrescentou o Chapeleiro, \"ou você vai estar dormindo de novo antes de terminar.\"</p><p><h2 id=\"as-tr-s-irm-zinhas\">As três irmãzinhas</h2></p><p>\"Era uma vez três irmãzinhas\", começou o Arganaz, com muita pressa; \"e seus nomes eram Elsie, Lacie e Tillie; e elas viviam no fundo de um poço—\"</p><p>\"Do que elas viviam?\", perguntou Alice, que sempre se interessava muito por questões de comer e beber.</p><p>\"Elas viviam de melaço\", disse o Arganaz, depois de pensar um minuto ou dois.</p><p>\"Elas não poderiam ter feito isso, sabe\", observou Alice com delicadeza; \"teriam ficado doentes.\"</p><p>\"E ficaram\", disse o Arganaz; \"_muito_ doentes.\"</p><p>Alice tentou imaginar como seria um modo de vida tão extraordinário, mas aquilo a intrigava demais, então continuou: \"Mas por que elas viviam no fundo de um poço?\"</p><p>\"Tome mais um pouco de chá\", disse a Lebre de Março a Alice, com muita seriedade.</p><p>\"Ainda não tomei nada\", respondeu Alice num tom ofendido, \"então não posso tomar mais.\"</p><p>\"Você quer dizer que não pode tomar _menos_\", disse o Chapeleiro; \"é muito fácil tomar _mais_ do que nada.\"</p><p>\"Ninguém pediu a _sua_ opinião\", disse Alice.</p><p>\"Quem está fazendo observações pessoais agora?\", perguntou o Chapeleiro, triunfante.</p><p>Alice não sabia bem o que dizer a isso; então serviu-se de chá e pão com manteiga e voltou-se para o Arganaz, repetindo a pergunta. \"Por que elas viviam no fundo de um poço?\"</p><p>O Arganaz levou de novo um minuto ou dois para pensar no assunto e então disse: \"Era um poço de melaço.\"</p><p>\"Isso não existe!\", Alice ia começando, muito irritada, mas o Chapeleiro e a Lebre de Março fizeram \"Xiu! Xiu!\", e o Arganaz observou, amuado: \"Se você não sabe se comportar, é melhor terminar a história você mesma.\"</p><p>\"Não, por favor, continue!\", disse Alice, muito humilde; \"não vou interromper de novo. Até pode ser que exista _um_.\"</p><p>\"_Um_, é!\", disse o Arganaz, indignado. No entanto, consentiu em continuar. \"E então essas três irmãzinhas — elas estavam aprendendo a desenhar, sabe—\"</p><p>\"O que elas desenhavam?\", perguntou Alice, esquecendo completamente a promessa.</p><p>\"Melaço\", disse o Arganaz, sem pensar nada desta vez.</p><p>\"Quero uma xícara limpa\", interrompeu o Chapeleiro; \"vamos todos mudar um lugar.\"</p><p>Ele mudou de lugar enquanto falava, e o Arganaz o seguiu; a Lebre de Março passou para o lugar do Arganaz, e Alice, de má vontade, ocupou o lugar da Lebre de Março. O Chapeleiro foi o único que tirou alguma vantagem da mudança; e Alice ficou bem pior do que antes, pois a Lebre de Março acabara de derrubar a leiteira no próprio prato.</p><p>Alice não queria ofender o Arganaz de novo, então começou com muito cuidado: \"Mas não entendo. De onde elas tiravam o melaço?\"</p><p>\"Você pode tirar água de um poço de água\", disse o Chapeleiro; \"então eu acho que se pode tirar melaço de um poço de melaço — não é, sua boba?\"</p><p>\"Mas elas estavam _dentro_ do poço\", disse Alice ao Arganaz, escolhendo não dar atenção a essa última observação.</p><p>\"Claro que estavam\", disse o Arganaz; \"— bem lá no fundo.\"</p><p>Essa resposta confundiu tanto a pobre Alice que ela deixou o Arganaz continuar por um bom tempo sem interrompê-lo.</p><p>\"Elas estavam aprendendo a desenhar\", continuou o Arganaz, bocejando e esfregando os olhos, pois estava ficando muito sonolento; \"e desenhavam toda sorte de coisas — tudo o que começa com M—\"</p><p>\"Por que com M?\", perguntou Alice.</p><p>\"Por que não?\", disse a Lebre de Março.</p><p>Alice ficou em silêncio.</p><p>O Arganaz já tinha fechado os olhos e estava caindo no sono; mas, beliscado pelo Chapeleiro, acordou com um pequeno guincho e continuou: \"— que começa com M, como ratoeiras, e a lua, e memória, e muitoçura — sabe como se diz que as coisas são 'da mesma muitoçura' — você já viu alguma vez um desenho de uma muitoçura?\"</p><p>\"Bem, agora que você me pergunta\", disse Alice, muito confusa, \"não acho—\"</p><p>\"Então você não deveria falar\", disse o Chapeleiro.</p><p>Essa grosseria foi mais do que Alice podia suportar: ela se levantou, enojada, e saiu andando; o Arganaz adormeceu na mesma hora, e nenhum dos outros dois deu a menor atenção à sua partida, embora ela tenha olhado para trás uma ou duas vezes, meio na esperança de que a chamassem; na última vez em que os viu, eles tentavam enfiar o Arganaz no bule de chá.</p><p>\"De qualquer modo, nunca mais voltarei _lá_!\", disse Alice enquanto abria caminho pela floresta. \"Foi o chá mais idiota de toda a minha vida!\"</p><p><h2 id=\"de-volta-ao-jardim\">De volta ao jardim</h2></p><p>Assim que disse isso, notou que uma das árvores tinha uma porta que dava direto para dentro dela. \"Que curioso!\", pensou. \"Mas hoje tudo é curioso. Acho que posso muito bem entrar logo.\" E entrou.</p><p>Mais uma vez, viu-se no salão comprido, perto da mesinha de vidro. \"Agora vou me sair melhor desta vez\", disse consigo mesma, e começou pegando a chavezinha de ouro e destrancando a porta que dava para o jardim. Então pôs-se a mordiscar o cogumelo (guardara um pedaço dele no bolso) até ficar com cerca de trinta centímetros de altura; depois atravessou a pequena passagem; e _então_ — viu-se por fim no belo jardim, entre os canteiros floridos e as fontes frescas.\n</p>", "subsections": [{"level": 2, "title": "A mesa de chá", "id": "a-mesa-de-ch-"}, {"level": 2, "title": "A charada do corvo e da escrivaninha", "id": "a-charada-do-corvo-e-da-escrivaninha"}, {"level": 2, "title": "O relógio do Chapeleiro", "id": "o-rel-gio-do-chapeleiro"}, {"level": 2, "title": "O Tempo", "id": "o-tempo"}, {"level": 2, "title": "Sempre hora do chá", "id": "sempre-hora-do-ch-"}, {"level": 2, "title": "As três irmãzinhas", "id": "as-tr-s-irm-zinhas"}, {"level": 2, "title": "De volta ao jardim", "id": "de-volta-ao-jardim"}], "readTime": "11 min"}, {"type": "chapter", "title": "Capítulo VIII: O Croquet da Rainha", "html": "<p>\n<em>Título original: \"The Queen's Croquet-Ground\" (</em>Alice's Adventures in Wonderland<em>, Lewis Carroll, 1865).</em></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#o-jardim-de-rosas\">O jardim de rosas</a></li><li class=\"mt-2\"><a href=\"#a-prociss-o-real\">A procissão real</a></li><li class=\"mt-2\"><a href=\"#o-jogo-de-croquet\">O jogo de croquet</a></li><li class=\"mt-2\"><a href=\"#o-gato-de-cheshire\">O Gato de Cheshire</a></li></ul></div><p><h2 id=\"o-jardim-de-rosas\">O jardim de rosas</h2></p><p>Um grande pé de rosas erguia-se perto da entrada do jardim: as rosas que nele cresciam eram brancas, mas havia três jardineiros ocupados em pintá-las de vermelho. Alice achou aquilo muito curioso e se aproximou para observá-los; e, quando chegou perto deles, ouviu um deles dizer: \"Cuidado agora, Cinco! Não vá me salpicar de tinta desse jeito!\"</p><p>\"Não tive culpa\", disse Cinco, num tom mal-humorado; \"Sete esbarrou no meu cotovelo.\"</p><p>Ao que Sete ergueu os olhos e disse: \"Isso mesmo, Cinco! Sempre ponha a culpa nos outros!\"</p><p>\"É melhor _você_ não falar!\", disse Cinco. \"Ouvi a Rainha dizer ontem mesmo que você merecia ser decapitado!\"</p><p>\"Por quê?\", perguntou aquele que havia falado primeiro.</p><p>\"Isso não é da _sua_ conta, Dois!\", disse Sete.</p><p>\"Sim, _é_ da conta dele!\", disse Cinco, \"e eu vou lhe contar: foi por trazer raízes de tulipa para a cozinheira em vez de cebolas.\"</p><p>Sete atirou longe o pincel e já ia começando \"Bem, de todas as injustiças...\" quando seu olhar caiu por acaso sobre Alice, que estava ali parada observando-os, e ele se conteve de repente: os outros também olharam ao redor, e todos se curvaram profundamente.</p><p>\"Poderiam me dizer\", perguntou Alice, um pouco tímida, \"por que estão pintando essas rosas?\"</p><p>Cinco e Sete nada disseram, mas olharam para Dois. Dois começou, em voz baixa: \"O fato é que, veja a senhorita, isto aqui devia ter sido um pé de rosas _vermelhas_, e nós pusemos um branco por engano; e, se a Rainha viesse a descobrir, todos nós teríamos as cabeças cortadas, sabe. Então, veja a senhorita, estamos fazendo o nosso melhor, antes que ela chegue, para...\" Nesse momento, Cinco, que vinha olhando ansiosamente através do jardim, gritou: \"A Rainha! A Rainha!\" E os três jardineiros imediatamente se atiraram de bruços no chão. Ouviu-se o som de muitos passos, e Alice olhou ao redor, ansiosa por ver a Rainha.</p><p><h2 id=\"a-prociss-o-real\">A procissão real</h2></p><p>Primeiro vieram dez soldados carregando paus; eram todos feitos como os três jardineiros, oblongos e achatados, com as mãos e os pés nos cantos. Depois vieram os dez cortesãos, ornamentados inteiramente com losangos, e caminhavam dois a dois, como os soldados. Depois destes vinham os filhos da realeza; eram dez, e os pequeninos vinham saltitando alegremente de mãos dadas, em pares: todos ornamentados com corações. Em seguida vieram os convidados, em sua maioria Reis e Rainhas, e entre eles Alice reconheceu o Coelho Branco: ele falava de modo apressado e nervoso, sorria para tudo o que se dizia e passou adiante sem notá-la. Depois veio o Valete de Copas, carregando a coroa do Rei numa almofada de veludo carmesim; e, por último, em toda aquela grande procissão, vieram O REI E A RAINHA DE COPAS.</p><p>Alice ficou bastante em dúvida se não deveria deitar-se de bruços como os três jardineiros, mas não conseguia lembrar de ter ouvido falar de tal regra em procissões; \"e, além disso, de que serviria uma procissão\", pensou ela, \"se todos tivessem de se deitar de bruços, a ponto de não poderem vê-la?\" Assim, permaneceu parada onde estava, e esperou.</p><p>Quando a procissão chegou diante de Alice, todos pararam e olharam para ela, e a Rainha perguntou severamente, dirigindo-se ao Valete de Copas: \"Quem é esta?\" O Valete apenas se curvou e sorriu em resposta.</p><p>\"Idiota!\", disse a Rainha, sacudindo a cabeça com impaciência; e, voltando-se para Alice, continuou: \"Qual é o seu nome, criança?\"</p><p>\"Meu nome é Alice, se assim apraz a Vossa Majestade\", disse Alice muito educadamente; mas acrescentou, consigo mesma: \"Ora, no fim das contas, não passam de um baralho de cartas. Não preciso ter medo deles!\"</p><p>\"E quem são _esses?_\", perguntou a Rainha, apontando para os três jardineiros que jaziam ao redor do pé de rosas; pois, veja bem, como estavam deitados de bruços e o desenho de suas costas era o mesmo do resto do baralho, ela não conseguia distinguir se eram jardineiros, soldados, cortesãos ou três de seus próprios filhos.</p><p>\"Como _eu_ haveria de saber?\", disse Alice, surpresa com a própria coragem. \"Não é da _minha_ conta.\"</p><p>A Rainha ficou carmesim de fúria e, depois de fulminá-la com o olhar por um momento, como uma fera selvagem, gritou: \"Cortem a cabeça dela! Cortem—\"</p><p>\"Bobagem!\", disse Alice, em voz bem alta e decidida, e a Rainha emudeceu.</p><p>O Rei pousou a mão no braço dela e disse timidamente: \"Considere, minha querida: ela é apenas uma criança!\"</p><p>A Rainha afastou-se dele, zangada, e disse ao Valete: \"Vire-os!\"</p><p>O Valete assim fez, com muito cuidado, usando um dos pés.</p><p>\"Levantem-se!\", gritou a Rainha, em voz estridente e alta, e os três jardineiros pularam imediatamente para cima e começaram a fazer reverências ao Rei, à Rainha, aos filhos da realeza e a todos os demais.</p><p>\"Parem com isso!\", gritou a Rainha. \"Vocês estão me deixando tonta.\" E então, voltando-se para o pé de rosas, continuou: \"O que é que vocês _estavam_ fazendo aqui?\"</p><p>\"Se apraz a Vossa Majestade\", disse Dois, num tom muito humilde, ajoelhando-se sobre um dos joelhos enquanto falava, \"nós estávamos tentando...\"</p><p>\"_Eu_ já vejo!\", disse a Rainha, que entretanto estivera examinando as rosas. \"Cortem-lhes as cabeças!\" E a procissão seguiu adiante, permanecendo três soldados para executar os infelizes jardineiros, que correram para Alice em busca de proteção.</p><p>\"Vocês não serão decapitados!\", disse Alice, e os pôs dentro de um grande vaso de flores que estava ali perto. Os três soldados vaguearam por um minuto ou dois, procurando por eles, e então marcharam tranquilamente atrás dos outros.</p><p>\"Será que as cabeças deles foram cortadas?\", gritou a Rainha.</p><p>\"As cabeças deles se foram, se apraz a Vossa Majestade!\", gritaram os soldados em resposta.</p><p>\"Muito bem!\", gritou a Rainha. \"Você sabe jogar <em>croquet</em>?\"</p><p>Os soldados silenciaram e olharam para Alice, pois a pergunta evidentemente era dirigida a ela.</p><p>\"Sei!\", gritou Alice.</p><p>\"Venha, então!\", rugiu a Rainha, e Alice juntou-se à procissão, perguntando-se muito o que aconteceria em seguida.</p><p>\"É... é um dia muito bonito!\", disse uma voz tímida ao seu lado. Ela caminhava ao lado do Coelho Branco, que espreitava ansiosamente o seu rosto.</p><p><h2 id=\"o-jogo-de-croquet\">O jogo de croquet</h2></p><p>\"Muito bonito\", disse Alice: \"...e onde está a Duquesa?\"</p><p>\"Psiu! Psiu!\", disse o Coelho, num tom baixo e apressado. Olhou ansiosamente por cima do ombro enquanto falava e, então, ergueu-se na ponta dos pés, aproximou a boca do ouvido dela e sussurrou: \"Ela está sob sentença de execução.\"</p><p>\"Por quê?\", disse Alice.</p><p>\"Você disse 'Que pena!'?\", perguntou o Coelho.</p><p>\"Não, não disse\", disse Alice: \"não acho que seja pena nenhuma. Eu disse 'Por quê?'\"</p><p>\"Ela deu umas palmadas nas orelhas da Rainha...\", começou o Coelho. Alice soltou um gritinho de riso. \"Oh, psiu!\", sussurrou o Coelho, num tom assustado. \"A Rainha vai ouvi-la! Veja, ela chegou um pouco atrasada, e a Rainha disse...\"</p><p>\"Tomem seus lugares!\", gritou a Rainha, com voz de trovão, e as pessoas começaram a correr em todas as direções, esbarrando umas nas outras; ainda assim, acomodaram-se em um minuto ou dois, e o jogo começou. Alice achou que jamais vira um campo de <em>croquet</em> tão curioso em toda a sua vida: era todo de elevações e sulcos; as bolas eram ouriços vivos, os tacos eram flamingos vivos, e os soldados tinham de se dobrar ao meio e se apoiar sobre as mãos e os pés para formar os arcos.</p><p>A principal dificuldade que Alice encontrou a princípio foi a de manejar seu flamingo: ela conseguia acomodar o corpo dele, confortavelmente, debaixo do braço, com as pernas penduradas, mas, em geral, justamente quando já tinha esticado bem o pescoço dele e ia desferir uma tacada no ouriço com a cabeça, ele _insistia_ em se virar e olhar para o seu rosto, com uma expressão tão perplexa que ela não podia deixar de explodir em gargalhadas; e, quando ela lhe baixava a cabeça e ia recomeçar, era muito irritante descobrir que o ouriço já se tinha desenrolado e estava a ponto de sair rastejando. Além de tudo isso, havia em geral uma elevação ou um sulco no caminho sempre que ela queria mandar o ouriço para algum lugar e, como os soldados dobrados estavam sempre se levantando e indo embora para outras partes do terreno, Alice logo chegou à conclusão de que era um jogo deveras difícil.</p><p>Todos os jogadores jogavam ao mesmo tempo, sem esperar a vez, brigando o tempo todo e disputando os ouriços; e, em muito pouco tempo, a Rainha estava num acesso de fúria e saiu pisoteando de um lado para outro, gritando \"Cortem a cabeça dele!\" ou \"Cortem a cabeça dela!\" cerca de uma vez por minuto.</p><p>Alice começou a se sentir muito inquieta: na verdade, ainda não tivera nenhuma discussão com a Rainha, mas sabia que aquilo podia acontecer a qualquer minuto; \"e então\", pensou ela, \"o que seria de mim? Eles são terrivelmente afeiçoados a decapitar gente por aqui; a grande maravilha é que ainda haja alguém vivo!\"</p><p>Ela procurava ao redor alguma via de escape, perguntando-se se conseguiria fugir sem ser vista, quando notou uma curiosa aparição no ar: a princípio, aquilo a intrigou muito, mas, depois de observá-la por um minuto ou dois, ela a identificou como um sorriso e disse consigo mesma: \"É o Gato de Cheshire: agora terei alguém com quem conversar.\"</p><p>\"Como vão as coisas?\", disse o Gato, assim que teve boca suficiente para falar.</p><p>Alice esperou até que os olhos aparecessem, e então acenou com a cabeça. \"Não adianta falar com ele\", pensou ela, \"até que as orelhas apareçam, ou ao menos uma delas.\" Em outro minuto, a cabeça inteira apareceu, e então Alice pousou o flamingo e começou a relatar o andamento do jogo, sentindo-se muito feliz por ter alguém que a escutasse. O Gato pareceu achar que já havia bastante dele à vista, e nada mais dele apareceu.</p><p>\"Eu acho que eles não jogam nada com <em>fair play</em>\", começou Alice, num tom bastante queixoso, \"e eles brigam tão terrivelmente que a gente não ouve a própria voz; e eles não parecem ter regras em particular; ao menos, se têm, ninguém as observa; e você não faz ideia de como é confuso que todas as coisas estejam vivas; por exemplo, há o arco pelo qual tenho de passar daqui a pouco, que fica passeando na outra ponta do terreno; e eu teria acertado o ouriço da Rainha agora mesmo, mas ele fugiu quando viu o meu se aproximando!\"</p><p>\"Como você gosta da Rainha?\", disse o Gato, em voz baixa.</p><p>\"Não gosto nada\", disse Alice: \"ela é tão extremamente—\" Nesse instante, ela percebeu que a Rainha estava bem atrás dela, escutando: então continuou: \"...propensa a vencer, que quase não vale a pena terminar o jogo.\"</p><p>A Rainha sorriu e passou adiante.</p><p>\"Com _quem_ é que você está falando?\", disse o Rei, aproximando-se de Alice e olhando para a cabeça do Gato com grande curiosidade.</p><p><h2 id=\"o-gato-de-cheshire\">O Gato de Cheshire</h2></p><p>\"É um amigo meu, um Gato de Cheshire\", disse Alice: \"permita-me apresentá-lo.\"</p><p>\"Não gosto nada da aparência dele\", disse o Rei: \"no entanto, ele pode beijar minha mão, se quiser.\"</p><p>\"Prefiro não\", observou o Gato.</p><p>\"Não seja impertinente\", disse o Rei, \"e não me olhe desse jeito!\" Ele se pôs atrás de Alice enquanto falava.</p><p>\"Um gato pode olhar para um rei\", disse Alice. \"Li isso em algum livro, mas não me lembro onde.\"</p><p>\"Bem, ele precisa ser removido\", disse o Rei, muito decidido, e chamou a Rainha, que passava naquele momento: \"Minha querida! Eu gostaria que você mandasse remover este gato!\"</p><p>A Rainha tinha apenas um modo de resolver todas as dificuldades, grandes ou pequenas. \"Cortem a cabeça dele!\", disse ela, sem sequer olhar para trás.</p><p>\"Eu mesmo vou buscar o carrasco\", disse o Rei, ansioso, e saiu apressado.</p><p>Alice achou que bem podia voltar para ver como andava o jogo, pois ouvia ao longe a voz da Rainha, gritando de fúria. Ela já a ouvira condenar três jogadores à execução por terem perdido a vez, e não gostava nada da aparência das coisas, pois o jogo estava numa tal confusão que ela nunca sabia se era a sua vez ou não. Assim, saiu em busca do seu ouriço.</p><p>O ouriço estava empenhado numa briga com outro ouriço, o que pareceu a Alice uma excelente oportunidade para acertar um deles com o outro: a única dificuldade era que seu flamingo tinha ido para o outro lado do jardim, onde Alice podia vê-lo tentando, de um jeito meio desamparado, voar para cima de uma árvore.</p><p>Quando conseguiu pegar o flamingo e trazê-lo de volta, a briga tinha terminado, e os dois ouriços tinham sumido de vista: \"mas não importa muito\", pensou Alice, \"pois todos os arcos desapareceram deste lado do terreno.\" Assim, ela o acomodou debaixo do braço, para que não fugisse de novo, e voltou para conversar mais um pouco com o seu amigo.</p><p>Quando voltou ao Gato de Cheshire, ficou surpresa ao encontrar uma multidão considerável reunida ao redor dele: havia uma disputa em andamento entre o carrasco, o Rei e a Rainha, que falavam todos ao mesmo tempo, enquanto todos os demais permaneciam em silêncio e com ar muito desconfortável. No momento em que Alice apareceu, os três recorreram a ela para resolver a questão, e repetiram seus argumentos, embora, como falassem todos ao mesmo tempo, ela achasse muito difícil mesmo entender exatamente o que diziam.</p><p>O argumento do carrasco era que não se podia cortar uma cabeça a menos que houvesse um corpo do qual cortá-la: que nunca tivera de fazer tal coisa antes, e não ia começar naquela _altura_ da vida.</p><p>O argumento do Rei era que qualquer coisa que tivesse uma cabeça podia ser decapitada, e que não se devia falar bobagens.</p><p>O argumento da Rainha era que, se algo não fosse feito a respeito em menos de um piscar de olhos, ela mandaria executar todo mundo, em toda a volta. (Fora essa última observação que deixara todo o grupo com aspecto tão grave e apreensivo.)</p><p>Alice não conseguiu pensar em nada melhor para dizer senão: \"Ele pertence à Duquesa: é melhor vocês perguntarem a _ela_ sobre isso.\"</p><p>\"Ela está na prisão\", disse a Rainha ao carrasco: \"tragam-na aqui.\" E o carrasco partiu como uma flecha.</p><p>A cabeça do Gato começou a se esvanecer no instante em que ele partiu e, quando voltou com a Duquesa, já tinha desaparecido por completo; assim, o Rei e o carrasco correram desvairadamente para cima e para baixo à procura da cabeça, enquanto o resto do grupo voltou para o jogo.\n</p>", "subsections": [{"level": 2, "title": "O jardim de rosas", "id": "o-jardim-de-rosas"}, {"level": 2, "title": "A procissão real", "id": "a-prociss-o-real"}, {"level": 2, "title": "O jogo de croquet", "id": "o-jogo-de-croquet"}, {"level": 2, "title": "O Gato de Cheshire", "id": "o-gato-de-cheshire"}], "readTime": "12 min"}, {"type": "chapter", "title": "Capítulo IX: A História da Falsa Tartaruga", "html": "<p>\n<h2 id=\"a-duquesa-e-suas-morais\">A Duquesa e suas Morais</h2></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-duquesa-e-suas-morais\">A Duquesa e suas Morais</a></li><li class=\"mt-2\"><a href=\"#a-rainha-e-as-execu-es\">A Rainha e as Execuções</a></li><li class=\"mt-2\"><a href=\"#o-grifo-e-a-falsa-tartaruga\">O Grifo e a Falsa Tartaruga</a></li><li class=\"mt-2\"><a href=\"#a-escola-no-mar\">A Escola no Mar</a></li></ul></div><p>\"Não imagina como estou feliz em vê-la de novo, sua querida criatura!\" — disse a Duquesa, enfiando o braço afetuosamente no de Alice, enquanto caminhavam juntas.</p><p>Alice ficou muito contente em encontrá-la num humor tão agradável e pensou consigo mesma que talvez tivesse sido apenas a pimenta que a deixara tão feroz quando se encontraram na cozinha.</p><p>\"Quando _eu_ for Duquesa,\" — disse consigo mesma (embora num tom pouco esperançoso) — \"não terei pimenta nenhuma na minha cozinha, _de jeito nenhum_. A sopa fica muito bem sem ela. Talvez seja sempre a pimenta que deixa as pessoas irritadiças,\" — continuou, muito satisfeita por ter descoberto uma nova espécie de regra — \"e o vinagre que as deixa azedas; e a camomila que as deixa amargas; e — e — o açúcar de cevada e coisas assim que deixam as crianças bem-humoradas. Quem dera as pessoas soubessem _disso_: então não seriam tão mesquinhas com isso, sabe —\"</p><p>Ela já tinha se esquecido completamente da Duquesa nesse momento e ficou um pouco assustada quando ouviu a voz dela perto do seu ouvido. \"Você está pensando em alguma coisa, minha querida, e isso a faz esquecer de falar. Não posso lhe dizer agora qual é a moral disso, mas vou me lembrar daqui a pouco.\"</p><p>\"Talvez não tenha nenhuma,\" — arriscou-se Alice a observar.</p><p>\"Tut, tut, criança!\" — disse a Duquesa. \"Tudo tem uma moral, se você conseguir encontrá-la.\" E espremeu-se mais perto do lado de Alice enquanto falava.</p><p>Alice não gostava muito de ficar tão colada nela: primeiro, porque a Duquesa era _muito_ feia; e segundo, porque ela tinha exatamente a altura certa para apoiar o queixo no ombro de Alice, e era um queixo desconfortavelmente pontudo. No entanto, ela não queria ser mal-educada, então suportou o melhor que pôde.</p><p>\"O jogo está indo muito melhor agora,\" — disse ela, para manter um pouco a conversa.</p><p>\"É verdade,\" — disse a Duquesa — \"e a moral disso é: 'Oh, é o amor, é o amor que faz o mundo girar!'\"</p><p>\"Alguém disse,\" — sussurrou Alice — \"que isso é feito por cada um cuidando da própria vida!\"</p><p>\"Ah, bem! Dá no mesmo,\" — disse a Duquesa, cravando o queixinho pontudo no ombro de Alice enquanto acrescentava — \"e a moral _disso_ é: 'Cuide do sentido, e os sons cuidarão de si mesmos.'\"</p><p>\"Como ela gosta de encontrar morais nas coisas!\" — pensou Alice consigo mesma.</p><p>\"Aposto que você está se perguntando por que não passo o braço em volta da sua cintura,\" — disse a Duquesa após uma pausa — \"o motivo é que estou em dúvida sobre o temperamento do seu flamingo. Devo tentar o experimento?\"</p><p>\"Ele pode morder,\" — respondeu Alice cautelosamente, sem sentir nenhuma vontade de ver o experimento tentado.</p><p>\"Verdade,\" — disse a Duquesa — \"flamingos e mostarda mordem. E a moral disso é: 'Os pássaros de mesma pena voam juntos.'\"</p><p>\"Só que mostarda não é um pássaro,\" — observou Alice.</p><p>\"Certo, como sempre,\" — disse a Duquesa — \"que jeito claro você tem de pôr as coisas!\"</p><p>\"É um mineral, _acho_,\" — disse Alice.</p><p>\"Claro que é,\" — disse a Duquesa, que parecia pronta a concordar com tudo o que Alice dizia — \"há uma grande mina de mostarda aqui perto. E a moral disso é: 'Quanto mais há do meu, menos há do seu.'\"</p><p>\"Oh, já sei!\" — exclamou Alice, que não prestara atenção a essa última observação — \"é um vegetal. Não parece, mas é.\"</p><p>\"Concordo plenamente com você,\" — disse a Duquesa — \"e a moral disso é: 'Seja aquilo que você aparentaria ser' — ou, se preferir de modo mais simples: 'Nunca imagine que você não é diferente do que pode parecer aos outros que aquilo que você era ou poderia ter sido não era diferente do que aquilo que você tinha sido teria parecido a eles ser diferente.'\"</p><p>\"Acho que entenderia melhor,\" — disse Alice muito educadamente — \"se estivesse escrito: mas não consigo acompanhar direito quando a senhora diz assim.\"</p><p>\"Isso não é nada perto do que eu poderia dizer, se quisesse,\" — respondeu a Duquesa, num tom satisfeito.</p><p>\"Por favor, não se dê ao trabalho de dizê-lo mais do que isso,\" — disse Alice.</p><p>\"Oh, não fale em trabalho!\" — disse a Duquesa. \"Eu lhe faço presente de tudo o que já disse até agora.\"</p><p>\"Um presente barato!\" — pensou Alice. \"Ainda bem que não dão presentes de aniversário assim!\" Mas não se atreveu a dizê-lo em voz alta.</p><p>\"Pensando de novo?\" — perguntou a Duquesa, com outra cutucada do queixinho pontudo.</p><p>\"Tenho todo o direito de pensar,\" — disse Alice rispidamente, pois começava a se sentir um pouco incomodada.</p><p>\"Exatamente tanto direito,\" — disse a Duquesa — \"quanto os porcos têm de voar; e a m—\"</p><p>Mas ali, para grande surpresa de Alice, a voz da Duquesa se extinguiu, bem no meio da sua palavra favorita, 'moral', e o braço enlaçado no dela começou a tremer. Alice levantou os olhos e lá estava a Rainha diante delas, de braços cruzados, franzindo a testa como uma tempestade.</p><p>\"Belo dia, Vossa Majestade!\" — começou a Duquesa, com uma voz baixa e fraca.</p><p>\"Pois eu lhe dou um aviso justo,\" — gritou a Rainha, batendo o pé no chão enquanto falava — \"ou você ou a sua cabeça deve sair, e isso em mais ou menos meio tempo nenhum! Escolha!\"</p><p>A Duquesa fez sua escolha e sumiu num instante.</p><p><h2 id=\"a-rainha-e-as-execu-es\">A Rainha e as Execuções</h2></p><p>\"Vamos continuar o jogo,\" — disse a Rainha a Alice; e Alice estava assustada demais para dizer uma palavra, mas seguiu-a lentamente de volta ao campo de croqué.</p><p>Os outros convidados tinham aproveitado a ausência da Rainha e descansavam à sombra; no entanto, no momento em que a viram, correram de volta ao jogo, limitando-se a Rainha a observar que um instante de atraso lhes custaria a vida.</p><p>Durante todo o tempo em que jogavam, a Rainha nunca parou de brigar com os outros jogadores, gritando \"Cortem-lhe a cabeça!\" ou \"Cortem-lhe a cabeça!\" Aqueles que ela condenava eram detidos pelos soldados, que, é claro, tinham de deixar de servir de arcos para fazer isso, de modo que, ao fim de meia hora ou mais, não restava nenhum arco, e todos os jogadores, exceto o Rei, a Rainha e Alice, estavam detidos e sob sentença de execução.</p><p>Então a Rainha parou, totalmente sem fôlego, e disse a Alice: \"Você já viu a Falsa Tartaruga?\"</p><p>\"Não,\" — disse Alice. \"Eu nem sei o que é uma Falsa Tartaruga.\"</p><p>\"É a coisa de que se faz a Sopa de Falsa Tartaruga,\" — disse a Rainha.</p><p>\"Nunca vi uma, nem ouvi falar,\" — disse Alice.</p><p>\"Venha, então,\" — disse a Rainha — \"e ele vai lhe contar a história dele.\"</p><p>Enquanto se afastavam juntas, Alice ouviu o Rei dizer em voz baixa, dirigindo-se à companhia em geral: \"Vocês estão todos perdoados.\" \"Ora, _isso_ é uma boa coisa!\" — disse ela consigo mesma, pois se sentira bastante infeliz com o número de execuções que a Rainha ordenara.</p><p>Logo encontraram um Grifo, dormindo profundamente ao sol. (Se você não sabe o que é um Grifo, olhe a figura.) \"Levante-se, criatura preguiçosa!\" — disse a Rainha — \"e leve esta menina para ver a Falsa Tartaruga e ouvir a história dela. Preciso voltar para cuidar de algumas execuções que ordenei.\" E foi embora, deixando Alice a sós com o Grifo.</p><p>Alice não gostou muito da aparência da criatura, mas no geral achou que seria igualmente seguro ficar com ele quanto ir atrás daquela Rainha selvagem: então esperou.</p><p>O Grifo se sentou e esfregou os olhos; depois ficou olhando para a Rainha até que ela sumisse de vista; então deu uma risadinha. \"Que divertido!\" — disse o Grifo, metade para si mesmo, metade para Alice.</p><p>\"O que _é_ divertido?\" — disse Alice.</p><p>\"Ora, _ela_,\" — disse o Grifo. \"É tudo invenção dela, isso: eles nunca executam ninguém, não, sabe. Vamos!\"</p><p>\"'Vamos!' é o que todo mundo diz aqui,\" — pensou Alice, enquanto o seguia devagar — \"nunca fui tão mandada de um lado para o outro em toda a minha vida, nunca!\"</p><p><h2 id=\"o-grifo-e-a-falsa-tartaruga\">O Grifo e a Falsa Tartaruga</h2></p><p>Não tinham ido longe quando viram a Falsa Tartaruga ao longe, sentada, triste e solitária, numa pequena saliência de rocha e, à medida que se aproximavam, Alice pôde ouvi-la suspirando como se o coração fosse partir. Ela sentiu profunda pena dela. \"Qual é a dor dele?\" — perguntou ela ao Grifo, e o Grifo respondeu, quase nas mesmas palavras de antes: \"É tudo imaginação dele, isso: ele não tem nenhuma tristeza, não, sabe. Vamos!\"</p><p>Então se aproximaram da Falsa Tartaruga, que os olhou com grandes olhos cheios de lágrimas, mas não disse nada.</p><p>\"Esta menina aqui,\" — disse o Grifo — \"ela quer saber a sua história, ela quer.\"</p><p>\"Vou contar a ela,\" — disse a Falsa Tartaruga num tom profundo e cavernoso — \"sentem-se, vocês dois, e não digam uma palavra até eu terminar.\"</p><p>Então se sentaram, e ninguém falou por alguns minutos. Alice pensou consigo mesma: \"Não vejo como ele pode _algum dia_ terminar, se não começa.\" Mas esperou pacientemente.</p><p>\"Uma vez,\" — disse por fim a Falsa Tartaruga, com um profundo suspiro — \"eu era uma Tartaruga de verdade.\"</p><p>A essas palavras seguiu-se um silêncio muito longo, interrompido apenas por uma ocasional exclamação de \"Hjckrrh!\" do Grifo e pelo soluçar pesado e constante da Falsa Tartaruga. Alice esteve quase a ponto de se levantar e dizer: \"Obrigada, senhor, pela sua interessante história\", mas não pôde deixar de pensar que _devia_ haver mais coisa por vir; então ficou sentada, quieta, sem dizer nada.</p><p>\"Quando éramos pequenos,\" — continuou por fim a Falsa Tartaruga, mais calma, embora ainda soluçando um pouco de vez em quando — \"íamos à escola no mar. O mestre era uma velha Tartaruga — costumávamos chamá-lo de Cágado —\"</p><p>\"Por que o chamavam de Cágado, se ele não era um?\" — perguntou Alice.</p><p>\"Nós o chamávamos de Cágado porque ele nos ensinava,\" — disse a Falsa Tartaruga, zangada — \"realmente, você é muito obtusa!\"</p><p>\"Você devia se envergonhar de fazer uma pergunta tão simples,\" — acrescentou o Grifo; e então ambos ficaram sentados em silêncio olhando para a pobre Alice, que se sentia pronta a afundar no chão. Por fim o Grifo disse à Falsa Tartaruga: \"Toca pra frente, velho amigo! Não passe o dia todo nisso!\" E ele continuou com estas palavras:</p><p>\"Sim, íamos à escola no mar, embora você não acredite —\"</p><p>\"Eu nunca disse que não acreditava!\" — interrompeu Alice.</p><p>\"Disse, sim,\" — disse a Falsa Tartaruga.</p><p>\"Cale a boca!\" — acrescentou o Grifo, antes que Alice pudesse falar de novo.</p><p>A Falsa Tartaruga continuou. \"Tivemos a melhor das educações — na verdade, íamos à escola todos os dias —\"</p><p>\"_Eu_ também já fui a uma escola de dia,\" — disse Alice — \"não precisa ser tão orgulhosa assim.\"</p><p>\"Com extras?\" — perguntou a Falsa Tartaruga, um pouco ansiosa.</p><p>\"Sim,\" — disse Alice — \"aprendemos francês e música.\"</p><p>\"E lavagem?\" — disse a Falsa Tartaruga.</p><p>\"Certamente que não!\" — disse Alice, indignada.</p><p>\"Ah! Então a sua não era uma escola realmente boa,\" — disse a Falsa Tartaruga num tom de grande alívio. \"Na _nossa_, no fim da lista, havia 'Francês, música _e lavagem_ — extra'.\"</p><p>\"Você não deve ter precisado muito disso,\" — disse Alice — \"vivendo no fundo do mar.\"</p><p>\"Não podia arcar com o custo de aprender,\" — disse a Falsa Tartaruga com um suspiro. \"Só fiz o curso regular.\"</p><p><h2 id=\"a-escola-no-mar\">A Escola no Mar</h2></p><p>\"O que era isso?\" — indagou Alice.</p><p>\"Fiar e Contorcer, é claro, para começar,\" — respondeu a Falsa Tartaruga — \"e depois os diferentes ramos da Aritmética — Ambição, Distração, Enfeiamento e Zombaria.\"</p><p>\"Nunca ouvi falar de 'Enfeiamento',\" — arriscou Alice. \"O que é?\"</p><p>O Grifo ergueu as duas patas de surpresa. \"Quê! Nunca ouviu falar de enfeiar!\" — exclamou. \"Você sabe o que é embelezar, suponho?\"</p><p>\"Sim,\" — disse Alice, duvidosa — \"quer dizer — tornar — qualquer — coisa — mais bonita.\"</p><p>\"Bem, então,\" — continuou o Grifo — \"se você não sabe o que é enfeiar, você _é_ um simplório.\"</p><p>Alice não se sentiu encorajada a fazer mais perguntas sobre isso, então se voltou para a Falsa Tartaruga e disse: \"O que mais vocês tinham de aprender?\"</p><p>\"Bem, havia Mistério,\" — respondeu a Falsa Tartaruga, contando as matérias nas nadadeiras — \"Mistério, antigo e moderno, com Seografia; e depois Desenho — o mestre de Desenho era um velho congro, que costumava vir uma vez por semana: _ele_ nos ensinava Desenho, Esticamento e Desmaio em Espirais.\"</p><p>\"Como era _isso_?\" — disse Alice.</p><p>\"Bem, não posso mostrar para você eu mesmo,\" — disse a Falsa Tartaruga — \"sou rígido demais. E o Grifo nunca aprendeu.\"</p><p>\"Não tive tempo,\" — disse o Grifo — \"mas fui ao mestre de Clássicos. Ele era um velho caranguejo, _ele_ era.\"</p><p>\"Eu nunca fui a ele,\" — disse a Falsa Tartaruga com um suspiro — \"ele ensinava Riso e Pesar, como costumavam dizer.\"</p><p>\"Ensinava, sim, ensinava,\" — disse o Grifo, suspirando por sua vez; e ambas as criaturas esconderam o rosto nas patas.</p><p>\"E quantas horas por dia vocês faziam lições?\" — disse Alice, com pressa de mudar de assunto.</p><p>\"Dez horas no primeiro dia,\" — disse a Falsa Tartaruga — \"nove no seguinte, e assim por diante.\"</p><p>\"Que plano curioso!\" — exclamou Alice.</p><p>\"É por isso que se chamam lições,\" — observou o Grifo — \"porque diminuem de dia para dia.\"</p><p>Isso foi uma ideia inteiramente nova para Alice, e ela pensou um pouco antes de fazer a próxima observação. \"Então o décimo primeiro dia deve ter sido feriado?\"</p><p>\"Claro que foi,\" — disse a Falsa Tartaruga.</p><p>\"E como vocês se arranjaram no décimo segundo?\" — continuou Alice, ansiosamente.</p><p>\"Chega de lições,\" — interrompeu o Grifo num tom muito decidido — \"conte a ela alguma coisa sobre os jogos agora.\"\n</p>", "subsections": [{"level": 2, "title": "A Duquesa e suas Morais", "id": "a-duquesa-e-suas-morais"}, {"level": 2, "title": "A Rainha e as Execuções", "id": "a-rainha-e-as-execu-es"}, {"level": 2, "title": "O Grifo e a Falsa Tartaruga", "id": "o-grifo-e-a-falsa-tartaruga"}, {"level": 2, "title": "A Escola no Mar", "id": "a-escola-no-mar"}], "readTime": "11 min"}, {"type": "chapter", "title": "Chapter X: Chapter X", "html": "<p>\n<h2 id=\"a-quadrilha-da-lagosta\">A Quadrilha da Lagosta</h2></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-quadrilha-da-lagosta\">A Quadrilha da Lagosta</a></li></ul></div><p>A Tartaruga Fingida suspirou profundamente e passou o dorso de uma das nadadeiras sobre os olhos. Olhou para Alice e tentou falar, mas, por um minuto ou dois, os soluços lhe entupiram a voz. \"Como se tivesse uma espinha na garganta\", disse o Grifo; e pôs-se a sacudi-lo e a dar-lhe socos nas costas. Por fim, a Tartaruga Fingida recuperou a voz e, com as lágrimas escorrendo pelas bochechas, continuou:</p><p>— Talvez você nunca tenha vivido muito tempo sob o mar — (\"não vivi\", disse Alice) — e talvez nunca tenha sido apresentada a uma lagosta — (Alice começou a dizer \"uma vez eu provei uma...\", mas conteve-se depressa e disse \"não, nunca\") —, então não pode ter ideia de que coisa deliciosa é uma Quadrilha da Lagosta!</p><p>— Não, de fato — disse Alice. — Que tipo de dança é essa?</p><p>— Ora — disse o Grifo —, primeiro você forma uma fila ao longo da praia...</p><p>— Duas filas! — gritou a Tartaruga Fingida. — Focas, tartarugas, salmões e por aí vai; depois, quando você tiver tirado todas as águas-vivas do caminho...</p><p>— Isso geralmente leva algum tempo — interrompeu o Grifo.</p><p>— ...você avança duas vezes...</p><p>— Cada um com uma lagosta como par! — gritou o Grifo.</p><p>— Naturalmente — disse a Tartaruga Fingida —: avancem duas vezes, posicionem-se para os pares...</p><p>— ...troquem de lagosta e retirem-se na mesma ordem — continuou o Grifo.</p><p>— Então, sabe — prosseguiu a Tartaruga Fingida —, vocês jogam as...</p><p>— As lagostas! — gritou o Grifo, dando um salto no ar.</p><p>— ...o mais longe que puderem, mar adentro...</p><p>— Nadem atrás delas! — guinchou o Grifo.</p><p>— Dêem uma cambalhota no mar! — gritou a Tartaruga Fingida, cabriolando desvairadamente.</p><p>— Troquem de lagosta de novo! — berrou o Grifo a plenos pulmões.</p><p>— Voltem para a terra, e esse é o fim da primeira figura — disse a Tartaruga Fingida, baixando a voz de repente; e as duas criaturas, que haviam saltitado como loucas o tempo todo, sentaram-se de novo, muito tristes e quietas, e olharam para Alice.</p><p>— Deve ser uma dança muito bonita — disse Alice timidamente.</p><p>— Gostaria de ver um pouco dela? — disse a Tartaruga Fingida.</p><p>— Gostaria muito — disse Alice.</p><p>— Venha, vamos tentar a primeira figura! — disse a Tartaruga Fingida ao Grifo. — Podemos passar sem lagostas, sabe. Quem vai cantar?</p><p>— Ora, cante você — disse o Grifo. — Esqueci a letra.</p><p>Então começaram a dançar solenemente em círculos ao redor de Alice, pisando de vez em quando nos pés dela quando passavam perto demais, e agitando as patas dianteiras para marcar o compasso, enquanto a Tartaruga Fingida cantava isto, muito devagar e triste:</p><blockquote>\n\"Você não anda um pouco mais depressa?\" disse uma pescadinha a um caracol.\n\"Há um boto bem atrás de nós, e ele está pisando no meu rabo.\nVeja como as lagostas e as tartarugas avançam com ardor!\nEstão esperando na praia de seixos — você não vem se juntar à dança?\nVem, não vem? Vem, não vem? Você não vem dançar?\nVem, não vem? Vem, não vem? Você não vem, não dançar?\n</blockquote>\n&gt;\n<blockquote>\n\"Você não pode fazer ideia de como será delicioso\nQuando nos pegarem e nos atirarem, com as lagostas, mar adentro!\"\nMas o caracol respondeu \"Longe demais, longe demais!\" e lançou um olhar de esguelha —\nDisse que agradecia à pescadinha com gentileza, mas que não entraria na dança.\nNão entraria, não podia, não entraria, não podia, não entraria na dança.\nNão entraria, não podia, não entraria, não podia, não podia entrar na dança.\n</blockquote>\n&gt;\n<blockquote>\n\"Que importa quão longe vamos?\" respondeu seu amigo escamoso.\n\"Há outra praia, você sabe, do outro lado.\nQuanto mais longe da Inglaterra, mais perto se está da França —\nEntão não empalideça, caracol querido, venha se juntar à dança.\nVem, não vem? Vem, não vem? Você não vem dançar?\nVem, não vem? Vem, não vem? Você não vem, não dançar?\"\n</blockquote><p>— Obrigada, é uma dança muito interessante de assistir — disse Alice, sentindo-se muito contente por ter acabado: — e eu gosto tanto daquela canção curiosa sobre a pescadinha!</p><p>— Ah, quanto à pescadinha — disse a Tartaruga Fingida —, elas... você já as viu, é claro?</p><p>— Sim — disse Alice —, já as vi muitas vezes no jan... — conteve-se depressa.</p><p>— Não sei onde fica Janta — disse a Tartaruga Fingida —, mas se você as viu tantas vezes, naturalmente sabe como elas são.</p><p>— Acho que sim — respondeu Alice, pensativa. — Elas têm o rabo na boca... e estão todas cobertas de migalhas.</p><p>— Você está enganada quanto às migalhas — disse a Tartaruga Fingida —: as migalhas se lavariam todas no mar. Mas elas _têm_ o rabo na boca; e a razão é... — aqui a Tartaruga Fingida bocejou e fechou os olhos. — Conte a ela a razão e tudo o mais — disse ao Grifo.</p><p>— A razão é — disse o Grifo — que elas _insistiram_ em ir com as lagostas ao baile. Então foram atiradas ao mar. Então tiveram de cair de muito alto. Então ficaram com o rabo preso na boca. Então não conseguiram tirá-lo de lá. É só isso.</p><p>— Obrigada — disse Alice —, é muito interessante. Nunca soube tanta coisa sobre uma pescadinha antes.</p><p>— Posso lhe contar mais do que isso, se quiser — disse o Grifo. — Sabe por que ela se chama pescadinha?</p><p>— Nunca pensei nisso — disse Alice. — Por quê?</p><p>—_Ela engraxa botas e sapatos_ — respondeu o Grifo, muito solenemente.</p><p>Alice ficou completamente perplexa. \"Engraxa botas e sapatos!\", repetiu em tom de espanto.</p><p>— Ora, com que são engraxados os _seus_ sapatos? — disse o Grifo. — Quero dizer, o que os deixa tão brilhantes?</p><p>Alice olhou para eles e pensou um pouco antes de responder. \"São engraxados com graxa preta, creio.\"</p><p>— Botas e sapatos, sob o mar — prosseguiu o Grifo em voz grave —, são engraxados com uma pescadinha. Agora você sabe. <em>[N.T.: no original, o trocadilho se perde: \"whiting\" designa tanto o peixe quanto o pó branco usado para polir botas.]</em></p><p>— E de que são feitos? — perguntou Alice, em tom de grande curiosidade.</p><p>— De solas e enguias, é claro — respondeu o Grifo, bastante impaciente: — qualquer camarão poderia ter-lhe dito isso.</p><p>— Se eu fosse a pescadinha — disse Alice, com os pensamentos ainda na canção —, eu teria dito ao boto: \"Para trás, por favor: não queremos _você_ conosco!\"</p><p>— Elas eram obrigadas a tê-lo com elas — disse a Tartaruga Fingida: — nenhum peixe sensato iria a qualquer lugar sem um boto.</p><p>— Será mesmo? — disse Alice, muito surpresa.</p><p>— É claro que não — disse a Tartaruga Fingida: — ora, se um peixe viesse a _mim_ e me dissesse que ia fazer uma viagem, eu diria \"Com que boto?\"</p><p>— Não quer dizer \"com que propósito\"? — disse Alice.</p><p>— Digo o que digo — respondeu a Tartaruga Fingida, em tom ofendido. E o Grifo acrescentou: — Vamos, conte-nos algumas de _suas_ aventuras.</p><p>— Eu poderia contar minhas aventuras — começando por esta manhã — disse Alice, um pouco timidamente: — mas não adianta voltar a ontem, porque eu era uma pessoa diferente naquela época.</p><p>— Explique tudo isso — disse a Tartaruga Fingida.</p><p>— Não, não! Primeiro as aventuras — disse o Grifo, em tom impaciente: — explicações tomam um tempo terrível.</p><p>Então Alice começou a contar-lhes suas aventuras desde o momento em que vira o Coelho Branco pela primeira vez. No começo ficou um pouco nervosa, porque as duas criaturas se aproximaram tanto dela, uma de cada lado, e abriram os olhos e as bocas tão _enormemente_ largos, mas foi ganhando coragem à medida que prosseguia. Seus ouvintes ficaram perfeitamente quietos até ela chegar à parte em que repetia \"_Você é velho, Padre William_\" para a Lagarta, com todas as palavras saindo diferentes; então a Tartaruga Fingida respirou fundo e disse: \"Isso é muito curioso.\"</p><p>— É tudo o mais curioso que pode ser — disse o Grifo.</p><p>— Tudo saiu diferente! — repetiu a Tartaruga Fingida, pensativa. — Gostaria de ouvi-la tentar repetir alguma coisa agora. Diga a ela para começar. — Olhou para o Grifo como se achasse que ele tinha alguma espécie de autoridade sobre Alice.</p><p>— Levante-se e repita \"_É a voz do Preguiçoso_\" — disse o Grifo.</p><p>\"Como as criaturas dão ordens à gente e fazem a gente repetir lições!\", pensou Alice; \"bem que eu poderia estar na escola.\" Contudo, levantou-se e começou a repetir, mas sua cabeça estava tão cheia da Quadrilha da Lagosta que ela mal sabia o que dizia, e as palavras saíram muito esquisitas, de fato:</p><blockquote>\n\"É a voz da Lagosta; ouvi-a declarar:\n'Você me assou demais, preciso açucarar o cabelo.'\nComo um pato com as pálpebras, assim ele, com o nariz,\nApara o cinto e os botões, e vira as pontas dos pés para fora.\"\n</blockquote><p>[as edições posteriores continuam assim:</p><blockquote>\nQuando as areias estão todas secas, ele está alegre como uma cotovia,\nE fala em tons desdenhosos do Tubarão;\nMas, quando a maré sobe e há tubarões por perto,\nSua voz tem um som tímido e trêmulo.]\n</blockquote><p>— Isso é diferente do que _eu_ costumava dizer quando era criança — disse o Grifo.</p><p>— Bem, nunca ouvi isso antes — disse a Tartaruga Fingida —, mas soa como um absurdo incomum.</p><p>Alice não disse nada; sentara-se com o rosto entre as mãos, pensando se algo voltaria a acontecer de modo natural _alguma vez_.</p><p>— Gostaria que isso fosse explicado — disse a Tartaruga Fingida.</p><p>— Ela não pode explicar — disse o Grifo, apressado. — Continue com a próxima estrofe.</p><p>— Mas e as pontas dos pés dele? — insistiu a Tartaruga Fingida. — Como _pôde_ virá-las para fora com o nariz, sabe?</p><p>— É a primeira posição da dança — disse Alice; mas ficou terrivelmente confusa com toda aquela situação e ansiava por mudar de assunto.</p><p>— Continue com a próxima estrofe — repetiu o Grifo, impaciente: — ela começa com \"_Passei pelo jardim dele_.\"</p><p>Alice não ousou desobedecer, embora tivesse certeza de que tudo sairia errado, e continuou com voz trêmula:</p><blockquote>\n\"Passei pelo jardim dele e observei, com um olho só,\nComo a Coruja e a Pantera repartiam uma torta —\"\n</blockquote><p>[as edições posteriores continuam assim:</p><blockquote>\nA Pantera ficou com a crosta, o molho e a carne,\nEnquanto a Coruja teve o prato como sua parte no agrado.\nQuando a torta ficou toda pronta, a Coruja, como um favor,\nFoi gentilmente permitida a embolsar a colher:\nEnquanto a Pantera recebeu faca e garfo com um rosnado,\nE concluiu o banquete —]\n</blockquote><p>— De que adianta repetir toda essa bobagem — interrompeu a Tartaruga Fingida —, se você não explica à medida que vai? É de longe a coisa mais confusa que _já_ ouvi!</p><p>— Sim, acho melhor você parar — disse o Grifo; e Alice ficou mais do que contente em fazê-lo.</p><p>— Vamos tentar outra figura da Quadrilha da Lagosta? — prosseguiu o Grifo. — Ou você preferiria que a Tartaruga Fingida lhe cantasse uma canção?</p><p>— Oh, uma canção, por favor, se a Tartaruga Fingida for tão gentil — respondeu Alice, com tanto entusiasmo que o Grifo disse, num tom bastante ofendido: — Hum! Gosto não se discute! Cante a \"_Sopa de Tartaruga_\" para ela, quer fazer isso, meu velho?</p><p>A Tartaruga Fingida suspirou profundamente e começou, com a voz ora engasgada de soluços, a cantar isto:</p><blockquote>\n\"Bela Sopa, tão rica e verde,\nEsperando numa sopeira quente!\nQuem por tais manjares não se curvaria?\nSopa da noite, bela Sopa!\nSopa da noite, bela Sopa!\n    Be-e-la So-o-pa!\n    Be-e-la So-o-pa!\nSo-o-pa da no-i-te,\n    Bela, bela Sopa!\n</blockquote>\n&gt;\n<blockquote>\n\"Bela Sopa! Quem se importa com peixe,\nCaça, ou qualquer outro prato?\nQuem não daria tudo por dois\ntostões de bela Sopa?\nApenas dois tostões de bela Sopa?\n    Be-e-la So-o-pa!\n    Be-e-la So-o-pa!\nSo-o-pa da no-i-te,\n    Bela, be-la SO-PA!\"\n</blockquote><p>— O refrão de novo! — gritou o Grifo; e a Tartaruga Fingida mal começara a repeti-lo quando se ouviu ao longe um grito: \"O julgamento está começando!\"</p><p>— Venha! — gritou o Grifo e, tomando Alice pela mão, saiu correndo, sem esperar o fim da canção.</p><p>— Que julgamento é esse? — ofegou Alice enquanto corria; mas o Grifo apenas respondeu \"Venha!\" e correu ainda mais depressa, enquanto, cada vez mais fracas, chegavam, levadas pela brisa que os seguia, as palavras melancólicas:</p><blockquote>\n\"So-o-pa da no-i-te,\n    Bela, bela Sopa!\"\n</blockquote>\n</p>", "subsections": [{"level": 2, "title": "A Quadrilha da Lagosta", "id": "a-quadrilha-da-lagosta"}], "readTime": "10 min"}, {"type": "chapter", "title": "Capítulo XI: Quem Roubou as Tortas?", "html": "<p>\n<h2 id=\"o-tribunal\">O tribunal</h2></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#o-tribunal\">O tribunal</a></li><li class=\"mt-2\"><a href=\"#a-acusa-o\">A acusação</a></li><li class=\"mt-2\"><a href=\"#o-chapeleiro-dep-e\">O Chapeleiro depõe</a></li><li class=\"mt-3\"><a href=\"#a-rainha-interv-m\">A Rainha intervém</a></li><li class=\"mt-2\"><a href=\"#a-cozinheira-da-duquesa\">A cozinheira da Duquesa</a></li><li class=\"mt-2\"><a href=\"#alice-convocada\">Alice é convocada</a></li></ul></div><p>Quando chegaram, o Rei e a Rainha de Copas já estavam sentados em seus tronos, com uma grande multidão reunida ao redor deles — toda espécie de passarinhos e bichinhos, além do baralho inteiro de cartas: o Valete estava diante deles, acorrentado, com um soldado de cada lado para guardá-lo; e, perto do Rei, estava o Coelho Branco, com uma trombeta em uma das mãos e um rolo de pergaminho na outra. Bem no centro do tribunal havia uma mesa com um grande prato de tortas em cima: pareciam tão boas que deram fome em Alice só de olhar para elas. \"Quem dera que terminassem logo o julgamento\", pensou ela, \"e servissem os refrescos!\" Mas não parecia haver chance alguma disso, então ela começou a observar tudo ao seu redor para passar o tempo.</p><p>Alice nunca tinha estado num tribunal de justiça antes, mas já lera sobre eles em livros, e ficou muito satisfeita ao descobrir que sabia o nome de quase tudo ali. \"Aquele é o juiz\", disse consigo mesma, \"por causa de sua grande peruca.\" O juiz, aliás, era o Rei; e, como usava a coroa por cima da peruca (veja o frontispício, se quiser saber como ele fazia isso), não parecia nada confortável, e certamente não lhe caía bem. \"E aquilo é o banco dos jurados\", pensou Alice, \"e aquelas doze criaturas\" (ela era obrigada a dizer \"criaturas\", veja bem, porque alguns eram animais e outros eram pássaros) \"suponho que sejam os jurados.\" Ela repetiu essa última palavra duas ou três vezes para si mesma, sentindo-se bastante orgulhosa dela: pois achava — e com razão — que pouquíssimas meninas da sua idade sabiam ao menos o que ela significava. No entanto, \"jurados\" teria funcionado igualmente bem.</p><p>Os doze jurados escreviam todos, muito atarefados, em suas lousas. \"O que estão fazendo?\", sussurrou Alice ao Grifo. \"Não podem ter nada para anotar ainda, antes de o julgamento começar.\" \"Estão anotando seus nomes\", respondeu o Grifo em sussurro, \"com medo de esquecê-los antes do fim do julgamento.\" \"Coisas estúpidas!\", começou Alice em voz alta e indignada, mas parou rapidamente, pois o Coelho Branco gritou: \"Silêncio no tribunal!\" E o Rei pôs os óculos e olhou em volta, ansioso, para descobrir quem estava falando.</p><p>Alice podia ver, como se estivesse olhando por cima dos ombros deles, que todos os jurados escreviam \"coisas estúpidas!\" em suas lousas, e pôde até perceber que um deles não sabia soletrar \"estúpido\" e precisou pedir ao vizinho que lhe dissesse. \"Que bela bagunça vão ser essas lousas antes de o julgamento acabar!\", pensou Alice. Um dos jurados tinha um lápis que chiava. Isso, naturalmente, Alice <em>não</em> pôde suportar, e ela deu a volta no tribunal, ficou atrás dele e logo encontrou uma oportunidade de tomá-lo. Ela o fez tão depressa que o pobre juradinho (era Bill, o Lagarto) não conseguiu descobrir de jeito nenhum o que havia acontecido com ele; assim, depois de procurá-lo por toda parte, viu-se obrigado a escrever com um dedo pelo resto do dia; e isso era de pouquíssima utilidade, pois não deixava marca alguma na lousa.</p><p><h2 id=\"a-acusa-o\">A acusação</h2></p><p>\"Arauto, leia a acusação!\", disse o Rei. Com isso, o Coelho Branco soprou três vezes a trombeta e, então, desenrolou o rolo de pergaminho e leu o seguinte:</p><blockquote>\nA Rainha de Copas fez umas tortas,\n    Todas num dia de verão;\nO Valete de Copas roubou essas tortas\n    E as levou para longe!\n</blockquote><p>\"Considerem seu veredito\", disse o Rei ao júri. \"Ainda não, ainda não!\", interrompeu o Coelho às pressas. \"Há muita coisa antes disso!\" \"Chamem a primeira testemunha\", disse o Rei; e o Coelho Branco soprou três vezes a trombeta e gritou: \"Primeira testemunha!\"</p><p><h2 id=\"o-chapeleiro-dep-e\">O Chapeleiro depõe</h2></p><p>A primeira testemunha era o Chapeleiro. Ele entrou com uma xícara de chá em uma das mãos e um pedaço de pão com manteiga na outra. \"Peço perdão, Majestade\", começou, \"por trazer estas coisas: é que eu não tinha terminado meu chá quando fui convocado.\" \"Você devia ter terminado\", disse o Rei. \"Quando começou?\" O Chapeleiro olhou para a Lebre de Março, que o seguira até o tribunal, de braços dados com o Arganaz. \"Catorze de março, <em>acho</em> eu\", disse ele. \"Quinze\", disse a Lebre de Março. \"Dezesseis\", acrescentou o Arganaz.</p><p>\"Escrevam isso\", disse o Rei ao júri, e o júri anotou avidamente as três datas em suas lousas e, em seguida, somou tudo e reduziu o resultado a xelins e pence. \"Tire o chapéu\", disse o Rei ao Chapeleiro. \"Não é meu\", disse o Chapeleiro. \"<em>Roubado!</em>\", exclamou o Rei, virando-se para o júri, que imediatamente registrou o fato. \"Guardo-os para vender\", acrescentou o Chapeleiro, a título de explicação; \"não tenho nenhum meu. Sou chapeleiro.\" Nesse momento, a Rainha pôs os óculos e começou a encarar o Chapeleiro, que empalideceu e se remexeu, inquieto. \"Preste seu depoimento\", disse o Rei; \"e não fique nervoso, ou mando executá-lo na hora.\"</p><p>Isso não pareceu encorajar a testemunha em nada: ele não parava de mudar o peso de um pé para o outro, olhando inquieto para a Rainha, e, na confusão, mordeu um grande pedaço da xícara em vez do pão com manteiga. Foi nesse exato momento que Alice sentiu uma sensação muito curiosa, que a intrigou bastante até ela descobrir o que era: estava começando a crescer de novo, e a princípio pensou em se levantar e sair do tribunal; mas, refletindo melhor, decidiu permanecer onde estava enquanto houvesse espaço para ela. \"Queria que você não se apertasse tanto\", disse o Arganaz, que estava sentado ao lado dela. \"Mal consigo respirar.\" \"Não posso evitar\", disse Alice, muito humildemente: \"estou crescendo.\" \"Você não tem o direito de crescer <em>aqui</em>\", disse o Arganaz. \"Não diga bobagens\", disse Alice, com mais coragem: \"você sabe que está crescendo também.\" \"Sim, mas <em>eu</em> cresço num ritmo razoável\", disse o Arganaz: \"não desse jeito ridículo.\" E ele se levantou, muito amuado, e atravessou para o outro lado do tribunal.</p><p><h3 id=\"a-rainha-interv-m\">A Rainha intervém</h3></p><p>Durante todo esse tempo, a Rainha não parara de encarar o Chapeleiro e, bem quando o Arganaz atravessava o tribunal, ela disse a um dos oficiais: \"Tragam-me a lista dos cantores do último concerto!\" Com isso, o pobre Chapeleiro tremeu tanto que sacudiu os dois sapatos dos pés. \"Preste seu depoimento\", repetiu o Rei, zangado, \"ou mando executá-lo, esteja você nervoso ou não.\" \"Sou um homem pobre, Majestade\", começou o Chapeleiro, com voz trêmula, \"e eu não tinha começado meu chá — não fazia mais de uma semana — e, com o pão com manteiga ficando tão fino — e o cintilar do chá...\" \"O cintilar do <em>quê?</em>\", disse o Rei. \"<em>Começou</em> com o chá\", respondeu o Chapeleiro. \"É claro que cintilar começa com C!\", disse o Rei, cortante. \"Você me toma por um tolo? Continue!\"</p><p>\"Sou um homem pobre\", continuou o Chapeleiro, \"e depois disso quase tudo cintilou — só que a Lebre de Março disse...\" \"Eu não disse!\", interrompeu a Lebre de Março, apressadíssima. \"Disse sim!\", disse o Chapeleiro. \"Nego!\", disse a Lebre de Março. \"Ela nega\", disse o Rei: \"deixe essa parte de fora.\" \"Bem, de qualquer forma, o Arganaz disse...\", continuou o Chapeleiro, olhando em volta, ansioso, para ver se ele também negaria: mas o Arganaz não negou nada, pois estava profundamente adormecido. \"Depois disso\", prosseguiu o Chapeleiro, \"cortei mais um pouco de pão com manteiga...\" \"Mas o que o Arganaz disse?\", perguntou um dos jurados. \"Isso eu não consigo lembrar\", disse o Chapeleiro. \"Você <em>deve</em> lembrar\", observou o Rei, \"ou mando executá-lo.\" O infeliz Chapeleiro deixou cair a xícara e o pão com manteiga e caiu de joelhos. \"Sou um homem pobre, Majestade\", começou.</p><p>\"Você é um <em>pobre</em> <em>orador</em>\", disse o Rei. Nesse momento, um dos porquinhos-da-índia soltou um viva e foi imediatamente contido pelos oficiais do tribunal. (Como essa é uma palavra um tanto difícil, vou explicar como se fazia. Eles tinham um grande saco de lona, amarrado na boca com cordões: dentro dele enfiavam o porquinho-da-índia, de cabeça para baixo, e então se sentavam em cima dele.) \"Que bom que vi isso acontecer\", pensou Alice. \"Já li tantas vezes nos jornais, no fim dos julgamentos: 'houve algumas tentativas de aplauso, imediatamente contidas pelos oficiais do tribunal', e nunca entendi o que isso queria dizer até agora.\" \"Se é só isso que você sabe sobre o assunto, pode se retirar\", continuou o Rei. \"Não posso descer mais\", disse o Chapeleiro: \"já estou no chão, como se vê.\" \"Então pode <em>sentar</em>-se\", respondeu o Rei. Nesse momento, o outro porquinho-da-índia soltou um viva e foi contido. \"Ora, isso acabou com os porquinhos-da-índia!\", pensou Alice. \"Agora vamos progredir melhor.\" \"Prefiro terminar meu chá\", disse o Chapeleiro, com um olhar aflito para a Rainha, que lia a lista dos cantores. \"Pode ir\", disse o Rei, e o Chapeleiro saiu às pressas do tribunal, sem sequer esperar para calçar os sapatos. \"— e cortem-lhe a cabeça lá fora\", acrescentou a Rainha a um dos oficiais: mas o Chapeleiro já havia sumido de vista antes de o oficial chegar à porta. \"Chamem a próxima testemunha!\", disse o Rei.</p><p><h2 id=\"a-cozinheira-da-duquesa\">A cozinheira da Duquesa</h2></p><p>A próxima testemunha era a cozinheira da Duquesa. Ela trazia a pimenteira na mão, e Alice adivinhou quem era antes mesmo de ela entrar no tribunal, pelo jeito como as pessoas perto da porta começaram a espirrar todas ao mesmo tempo. \"Preste seu depoimento\", disse o Rei. \"Não vou\", disse a cozinheira. O Rei olhou, ansioso, para o Coelho Branco, que disse em voz baixa: \"Vossa Majestade precisa interrogar <em>esta</em> testemunha.\" \"Bem, se é preciso, é preciso\", disse o Rei, com um ar melancólico, e, depois de cruzar os braços e franzir a testa para a cozinheira até quase sumirem os olhos, disse em voz grave: \"Do que são feitas as tortas?\" \"Pimenta, em sua maior parte\", disse a cozinheira. \"Melaço\", disse uma voz sonolenta atrás dela.</p><p>\"Peguem esse Arganaz!\", gritou a Rainha. \"Decapitem esse Arganaz! Ponham esse Arganaz para fora do tribunal! Contenham-no! Apertem-no! Arranquem-lhe os bigodes!\" Durante alguns minutos, todo o tribunal esteve em confusão, pondo o Arganaz para fora, e, quando enfim se acalmaram, a cozinheira havia desaparecido. \"Não importa!\", disse o Rei, com um ar de grande alívio. \"Chamem a próxima testemunha.\" E acrescentou em voz baixa à Rainha: \"Francamente, minha querida, <em>você</em> vai ter que interrogar a próxima testemunha. Isso me dá uma dor terrível na testa!\"</p><p><h2 id=\"alice-convocada\">Alice é convocada</h2></p><p>Alice observou o Coelho Branco enquanto ele remexia na lista, sentindo muita curiosidade para ver como seria a próxima testemunha, \"pois <em>ainda</em> não têm muita prova\", disse consigo mesma. Imaginem sua surpresa quando o Coelho Branco leu, no topo de sua vozinha estridente, o nome \"Alice!\"\n</p>", "subsections": [{"level": 2, "title": "O tribunal", "id": "o-tribunal"}, {"level": 2, "title": "A acusação", "id": "a-acusa-o"}, {"level": 2, "title": "O Chapeleiro depõe", "id": "o-chapeleiro-dep-e"}, {"level": 3, "title": "A Rainha intervém", "id": "a-rainha-interv-m"}, {"level": 2, "title": "A cozinheira da Duquesa", "id": "a-cozinheira-da-duquesa"}, {"level": 2, "title": "Alice é convocada", "id": "alice-convocada"}], "readTime": "8 min"}, {"type": "chapter", "title": "Capítulo XII: A Evidência de Alice", "html": "<p>\n\"Aqui!\" gritou Alice, esquecendo-se por completo, na confusão do momento, de quanto havia crescido nos últimos minutos, e pulou com tanta pressa que derrubou o banco dos jurados com a barra da saia, atirando todos os jurados sobre as cabeças da multidão lá embaixo, onde ficaram espalhados, lembrando-a muito de um aquário de peixinhos dourados que ela derrubara sem querer na semana anterior.</p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-regra-quarenta-e-dois\">A Regra Quarenta e Dois</a></li><li class=\"mt-2\"><a href=\"#a-carta-e-os-versos\">A carta e os versos</a></li><li class=\"mt-2\"><a href=\"#o-veredicto\">O veredicto</a></li><li class=\"mt-2\"><a href=\"#o-despertar\">O despertar</a></li><li class=\"mt-2\"><a href=\"#o-sonho-da-irm-\">O sonho da irmã</a></li></ul></div><p>\"Oh, _perdão_!\" exclamou ela, em tom de grande consternação, e começou a apanhá-los de novo o mais depressa que pôde, pois o acidente do aquário continuava a lhe passar pela cabeça, e ela tinha a vaga ideia de que precisavam ser recolhidos imediatamente e postos de volta no banco dos jurados, senão morreriam.</p><p>\"O julgamento não pode prosseguir\", disse o Rei, em voz muito grave, \"até que todos os jurados estejam de volta aos seus devidos lugares—_todos_\", repetiu com grande ênfase, olhando firme para Alice enquanto dizia.</p><p>Alice olhou para o banco dos jurados e viu que, na pressa, pusera o Lagarto de cabeça para baixo, e o pobrezinho balançava o rabo de modo melancólico, sem conseguir se mover. Ela logo o tirou de lá e o endireitou; \"não que faça muita diferença\", disse consigo mesma; \"acho que ele seria _igualmente_ útil no julgamento de cabeça para cima ou para baixo.\"</p><p>Assim que os jurados se recuperaram um pouco do choque de terem sido derrubados, e suas lousas e lápis foram encontrados e devolvidos, puseram-se a trabalhar com muito empenho para escrever uma história do acidente, todos menos o Lagarto, que parecia por demais abatido para fazer qualquer coisa além de ficar sentado de boca aberta, olhando para o teto do tribunal.</p><p>\"O que você sabe deste caso?\" disse o Rei a Alice.</p><p>\"Nada\", disse Alice.</p><p>\"Nada _mesmo_?\" insistiu o Rei.</p><p>\"Nada mesmo\", disse Alice.</p><p>\"Isso é muito importante\", disse o Rei, voltando-se para os jurados. Eles estavam justamente começando a anotar isso nas lousas quando o Coelho Branco interrompeu: \"_Des_importante, Vossa Majestade quer dizer, naturalmente\", disse em tom muito respeitoso, mas franzindo a testa e fazendo caretas para ele enquanto falava.</p><p>\"_Des_importante, naturalmente, era o que eu queria dizer\", apressou-se o Rei, e continuou consigo mesmo, em voz baixa: \"importante-desimportante-desimportante-importante\", como se estivesse experimentando qual palavra soava melhor.</p><p>Alguns jurados anotaram \"importante\", e outros \"desimportante\". Alice podia ver isso, pois estava perto o bastante para espiar as lousas; \"mas não faz a menor diferença\", pensou consigo mesma.</p><p><h2 id=\"a-regra-quarenta-e-dois\">A Regra Quarenta e Dois</h2></p><p>Nesse momento, o Rei, que estivera por algum tempo escrevendo atarefadamente em seu caderno, grasnou \"Silêncio!\" e leu do livro: \"Regra Quarenta e Dois. _Todas as pessoas com mais de uma milha de altura devem deixar o tribunal_.\"</p><p>Todos olharam para Alice.</p><p>\"_Eu_ não tenho uma milha de altura\", disse Alice.</p><p>\"Tem, sim\", disse o Rei.</p><p>\"Quase duas milhas de altura\", acrescentou a Rainha.</p><p>\"Bem, de qualquer modo, não vou sair\", disse Alice; \"além disso, essa não é uma regra de verdade: você a inventou agora mesmo.\"</p><p>\"É a regra mais antiga do livro\", disse o Rei.</p><p>\"Então devia ser a Regra Número Um\", disse Alice.</p><p>O Rei ficou pálido e fechou o caderno às pressas. \"Considerem seu veredicto\", disse aos jurados, em voz baixa e trêmula.</p><p><h2 id=\"a-carta-e-os-versos\">A carta e os versos</h2></p><p>\"Ainda há mais provas por vir, por favor, Vossa Majestade\", disse o Coelho Branco, levantando-se numa grande pressa; \"este papel acaba de ser encontrado.\"</p><p>\"O que há nele?\" disse a Rainha.</p><p>\"Ainda não o abri\", disse o Coelho Branco, \"mas parece ser uma carta, escrita pelo prisioneiro a—a alguém.\"</p><p>\"Tinha de ser isso\", disse o Rei, \"a menos que tivesse sido escrita a ninguém, o que não é costume, sabe.\"</p><p>\"A quem é endereçada?\" disse um dos jurados.</p><p>\"Não tem endereço nenhum\", disse o Coelho Branco; \"na verdade, não há nada escrito no _lado de fora_.\" Desdobrou o papel enquanto falava e acrescentou: \"Afinal, não é uma carta: é um conjunto de versos.\"</p><p>\"São da caligrafia do prisioneiro?\" perguntou outro dos jurados.</p><p>\"Não, não são\", disse o Coelho Branco, \"e essa é a coisa mais esquisita de todas.\" (Os jurados todos ficaram com cara de perplexos.)</p><p>\"Ele deve ter imitado a letra de outra pessoa\", disse o Rei. (Os jurados todos se animaram de novo.)</p><p>\"Por favor, Vossa Majestade\", disse o Valete, \"não fui eu que escrevi, e não podem provar que fui: não há nome assinado no fim.\"</p><p>\"Se você não assinou\", disse o Rei, \"isso só piora as coisas. Você _deve_ ter pretendido alguma maldade, ou teria assinado seu nome como um homem honesto.\"</p><p>Houve uma salva geral de palmas: era a primeira coisa realmente inteligente que o Rei dissera naquele dia.</p><p>\"Isso _prova_ a culpa dele\", disse a Rainha.</p><p>\"Não prova nada disso!\" disse Alice. \"Ora, vocês nem sabem do que se trata!\"</p><p>\"Leia-os\", disse o Rei.</p><p>O Coelho Branco pôs os óculos. \"Por onde começo, por favor, Vossa Majestade?\" perguntou.</p><p>\"Comece pelo começo\", disse o Rei gravemente, \"e continue até chegar ao fim: então pare.\"</p><p>Estes eram os versos que o Coelho Branco leu:</p><p>\"Disseram-me que você estivera com ela,\nE me mencionara a ele:\nEla me deu boa referência,\nMas disse que eu não sabia nadar.</p><p>Ele lhes mandou dizer que eu não tinha ido\n(Sabemos que é verdade):\nSe ela tocasse o assunto adiante,\nO que seria de você?</p><p>Eu dei um a ela, eles deram dois a ele,\nVocê nos deu três ou mais;\nTodos voltaram dele para você,\nEmbora fossem meus antes.</p><p>Se eu ou ela viéssemos a estar\nEnvolvidos neste caso,\nEle confia em você para libertá-los,\nExatamente como estávamos.</p><p>Minha ideia era que você estivera\n(Antes que ela tivesse esse acesso)\nUm obstáculo que se interpunha\nEntre ele, e nós, e isso.</p><p>Não deixe que ele saiba que ela os preferia,\nPois isso deve para sempre ser\nUm segredo, guardado de todos os demais,\nEntre você e mim.\"</p><p>\"Essa é a prova mais importante que ouvimos até agora\", disse o Rei, esfregando as mãos; \"então agora que o júri—\"</p><p>\"Se alguém for capaz de explicá-lo\", disse Alice (ela crescera tanto nos últimos minutos que não tinha o menor medo de interrompê-lo), \"eu dou seis pence a essa pessoa. _Eu_ não acredito que haja um átomo de sentido nisso.\"</p><p>Todos os jurados anotaram nas lousas: \"_Ela_ não acredita que haja um átomo de sentido nisso\", mas nenhum deles tentou explicar o papel.</p><p>\"Se não há sentido nisso\", disse o Rei, \"isso poupa um mundo de trabalho, sabe, já que não precisamos tentar encontrar nenhum. E ainda assim não sei\", continuou, estendendo os versos sobre o joelho e olhando-os com um olho só; \"parece-me ver algum sentido neles, afinal. '_Disse que eu não sabia nadar_'—você não sabe nadar, sabe?\" acrescentou, voltando-se para o Valete.</p><p>O Valete balançou a cabeça tristemente. \"Pareço alguém que sabe?\" disse. (O que certamente _não_ parecia, sendo feito inteiramente de papelão.)</p><p>\"Até aqui, tudo bem\", disse o Rei, e continuou murmurando os versos para si mesmo: \"'_Sabemos que é verdade_'—isso é o júri, naturalmente—'_Eu dei um a ela, eles deram dois a ele_'—ora, isso deve ser o que ele fez com as tortas, sabe—\"</p><p>\"Mas continua '_todos voltaram dele para você_'\", disse Alice.</p><p>\"Ora, ali estão elas!\" disse o Rei triunfante, apontando para as tortas na mesa. \"Nada pode ser mais claro do que _isso_. E então—'_antes que ela tivesse esse acesso_'—você nunca teve acessos, minha querida, não é?\" disse à Rainha.</p><p>\"Nunca!\" disse a Rainha furiosa, atirando um tinteiro no Lagarto enquanto falava. (O infeliz do pequeno Bill deixara de escrever na lousa com um dedo, pois descobrira que não fazia marca; mas agora recomeçava às pressas, usando a tinta que escorria pelo rosto, enquanto durasse.)</p><p>\"Então as palavras não lhe _assentam_\", disse o Rei, olhando em volta do tribunal com um sorriso. Houve um silêncio sepulcral.</p><p>\"É um trocadilho!\" acrescentou o Rei, num tom ofendido, e todos riram. \"Que o júri considere seu veredicto\", disse o Rei, pela vigésima vez naquele dia, aproximadamente.</p><p><h2 id=\"o-veredicto\">O veredicto</h2></p><p>\"Não, não!\" disse a Rainha. \"Primeiro a sentença—o veredicto depois.\"</p><p>\"Bobagem!\" disse Alice, em voz alta. \"Que ideia, dar a sentença primeiro!\"</p><p>\"Cale a boca!\" disse a Rainha, ficando roxa.</p><p>\"Não vou!\" disse Alice.</p><p>\"Cortem-lhe a cabeça!\" gritou a Rainha a plenos pulmões. Ninguém se mexeu.</p><p>\"Quem se importa com você?\" disse Alice (já tinha atingido seu tamanho normal nessa altura). \"Você não passa de um baralho de cartas!\"</p><p>A isso, o baralho inteiro ergueu-se no ar e veio voando sobre ela: ela deu um pequeno grito, metade de susto e metade de raiva, e tentou afastá-los, e deu por si deitada na margem, com a cabeça no colo da irmã, que afastava suavemente algumas folhas secas que tinham esvoaçado das árvores sobre seu rosto.</p><p><h2 id=\"o-despertar\">O despertar</h2></p><p>\"Acorde, Alice querida!\" disse a irmã; \"Ora, que sono comprido você teve!\"</p><p>\"Oh, tive um sonho tão curioso!\" disse Alice, e contou à irmã, o melhor que pôde lembrar, todas aquelas estranhas Aventuras suas que vocês acabaram de ler; e, quando terminou, a irmã a beijou e disse: \"Foi um sonho curioso, de fato, querida: mas agora vá correndo tomar seu chá; está ficando tarde.\"</p><p>Então Alice se levantou e saiu correndo, pensando enquanto corria, como era de se esperar, que sonho maravilhoso havia sido.</p><p>Mas a irmã ficou sentada, quieta, tal como ela a deixara, apoiando a cabeça na mão, observando o sol se pôr, e pensando na pequena Alice e em todas as suas maravilhosas Aventuras, até que também começou a sonhar, a seu modo, e este foi o seu sonho:</p><p><h2 id=\"o-sonho-da-irm-\">O sonho da irmã</h2></p><p>Primeiro, sonhou com a pequena Alice em pessoa, e mais uma vez as mãozinhas estavam unidas sobre seu colo, e os olhos vivos e ansiosos olhavam para cima, para os dela—ela podia ouvir os próprios tons da sua voz, e ver aquele estranho jeito de sacudir a cabeça para conter os cabelos vagabundos que _insistiam_ em cair-lhe nos olhos—e, enquan
