<script>
var BOOK = [{"type": "chapter", "title": "Capítulo I: Pela Toca do Coelho (*Down the Rabbit-Hole*)", "html": "<p>\nAlice estava começando a ficar muito cansada de estar sentada junto à irmã na margem do rio, sem ter nada para fazer: uma ou duas vezes espiara o livro que a irmã lia, mas ele não tinha figuras nem conversas, \"e de que serve um livro\", pensou Alice, \"sem figuras nem conversas?\"</p><p>Assim, ficou matutando consigo mesma (tanto quanto podia, pois o dia quente a deixava muito sonolenta e lerda) se o prazer de fazer uma guirlanda de margaridas valeria o trabalho de se levantar e colher as margaridas, quando, de repente, um Coelho Branco de olhos cor-de-rosa passou correndo bem perto dela.</p><p>Não havia nada de _muito_ notável nisso; nem Alice achou _muito_ fora do comum ouvir o Coelho dizer para si mesmo: \"Oh, meu Deus! Oh, meu Deus! Vou me atrasar!\" (quando pensou nisso mais tarde, ocorreu-lhe que deveria ter estranhado, mas na hora tudo parecera bastante natural); mas quando o Coelho efetivamente _tirou um relógio do bolso do colete_, olhou para ele e seguiu apressado, Alice se pôs de pé num salto, pois lhe passou pela cabeça que nunca vira um coelho com bolso no colete, ou com um relógio para tirar dele, e, ardendo de curiosidade, correu pelo campo atrás dele, e, por sorte, chegou bem a tempo de vê-lo mergulhar numa grande toca de coelho debaixo da sebe.</p><p>No instante seguinte, Alice desceu atrás dele, sem considerar uma única vez como diabo faria para sair de novo.</p><p>A toca do coelho seguia em frente como um túnel por um bom trecho e então despencava de repente, tão de repente que Alice não teve um momento para pensar em se deter antes de se ver caindo num poço muito fundo.</p><p>Ou o poço era muito fundo, ou ela caía muito devagar, pois teve tempo de sobra, enquanto descia, para olhar ao redor e imaginar o que ia acontecer em seguida. Primeiro tentou olhar para baixo e distinguir aonde estava indo, mas estava escuro demais para ver qualquer coisa; depois olhou as paredes do poço e notou que estavam repletas de armários e estantes de livros; aqui e ali via mapas e quadros pendurados em ganchos. Ao passar, tirou um pote de uma das prateleiras; nele estava escrito \"GELEIA DE LARANJA\", mas, para sua grande decepção, estava vazio: não quis soltar o pote com medo de matar alguém lá embaixo, então conseguiu pô-lo num dos armários enquanto caía por ali.</p><p>\"Bem!\", pensou Alice consigo mesma, \"depois de uma queda dessas, não vou achar nada cair escada abaixo! Como vão me achar corajosa em casa! Ora, eu não diria uma palavra sobre isso, mesmo que caísse do topo da casa!\" (O que era muito provavelmente verdade.)</p><p>Para baixo, para baixo, para baixo. Será que a queda _nunca_ teria fim? \"Quero saber quantas milhas já caí até agora!\", disse ela em voz alta. \"Devo estar chegando perto do centro da Terra. Vejamos: isso daria umas quatro mil milhas para baixo, acho...\" (pois, veja bem, Alice aprendera várias coisas desse tipo nas lições da escola, e, embora aquela não fosse uma _muito_ boa oportunidade para exibir seus conhecimentos, já que não havia ninguém para ouvi-la, ainda assim era um bom exercício repeti-los em voz alta) \"...sim, é mais ou menos essa a distância — mas então me pergunto em que Latitude ou Longitude vim parar!\" (Alice não fazia ideia do que era Latitude, nem Longitude, mas achava que eram palavras bonitas e imponentes de se dizer.)</p><p>Logo em seguida, recomeçou. \"Será que vou cair _atravessando_ a Terra inteira? Como vai ser engraçado sair no meio das pessoas que andam com a cabeça para baixo! As Antipatias, acho...\" (ela ficou até contente que _não_ houvesse ninguém escutando, desta vez, pois aquilo não soava nada como a palavra certa) \"...mas vou ter de perguntar a elas qual é o nome do país, sabem. Por favor, senhora, isto é a Nova Zelândia ou a Austrália?\" (e tentou fazer uma reverência enquanto falava — imagine _fazer reverência_ caindo pelo ar! Vocês acham que dariam conta?) \"E que menina ignorante ela vai me achar por perguntar! Não, não dá para perguntar: talvez eu veja isso escrito em algum lugar.\"</p><p>Para baixo, para baixo, para baixo. Não havia mais nada a fazer, então Alice logo voltou a falar. \"Diná vai sentir muito a minha falta esta noite, creio eu!\" (Diná era a gata.) \"Espero que se lembrem do pires de leite dela na hora do chá. Diná, minha querida! Queria que você estivesse aqui embaixo comigo! Receio que não haja ratos no ar, mas você poderia caçar um morcego, e morcego é bem parecido com rato, sabe. Mas será que gatos comem morcegos, eu me pergunto?\" E aqui Alice começou a ficar bastante sonolenta e ficou repetindo para si mesma, de um jeito sonhador: \"Gatos comem morcegos? Gatos comem morcegos?\" e às vezes: \"Morcegos comem gatos?\" pois, veja, como não conseguia responder a nenhuma das perguntas, não importava muito de que lado as formulasse. Sentiu que estava cochilando e acabara de começar a sonhar que caminhava de mãos dadas com Diná, dizendo-lhe muito séria: \"Agora, Diná, diga a verdade: você já comeu algum morcego?\" quando, de repente, tum! tum! aterrissou sobre um monte de gravetos e folhas secas, e a queda terminara.</p><p>Alice não se machucou nem um pouco e num instante pulou de pé: olhou para cima, mas estava tudo escuro acima dela; diante de si havia outro corredor comprido, e o Coelho Branco ainda estava à vista, correndo apressado por ele. Não havia um momento a perder: Alice saiu como o vento e chegou bem a tempo de ouvi-lo dizer, ao virar uma esquina: \"Oh, minhas orelhas e bigodes, como está ficando tarde!\" Estava bem atrás dele quando virou a esquina, mas o Coelho não estava mais à vista: encontrou-se num salão comprido e baixo, iluminado por uma fileira de lampiões pendurados no teto.</p><p>Havia portas por todo o salão, mas todas estavam trancadas; e, depois de percorrer um lado inteiro e voltar pelo outro, experimentando todas as portas, Alice andou tristemente pelo meio, imaginando como conseguiria sair dali.</p><p>De repente, deu com uma mesinha de três pés, toda de vidro maciço; não havia nada sobre ela, exceto uma chave dourada minúscula, e o primeiro pensamento de Alice foi que ela poderia pertencer a uma das portas do salão; mas, ai de mim! ou as fechaduras eram grandes demais, ou a chave era pequena demais, e de todo modo não abria nenhuma delas. Contudo, na segunda volta, deu com uma cortina baixa que não notara antes, e atrás dela havia uma portinhola de cerca de quinze polegadas de altura: experimentou a chave dourada na fechadura e, para sua imensa alegria, ela servia!</p><p>Alice abriu a porta e descobriu que ela dava para uma passagem pequena, não muito maior que um buraco de rato: ajoelhou-se e olhou pela passagem até o jardim mais adorável que alguém já viu. Como ela ansiava por sair daquele salão escuro e passear entre aqueles canteiros de flores vivas e aquelas fontes frescas, mas não conseguia nem passar a cabeça pela porta; \"e mesmo que minha cabeça passasse\", pensou a pobre Alice, \"de nada adiantaria sem meus ombros. Oh, como eu queria poder me recolher como um telescópio! Acho que conseguiria, se ao menos soubesse como começar.\" Pois, veja, tantas coisas extraordinárias tinham acontecido ultimamente que Alice começara a achar que muito poucas coisas eram de fato realmente impossíveis.</p><p>Não parecia haver sentido em esperar junto à portinhola, então voltou à mesa, meio esperando encontrar nela outra chave, ou ao menos um livro de instruções para recolher pessoas como telescópios: desta vez encontrou sobre ela uma garrafinha (\"que certamente não estava aqui antes\", disse Alice), e em volta do gargalo havia um rótulo de papel, com as palavras \"BEBA-ME\", lindamente impressas em letras grandes.</p><p>Tudo bem dizer \"Beba-me\", mas a sábia Alice não iria fazer _isso_ com pressa. \"Não, primeiro vou olhar\", disse ela, \"e ver se está marcado '_veneno_' ou não\"; pois lera várias historinhas bonitas sobre crianças que tinham se queimado e sido devoradas por feras selvagens e outras coisas desagradáveis, tudo porque _não_ quiseram se lembrar das regras simples que os amigos lhes ensinaram: como a de que um atiçador em brasa queima se você o segurar por tempo demais; e a de que, se você cortar o dedo _muito_ fundo com uma faca, ele em geral sangra; e ela nunca esquecera que, se você beber muito de uma garrafa marcada \"veneno\", é quase certo que ela lhe fará mal, mais cedo ou mais tarde.</p><p>No entanto, aquela garrafa _não_ estava marcada \"veneno\", então Alice se atreveu a prová-la e, achando-a muito gostosa (tinha, na verdade, um sabor misturado de torta de cereja, creme, abacaxi, peru assado, caramelo e torrada quente com manteiga), logo a terminou de vez.</p><p><em> </em> *</p><p>\"Que sensação curiosa!\", disse Alice. \"Devo estar me recolhendo como um telescópio.\"</p><p>E era mesmo verdade: agora ela tinha apenas dez polegadas de altura, e seu rosto se iluminou ao pensar que estava do tamanho certo para atravessar a portinhola até aquele jardim adorável. Primeiro, no entanto, esperou alguns minutos para ver se ia encolher ainda mais: sentia-se um pouco apreensiva com isso; \"pois poderia acabar, sabe\", disse Alice consigo mesma, \"em eu me apagar por completo, como uma vela. O que será que eu seria então?\" E tentou imaginar como é a chama de uma vela depois que a vela é apagada, pois não conseguia se lembrar de jamais ter visto uma coisa dessas.</p><p>Depois de um tempo, vendo que nada mais acontecia, decidiu entrar no jardim imediatamente; mas, ai da pobre Alice! ao chegar à porta, descobriu que esquecera a chave dourada, e, quando voltou à mesa para pegá-la, viu que não havia como alcançá-la: conseguia vê-la perfeitamente através do vidro, e tentou com todas as forças subir por uma das pernas da mesa, mas ela era escorregadia demais; e, quando se esgotou de tanto tentar, a coitadinha sentou-se e chorou.</p><p>\"Vamos, não adianta chorar desse jeito!\", disse Alice a si mesma, um tanto rispidamente; \"aconselho você a parar agora mesmo!\" Em geral ela se dava conselhos muito bons (embora raramente os seguisse), e às vezes se repreendia com tanta severidade que chegava a levar lágrimas aos próprios olhos; e uma vez se lembrava de ter tentado puxar as próprias orelhas por ter trapaceado consigo mesma num jogo de cróquete que jogava contra si mesma, pois aquela criança curiosa adorava fingir ser duas pessoas. \"Mas não adianta agora\", pensou a pobre Alice, \"fingir ser duas pessoas! Ora, mal sobra de mim o suficiente para formar _uma_ pessoa respeitável!\"</p><p>Logo seus olhos caíram numa caixinha de vidro que estava debaixo da mesa: ela a abriu e encontrou dentro um bolinho bem pequeno, sobre o qual as palavras \"COMA-ME\" estavam lindamente marcadas com groselhas. \"Bem, vou comê-lo\", disse Alice, \"e, se ele me fizer crescer, alcanço a chave; e, se me fizer encolher, posso rastejar por baixo da porta; de qualquer forma entrarei no jardim, e não me importa qual das duas coisas aconteça!\"</p><p>Comeu um pedacinho e disse a si mesma, ansiosa: \"Para que lado? Para que lado?\", segurando a mão no topo da cabeça para sentir para que lado estava crescendo, e ficou bastante surpresa ao descobrir que continuava do mesmo tamanho: na verdade, isso geralmente acontece quando se come bolo, mas Alice tinha se acostumado tanto a esperar que só coisas extraordinárias acontecessem que parecia muito tedioso e tolo a vida seguir do jeito comum.</p><p>Então pôs mãos à obra e logo terminou o bolo.\n</p>", "subsections": [], "readTime": "9 min"}, {"type": "chapter", "title": "Capítulo II", "html": "<p>\n<h2 id=\"a-po-a-de-l-grimas\">A Poça de Lágrimas</h2></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-po-a-de-l-grimas\">A Poça de Lágrimas</a></li></ul></div><p>\"Curioso e mais curioso!\" exclamou Alice (estava tão surpreendida que, por um momento, esqueceu por completo como falar bom inglês); \"agora estou me abrindo como o maior telescópio que já existiu! Adeus, pés!\" (pois, quando olhou para baixo, os pés pareciam quase fora de vista, de tão distantes que estavam). \"Oh, meus pobres pezinhos, quem será que vai calçar seus sapatos e meias agora, queridos? Tenho certeza de que _eu_ não serei capaz! Estarei longe demais para me preocupar com vocês: vocês terão de se virar da melhor maneira possível; mas preciso ser bondosa com eles\", pensou Alice, \"ou talvez eles não queiram andar na direção em que quero ir! Vejamos: vou lhes dar um par de botas novas todo Natal.\"</p><p>E continuou planejando consigo mesma como faria isso. \"Eles devem ir pelo transportador\", pensou; \"e como vai parecer engraçado mandar presentes para os próprios pés! E como as instruções de endereço vão parecer estranhas!\"</p><blockquote>\n_Pé Direito de Alice, Esq., Tapete da Lareira, perto do Fogão,_ (_com o amor de Alice_).\n</blockquote><p>\"Oh, céus, que bobagem estou falando!\"</p><p>Logo em seguida, sua cabeça bateu contra o teto do salão: na verdade, ela agora media mais de nove pés de altura e, imediatamente, pegou a pequena chave dourada e correu até a porta do jardim. Pobre Alice! Era tudo o que ela podia fazer, deitada de lado, para olhar o jardim com um dos olhos; mas atravessar a porta era mais impossível do que nunca: ela se sentou e começou a chorar de novo.</p><p>\"Você devia se envergonhar de si mesma\", disse Alice, \"uma garota grande como você\" (e ela bem podia dizer isso), \"ficar chorando desse jeito! Pare já com isso, estou mandando!\" Mas continuou chorando do mesmo jeito, derramando litros de lágrimas, até que se formou uma grande poça ao seu redor, com cerca de dez centímetros de profundidade e alcançando metade do salão.</p><p>Depois de um tempo, ela ouviu ao longe um leve som de passos e enxugou os olhos às pressas para ver o que vinha. Era o Coelho Branco voltando, esplendidamente vestido, com um par de luvas brancas de pelica numa das mãos e um grande leque na outra: vinha trotando apressado, murmurando consigo mesmo, \"Oh! A Duquesa, a Duquesa! Oh! Não vai ficar furiosa se eu a fiz esperar!\" Alice estava tão desesperada que se dispunha a pedir ajuda a qualquer um; assim, quando o Coelho se aproximou, ela começou, numa voz baixa e tímida, \"Se o senhor faz favor, senhor...\" O Coelho sobressaltou-se violentamente, deixou cair as luvas brancas de pelica e o leque, e saiu correndo para a escuridão o mais rápido que pôde.</p><p>Alice pegou o leque e as luvas e, como o salão estava muito quente, ficou se abanando o tempo todo em que continuou falando: \"Querido, querido! Como tudo é estranho hoje! E ontem as coisas aconteciam como sempre. Será que fui transformada durante a noite? Deixe-me pensar: eu era a mesma quando me levantei esta manhã? Acho que quase me lembro de me sentir um pouco diferente. Mas, se não sou a mesma, a próxima pergunta é: quem no mundo sou eu? Ah, _esse_ é o grande enigma!\" E começou a pensar em todas as crianças que conhecia e que tinham a mesma idade que ela, para ver se poderia ter sido transformada em alguma delas.</p><p>\"Tenho certeza de que não sou Ada\", disse, \"pois o cabelo dela tem uns cachos tão longos, e o meu não tem cachos nenhum; e tenho certeza de que não posso ser a Mabel, porque eu sei todo tipo de coisa, e ela, oh! ela sabe tão pouquinho! Além disso, _ela_ é ela, e _eu_ sou eu, e... oh, céus, como tudo isso é confuso! Vou ver se sei todas as coisas que costumava saber. Vejamos: quatro vezes cinco são doze, e quatro vezes seis são treze, e quatro vezes sete é... oh, céus! Nunca vou chegar aos vinte nesse ritmo! Mas a Tabuada não importa: vamos tentar a Geografia. Londres é a capital de Paris, e Paris é a capital de Roma, e Roma... não, _isso_ está tudo errado, tenho certeza! Devo ter sido transformada em Mabel! Vou tentar dizer '_Como o pequeno_...'\" E cruzou as mãos no colo como se estivesse recitando as lições, e começou a repetir, mas sua voz soava rouca e estranha, e as palavras não saíam como costumavam sair:</p><blockquote>\n\"Como o pequeno crocodilo\n    Melhora sua cauda brilhante,\nE derrama as águas do Nilo\n    Sobre cada escama dourada!\n</blockquote>\n&gt;\n<blockquote>\n\"Como ele parece sorrir contente,\n    Como espalha bem as garras,\nE recebe os peixinhos gentilmente\n    Com mandíbulas que sorriem com calma!\"\n</blockquote><p>\"Tenho certeza de que essas não são as palavras certas\", disse a pobre Alice, e seus olhos se encheram de lágrimas de novo enquanto continuava: \"Devo ser a Mabel afinal, e vou ter de ir morar naquela casinha apertada, e ter quase nenhum brinquedo para brincar, e oh! tantas lições para aprender! Não, já me decidi; se sou a Mabel, fico aqui embaixo! Não adianta eles enfiarem a cabeça para baixo e dizerem 'Sobe, querida!' Eu só vou olhar para cima e dizer 'Então quem sou eu? Diga-me isso primeiro, e então, se eu gostar de ser essa pessoa, eu subo; se não, fico aqui embaixo até ser outra pessoa'... mas, oh, céus!\", exclamou Alice, com uma súbita explosão de lágrimas, \"como eu queria que eles enfiassem a cabeça para baixo! Estou tão _muito_ cansada de ficar sozinha aqui!\"</p><p>Enquanto dizia isso, olhou para as mãos e ficou surpresa ao ver que tinha calçado uma das luvinhas brancas de pelica do Coelho enquanto falava. \"Como _pude_ ter feito isso?\", pensou. \"Devo estar diminuindo de novo.\" Levantou-se e foi até a mesa para se medir, e descobriu que, pelo que podia calcular, agora tinha cerca de dois pés de altura e continuava encolhendo rapidamente: logo descobriu que a causa disso era o leque que segurava, e o deixou cair às pressas, bem a tempo de evitar encolher até desaparecer por completo.</p><p>\"Isso _foi_ por pouco!\", disse Alice, bastante assustada com a mudança súbita, mas muito contente por ainda estar viva; \"e agora, para o jardim!\" E correu a toda velocidade de volta à portinha: mas, ai! a portinha estava fechada de novo, e a pequena chave dourada estava sobre a mesa de vidro como antes, \"e as coisas estão piores do que nunca\", pensou a pobre criança, \"pois nunca fui tão pequena assim antes, nunca! E declaro que isso é demais, é mesmo!\"</p><p>Enquanto dizia essas palavras, seu pé escorregou e, num instante, plaft! ela estava com água salgada até o queixo. Sua primeira ideia foi que tinha caído no mar de alguma forma, \"e nesse caso posso voltar de trem\", disse para si mesma. (Alice tinha ido ao mar uma vez na vida e chegara à conclusão geral de que, onde quer que você vá na costa inglesa, encontra uma quantidade de cabines de banho no mar, algumas crianças cavando a areia com pás de madeira, uma fileira de pensões e, atrás delas, uma estação de trem.) No entanto, logo percebeu que estava na poça de lágrimas que havia chorado quando tinha nove pés de altura.</p><p>\"Quem me dera não ter chorado tanto!\", disse Alice, nadando por ali, tentando encontrar a saída. \"Agora vou ser castigada, suponho, sendo afogada nas minhas próprias lágrimas! Isso _vai_ ser uma coisa esquisita, com certeza! Mas tudo é esquisito hoje.\"</p><p>Nesse momento, ela ouviu algo se debatendo na poça um pouco adiante, e nadou para mais perto para ver o que era: a princípio pensou que devia ser uma morsa ou um hipopótamo, mas então lembrou como estava pequena agora, e logo percebeu que era apenas um rato que tinha escorregado para dentro como ela.</p><p>\"Seria de alguma utilidade agora\", pensou Alice, \"falar com este rato? Tudo aqui embaixo é tão fora do comum que acho bem provável que ele saiba falar: de qualquer forma, não custa tentar.\" Então começou: \"Ó Rato, você sabe o caminho para sair desta poça? Estou muito cansada de nadar por aqui, ó Rato!\" (Alice achava que essa devia ser a maneira certa de falar com um rato: nunca tinha feito tal coisa antes, mas lembrava de ter visto na Gramática Latina de seu irmão: \"_A mouse_ — de um rato — a um rato — um rato — ó rato!\") O Rato a olhou de maneira bastante inquisitiva, e pareceu-lhe piscar um dos olhinhos, mas não disse nada.</p><p>\"Talvez ele não entenda inglês\", pensou Alice; \"aposto que é um rato francês, que veio com Guilherme, o Conquistador.\" (Pois, com todo o seu conhecimento de história, Alice não tinha uma noção muito clara de quanto tempo atrás qualquer coisa tinha acontecido.) Então começou de novo: \"_Où est ma chatte?_\", que era a primeira frase de seu livro de lições de francês. O Rato deu um salto súbito para fora da água e pareceu tremer todo de medo. \"Oh, peço desculpas!\", exclamou Alice às pressas, com medo de ter magoado os sentimentos do pobre animal. \"Esqueci completamente que você não gosta de gatos.\"</p><p>\"Não gostar de gatos!\", exclamou o Rato, numa voz aguda e apaixonada. \"Você _gostaria_ de gatos se fosse eu?\"</p><p>\"Bem, talvez não\", disse Alice num tom suave: \"não fique zangado por causa disso. E ainda assim gostaria de poder lhe mostrar a nossa gata Dinah: acho que você criaria gosto por gatos se pudesse vê-la. Ela é uma coisa tão querida e calma\", continuou Alice, quase falando consigo mesma, enquanto nadava preguiçosamente na poça, \"e fica sentada ronronando tão gostosamente perto do fogo, lambendo as patas e lavando o rosto... e é uma coisa tão macia e agradável de acariciar... e é tão ótima para pegar ratos... oh, peço desculpas!\", exclamou Alice de novo, pois desta vez o Rato estava todo eriçado, e ela tinha certeza de que ele devia estar realmente ofendido. \"Não vamos falar mais dela, se você preferir.\"</p><p>\"Nós, deveras!\", exclamou o Rato, tremendo até a ponta do rabo. \"Como se _eu_ fosse falar de tal assunto! Nossa família sempre _odiou_ gatos: criaturas nojentas, baixas e vulgares! Não me deixe ouvir esse nome de novo!\"</p><p>\"Não vou, de verdade!\", disse Alice, apressada em mudar de assunto. \"Você... você gosta... de... de cães?\" O Rato não respondeu, então Alice continuou ansiosamente: \"Há um cãozinho tão bonito perto da nossa casa que eu gostaria de lhe mostrar! Um terrier de olhos vivos, sabe, com um pelo castanho tão comprido e encaracolado! E ele vai buscar as coisas quando você as joga, e fica sentado pedindo o jantar, e todo tipo de coisas... não consigo me lembrar nem da metade... e ele pertence a um fazendeiro, sabe, e ele diz que o cão é tão útil que vale cem libras! Ele diz que o cão mata todos os ratos e... oh, céus!\", exclamou Alice num tom pesaroso, \"tenho medo de tê-lo ofendido de novo!\" Pois o Rato estava nadando para longe dela o mais rápido que podia, fazendo uma grande confusão na poça.</p><p>Então ela chamou baixinho, atrás dele: \"Ratino querido! Volte aqui, e não vamos falar de gatos nem de cães, se você não gosta deles!\" Quando o Rato ouviu isso, virou-se e nadou lentamente de volta até ela: seu rosto estava bastante pálido (de paixão, pensou Alice), e ele disse numa voz baixa e trêmula, \"Vamos chegar à margem, e então eu lhe contarei a minha história, e você entenderá por que odeio gatos e cães.\"</p><p>Era mesmo hora de sair, pois a poça estava ficando bastante cheia de pássaros e animais que tinham caído nela: havia um Pato e um Dodo, uma Arara e uma Aguiazinha, e várias outras criaturas curiosas. Alice abriu caminho, e todo o grupo nadou até a margem.\n</p>", "subsections": [{"level": 2, "title": "A Poça de Lágrimas", "id": "a-po-a-de-l-grimas"}], "readTime": "9 min"}, {"type": "chapter", "title": "Capítulo III: A Corrida do Caucus e uma Longa História", "html": "<p>\n<h2 id=\"a-corrida-do-caucus\">A Corrida do Caucus</h2></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-corrida-do-caucus\">A Corrida do Caucus</a></li><li class=\"mt-2\"><a href=\"#pr-mios-para-todos\">Prêmios para Todos</a></li><li class=\"mt-2\"><a href=\"#o-conto-do-rato\">O Conto do Rato</a></li><li class=\"mt-2\"><a href=\"#a-partida-dos-p-ssaros\">A Partida dos Pássaros</a></li></ul></div><p>Era, de fato, um grupo bastante esquisito o que se reunira na margem: as aves com as penas encharcadas, os animais com o pelo grudado ao corpo, e todos pingando água, irritados e desconfortáveis. A primeira questão, naturalmente, era como se secar de novo; fizeram uma consulta sobre isso, e depois de alguns minutos pareceu perfeitamente natural a Alice encontrar-se conversando familiarmente com eles, como se os conhecesse a vida toda. De fato, ela teve uma discussão bastante longa com o Lóris, que por fim ficou amuado e só repetia: \"Sou mais velho que você e devo saber mais\"; e isso Alice não admitia sem antes saber quantos anos ele tinha, e, como o Lóris se recusava terminantemente a dizer a idade, não havia mais o que falar.</p><p>Por fim, o Rato, que parecia ser uma pessoa de autoridade entre eles, gritou: \"Sentem-se todos e escutem-me! _Eu_ vou secá-los rapidinho!\" Todos se sentaram na mesma hora, em um grande círculo, com o Rato no meio. Alice mantinha os olhos ansiosamente fixos nele, pois tinha certeza de que pegaria um resfriado forte se não secasse logo. \"Hum-hum!\" disse o Rato com ar importante, \"estão todos prontos? Esta é a coisa mais seca que conheço. Silêncio geral, por favor! 'Guilherme, o Conquistador, cuja causa foi favorecida pelo papa, foi logo aceito pelos ingleses, que precisavam de líderes e andavam ultimamente muito acostumados à usurpação e à conquista. Edwin e Morcar, condes da Mércia e da Nortúmbria—'\"</p><p>\"Ugh!\" disse o Lóris, estremecendo. \"Perdão!\" disse o Rato, franzindo a testa, mas com muita polidez: \"Você falou?\" \"Eu não!\" disse o Lóris apressadamente. \"Pensei que tivesse falado,\" disse o Rato. \"Prossigo. 'Edwin e Morcar, condes da Mércia e da Nortúmbria, declararam-se a seu favor: e até mesmo Stigand, o patriótico arcebispo de Cantuária, achou aconselhável—'\" \"Achou _o quê_?\" disse o Pato. \"Achou _o_,\" respondeu o Rato, meio irritado: \"é claro que você sabe o que 'o' quer dizer.\" \"Sei muito bem o que 'o' quer dizer, quando eu acho uma coisa,\" disse o Pato: \"geralmente é uma rã ou uma minhoca. A questão é: o que o arcebispo achou?\"</p><p>O Rato não deu atenção à pergunta e prosseguiu apressadamente: \"'—achou aconselhável ir com Edgar Atheling ao encontro de Guilherme para lhe oferecer a coroa. A conduta de Guilherme foi a princípio moderada. Mas a insolência de seus normandos—' Como vão as coisas agora, minha querida?\" continuou, voltando-se para Alice. \"Tão molhada quanto antes,\" disse Alice em tom melancólico: \"isso não parece me secar de jeito nenhum.\" \"Nesse caso,\" disse o Dodô solenemente, pondo-se de pé, \"proponho que a reunião seja suspensa, para a adoção imediata de remédios mais enérgicos—\" \"Fale a nossa língua!\" disse o Filhote de Águia. \"Não sei o significado de metade dessas palavras compridas e, além disso, não acredito que você saiba também!\" E o Filhote de Águia baixou a cabeça para esconder um sorriso: algumas das outras aves riram audivelmente.</p><p>\"O que eu ia dizer,\" retomou o Dodô, em tom ofendido, \"é que a melhor coisa para nos secar seria uma Corrida do Caucus.\" \"O que _é_ uma Corrida do Caucus?\" perguntou Alice; não que tivesse muita vontade de saber, mas o Dodô havia feito uma pausa como se pensasse que _alguém_ devia falar, e ninguém mais parecia inclinado a dizer coisa alguma. \"Ora,\" disse o Dodô, \"a melhor maneira de explicar é fazendo.\" (E, como você talvez queira experimentar você mesmo, em algum dia de inverno, vou lhe contar como o Dodô se arranjou.) Primeiro traçou uma pista de corrida, em uma espécie de círculo (\"o formato exato não importa,\" disse ele), e então todo o grupo foi disposto ao longo da pista, aqui e ali. Não houve \"Um, dois, três, e já!\", mas começaram a correr quando quiseram e pararam quando quiseram, de modo que não era fácil saber quando a corrida terminava. No entanto, quando já corriam havia meia hora ou mais, e estavam bem secos de novo, o Dodô gritou de repente \"A corrida acabou!\", e todos se aglomeraram em volta dele, ofegantes, perguntando: \"Mas quem ganhou?\"</p><p><h2 id=\"pr-mios-para-todos\">Prêmios para Todos</h2></p><p>A essa pergunta o Dodô não pôde responder sem pensar muito, e ficou sentado um longo tempo com um dedo pressionado sobre a testa (a posição em que costumamos ver Shakespeare nos seus retratos), enquanto os outros esperavam em silêncio. Por fim o Dodô disse: \"_Todos_ venceram, e todos devem ganhar prêmios.\" \"Mas quem vai dar os prêmios?\" perguntou um verdadeiro coro de vozes. \"Ora, _ela_, é claro,\" disse o Dodô, apontando para Alice com um dedo; e todo o grupo se aglomerou ao redor dela na mesma hora, gritando de maneira confusa: \"Prêmios! Prêmios!\"</p><p>Alice não fazia ideia do que fazer e, em desespero, meteu a mão no bolso e tirou uma caixa de confeitos (felizmente a água salgada não tinha entrado nela) e os distribuiu como prêmios. Havia exatamente um para cada. \"Mas ela também precisa ganhar um prêmio, sabe,\" disse o Rato. \"É claro,\" respondeu o Dodô, muito grave. \"O que mais você tem no bolso?\" continuou, voltando-se para Alice. \"Só um dedal,\" disse Alice, tristonha. \"Entregue-o aqui,\" disse o Dodô. Então todos se aglomeraram ao redor dela mais uma vez, enquanto o Dodô apresentava solenemente o dedal, dizendo \"Pedimos que aceite este elegante dedal\"; e, quando terminou esse breve discurso, todos aplaudiram.</p><p>Alice achou tudo aquilo absurdíssimo, mas todos estavam tão sérios que ela não se atreveu a rir; e, como não conseguia pensar em nada para dizer, limitou-se a fazer uma reverência e pegar o dedal, com o ar mais solene que pôde. Em seguida, foi a vez de comer os confeitos: isso causou algum barulho e confusão, pois as aves grandes reclamavam que não conseguiam sentir o gosto dos seus, e as pequenas engasgavam e precisavam ser batidinhas nas costas. Mas acabou, por fim, e todos se sentaram de novo em círculo, pedindo ao Rato que contasse mais alguma coisa.</p><p><h2 id=\"o-conto-do-rato\">O Conto do Rato</h2></p><p>\"Você prometeu me contar a sua história, sabe,\" disse Alice, \"e por que você odeia... C e D,\" acrescentou em um sussurro, meio com medo de que ele se ofendesse de novo. \"A minha é uma história longa e triste!\" disse o Rato, voltando-se para Alice, com um suspiro. \"É uma cauda longa, com certeza,\" disse Alice, olhando admirada para a cauda do Rato; \"mas por que a chama de triste?\" E ficou matutando sobre isso enquanto o Rato falava, de modo que sua ideia da história era mais ou menos assim:</p><blockquote>\n\"Fúria disse a um rato,\nQue encontrou em casa:\n'Vamos ambos aos tribunais:\n_eu_ vou processar _você_.\nVenha, não aceito negativa;\nPrecisamos de um julgamento:\nPois, na verdade, esta manhã\nNão tenho nada para fazer.'\nDisse o rato ao vira-lata:\n'Tal julgamento, caro senhor,\nSem júri nem juiz,\nSeria desperdiçar nosso fôlego.'\n'Serei o juiz, serei o júri,'\nDisse a astuta velha Fúria:\n'Julgarei a causa inteira\nE condenarei você à morte.'\"\n</blockquote><p>\"Você não está prestando atenção!\" disse o Rato a Alice, severamente. \"Em que você está pensando?\" \"Perdão,\" disse Alice, muito humilde: \"você tinha chegado à quinta curva, não é?\" \"Não tinha _não_!\" gritou o Rato, com aspereza e muita raiva. \"Um nó!\" disse Alice, sempre pronta a ser útil, olhando em volta ansiosamente. \"Oh, deixe-me ajudá-lo a desfazê-lo!\" \"Não farei nada disso,\" disse o Rato, levantando-se e indo embora. \"Você me insulta falando esses disparates!\" \"Não foi de propósito!\" suplicou a pobre Alice. \"Mas você se ofende com tanta facilidade, sabe!\" O Rato apenas rosnou em resposta. \"Por favor, volte e termine a sua história!\" chamou Alice atrás dele; e os outros todos fizeram coro: \"Sim, por favor, volte!\", mas o Rato apenas balançou a cabeça impacientemente e andou um pouco mais depressa.</p><p>\"Que pena que ele não ficou!\" suspirou o Lóris, assim que o Rato desapareceu de vista; e uma velha Carangueja aproveitou a ocasião para dizer à filha: \"Ah, minha querida! Que isso lhe sirva de lição para nunca perder a _paciência_!\" \"Cale a boca, mamãe!\" disse a jovem Carangueja, um pouco áspera. \"A senhora é capaz de pôr à prova a paciência de uma ostra!\" \"Quem me dera ter a nossa Diná aqui, isso sim!\" disse Alice em voz alta, sem se dirigir a ninguém em particular. \"Ela traria o rato de volta num instante!\"</p><p><h2 id=\"a-partida-dos-p-ssaros\">A Partida dos Pássaros</h2></p><p>\"E quem é Diná, se me permitem fazer a pergunta?\" disse o Lóris. Alice respondeu com entusiasmo, pois estava sempre pronta a falar de sua bichana: \"Diná é a nossa gata. E ela é tão boa em pegar ratos que você nem imagina! E oh, quem me dera que você a visse atrás dos passarinhos! Ela come um passarinho assim que põe os olhos nele!\" Esse discurso causou uma sensação notável no grupo. Algumas aves se retiraram na mesma hora: uma velha Pega começou a se embrulhar com muito cuidado, comentando: \"Preciso mesmo ir para casa; o ar da noite não faz bem à minha garganta!\", e um Canário chamou os filhotes em voz trêmula: \"Venham, meus queridos! Já é hora de irem todos para a cama!\" Sob vários pretextos, todos se retiraram, e Alice logo ficou sozinha.</p><p>\"Quem me dera não ter mencionado Diná!\" disse consigo mesma, em tom melancólico. \"Ninguém parece gostar dela aqui embaixo, e tenho certeza de que ela é a melhor gata do mundo! Oh, minha querida Diná! Será que ainda vou vê-la alguma vez?\" E então a pobre Alice começou a chorar de novo, pois se sentia muito sozinha e desanimada. Pouco depois, porém, ouviu de novo um leve tamborilar de passos ao longe, e olhou para cima, ansiosa, meio esperançosa de que o Rato tivesse mudado de ideia e estivesse voltando para terminar sua história.\n</p>", "subsections": [{"level": 2, "title": "A Corrida do Caucus", "id": "a-corrida-do-caucus"}, {"level": 2, "title": "Prêmios para Todos", "id": "pr-mios-para-todos"}, {"level": 2, "title": "O Conto do Rato", "id": "o-conto-do-rato"}, {"level": 2, "title": "A Partida dos Pássaros", "id": "a-partida-dos-p-ssaros"}], "readTime": "8 min"}, {"type": "chapter", "title": "O Coelho Manda um Pequeno Bill", "html": "<p>\nEra o Coelho Branco, voltando trotando devagar e olhando ansiosamente em volta, como se tivesse perdido alguma coisa; e ela o ouviu murmurar consigo mesmo: \"A Duquesa! A Duquesa! Ai, minhas pobres patinhas! Ai, meu pelo e meus bigodes! Ela vai me mandar executar, tão certo quanto furões são furões! Onde _será_ que eu os deixei cair?\" Alice adivinhou num instante que ele procurava o leque e o par de luvas de pelica branca, e, muito solícita, começou a procurá-los também; mas eles não estavam em lugar nenhum — tudo parecia ter mudado desde o seu mergulho no lago, e o grande salão, com a mesa de vidro e a portinhola, havia desaparecido por completo.</p><p>Logo o Coelho reparou em Alice, enquanto ela procurava, e gritou com ela num tom zangado: \"Ora, Mary Ann, o que _você_ está fazendo aqui fora? Corra para casa neste instante e traga um par de luvas e um leque! Depressa, já!\" E Alice ficou tão assustada que saiu correndo na direção que ele apontava, sem tentar explicar o engano que ele havia cometido.</p><p>\"Ele me confundiu com a criada dele\", disse consigo mesma enquanto corria. \"Como vai ficar surpreso quando descobrir quem eu sou! Mas é melhor eu levar o leque e as luvas — isto é, se eu conseguir achá-los.\" Enquanto dizia isso, deu numa casinha caprichada, em cuja porta havia uma placa de latão brilhante com o nome \"W. RABBIT\" gravado. Ela entrou sem bater e subiu correndo as escadas, com muito medo de encontrar a verdadeira Mary Ann e ser posta para fora da casa antes de achar o leque e as luvas.</p><p>\"Que esquisito\", disse Alice consigo mesma, \"fazer recados para um coelho! Daqui a pouco é a Dinah me mandando fazer recados!\" E começou a imaginar o tipo de coisa que aconteceria: \"'Menina Alice! Venha cá agora mesmo e se prepare para o passeio!' 'Já vou, babá! Mas preciso ver que o camundongo não escape.' Só que eu acho\", continuou Alice, \"que eles não deixariam a Dinah ficar em casa se ela começasse a dar ordens desse jeito!\"</p><p>Nesse meio-tempo ela tinha encontrado o caminho até um quartinho arrumado, com uma mesa junto à janela e, sobre ela (como ela esperava), um leque e dois ou três pares de luvas de pelica branca bem pequenas: ela pegou o leque e um par de luvas e estava justamente saindo do quarto quando seus olhos caíram sobre uma garrafinha que ficava perto do espelho. Desta vez não havia etiqueta com as palavras \"BEBA-ME\", mas, mesmo assim, ela a destampou e a levou aos lábios. \"Sei que _alguma coisa_ interessante com certeza vai acontecer\", disse consigo mesma, \"toda vez que como ou bebo alguma coisa; então vou ver o que essa garrafa faz. Espero mesmo que me faça crescer de novo, porque estou realmente cansada de ser uma coisinha tão minúscula!\"</p><p>E assim foi, e muito mais depressa do que ela esperava: antes de beber metade da garrafa, ela já sentia a cabeça pressionando o teto e teve de se curvar para não quebrar o pescoço. Apressada, pôs a garrafa de lado, dizendo consigo mesma: \"Já chega — espero não crescer mais — do jeito que está, não consigo sair pela porta — bem que eu queria não ter bebido tanto!\"</p><p>Ai! Já era tarde demais para esse desejo! Ela continuou crescendo, e crescendo, e logo teve de se ajoelhar no chão: um minuto depois nem isso havia mais espaço, e ela tentou o efeito de deitar com um cotovelo contra a porta e o outro braço enrolado em volta da cabeça. Ainda assim continuou crescendo e, como último recurso, pôs um braço para fora da janela e um pé para dentro da chaminé, e disse consigo mesma: \"Agora não posso fazer mais nada, aconteça o que acontecer. O que _será_ de mim?\"</p><p>Para a sorte de Alice, a garrafinha mágica já tinha feito todo o seu efeito, e ela não cresceu mais: mesmo assim, era bem desconfortável, e, como não parecia haver a menor chance de ela sair de novo daquele quarto, não admira que se sentisse infeliz.</p><p>\"Em casa era muito mais agradável\", pensou a pobre Alice, \"quando a gente não ficava sempre crescendo e encolhendo, e sendo mandada de um lado para o outro por camundongos e coelhos. Quase que eu queria não ter descido por aquele buraco de coelho — e, no entanto — e, no entanto — é bem curioso, sabe, esse tipo de vida! Queria muito saber o que _pode_ ter acontecido comigo! Quando eu lia contos de fadas, imaginava que esse tipo de coisa nunca acontecia, e agora estou no meio de um! Deveriam escrever um livro sobre mim, isso sim! E quando eu crescer, escrevo um — mas já estou crescida agora\", acrescentou num tom pesaroso; \"pelo menos aqui _não_ há mais espaço para crescer.\"</p><p>\"Mas então\", pensou Alice, \"será que _nunca_ vou ficar mais velha do que sou agora? Isso seria um consolo, de certo modo — nunca ser uma velha — mas, por outro lado — ter sempre lições para aprender! Oh, isso eu não ia gostar _nada_!\"</p><p>\"Oh, Alice boba!\" respondeu ela a si mesma. \"Como você pode aprender lições aqui dentro? Ora, mal cabe _você_, e não há espaço nenhum para livros de lições!\"</p><p>E assim continuou, tomando primeiro um lado e depois o outro, travando uma conversa completa consigo mesma; mas depois de alguns minutos ouviu uma voz lá fora e parou para escutar.</p><p>\"Mary Ann! Mary Ann!\" dizia a voz. \"Traga minhas luvas agora mesmo!\" Depois veio um barulhinho de passos apressados na escada. Alice sabia que era o Coelho vindo procurá-la, e tremeu tanto que balançou a casa, esquecendo-se completamente de que agora era umas mil vezes maior que o Coelho e não tinha motivo nenhum para ter medo dele.</p><p>Logo o Coelho chegou à porta e tentou abri-la; mas, como a porta abria para dentro e o cotovelo de Alice estava pressionado com força contra ela, a tentativa fracassou. Alice o ouviu dizer consigo mesmo: \"Então vou dar a volta e entrar pela janela.\"</p><p>\"_Isso_ é que não!\" pensou Alice e, depois de esperar até imaginar que ouvia o Coelho bem debaixo da janela, estendeu de repente a mão e deu um tapa no ar. Não agarrou nada, mas ouviu um gritinho, uma queda e o barulho de vidro quebrado, do que concluiu que era bem possível que ele tivesse caído numa estufa de pepinos ou algo do tipo.</p><p>Em seguida veio uma voz zangada — a do Coelho: \"Pat! Pat! Onde você está?\" E então uma voz que ela nunca tinha ouvido antes: \"Ora, estou aqui! Cavocando à procura de maçãs, seu moço!\"</p><p>\"Cavocando à procura de maçãs, ora essa!\" disse o Coelho, zangado. \"Aqui! Venha me tirar desta!\" (Barulho de mais vidro quebrado.)</p><p>\"Agora me diga, Pat, o que é aquilo na janela?\"</p><p>\"Ora, é um braço, seu moço!\" (Ele pronunciava \"braço\" de um jeito estranho.)</p><p>\"Um braço, seu bobo! Quem já viu um braço desse tamanho? Ora, ele ocupa a janela inteira!\"</p><p>\"Pois ocupa, seu moço: mas é um braço mesmo assim.\"</p><p>\"Bem, ele não tem nada que fazer ali, de qualquer forma: vá tirá-lo daí!\"</p><p>Houve um longo silêncio depois disso, e Alice só conseguia ouvir uns sussurros de vez em quando; coisas como: \"Pois eu não gosto nada disso, seu moço, nada mesmo!\" \"Faça o que eu mando, seu covarde!\" E por fim ela estendeu a mão de novo e deu outro tapa no ar. Desta vez houve _dois_ gritinhos e mais barulho de vidro quebrado. \"Quantas estufas de pepinos deve haver por aqui!\" pensou Alice. \"O que será que eles vão fazer agora! Quanto a me tirar pela janela, só queria que _pudessem!_ Tenho certeza de que _eu_ não quero ficar aqui dentro por mais tempo!\"</p><p>Ela esperou um bom tempo sem ouvir mais nada: por fim veio o rufar de rodinhas de carrinho e o som de muitas vozes falando ao mesmo tempo: ela distinguiu as palavras: \"Cadê a outra escada? — Ora, eu não precisava ter trazido mais que uma; o Bill ficou com a outra — Bill! Traz ela pra cá, rapaz! — Aqui, encostem neste canto — Não, amarrem primeiro — elas ainda não alcançam nem metade da altura — Oh! servem muito bem; não sejam exigentes — Ei, Bill! Segura esta corda — Será que o telhado aguenta? — Cuidado com aquela telha solta — Ah, está caindo! Abaixem as cabeças!\" (um estrondo alto) — \"Agora, quem fez isso? — Foi o Bill, imagino — Quem vai descer pela chaminé? — Eu é que não! — Vá você! — _Isso_ é que não, então! — O Bill é que desce — Ei, Bill! o patrão manda você descer pela chaminé!\"</p><p>\"Oh! Então o Bill é que tem de descer pela chaminé, não é?\" disse Alice consigo mesma. \"Ora, parece que eles põem tudo nas costas do Bill! Não trocaria de lugar com o Bill por nada: esta lareira é estreita, é verdade; mas _acho_ que posso dar um chute!\"</p><p>Ela enfiou o pé o mais fundo que pôde na chaminé e esperou até ouvir um bichinho (não fazia ideia de que espécie era) arranhando e se atrapalhando na chaminé bem acima dela: então, dizendo consigo mesma \"Este é o Bill\", deu um chute seco e esperou para ver o que aconteceria.</p><p>A primeira coisa que ouviu foi um coro geral de \"Lá vai o Bill!\" Depois a voz do Coelho: \"Segurem ele, vocês aí na sebe!\" Depois silêncio, e então outra confusão de vozes: \"Segurem a cabeça dele — Um pouco de conhaque agora — Não o deixem engasgar — Como foi, meu velho? O que aconteceu com você? Conta tudo pra gente!\"</p><p>Por fim veio uma vozinha fraca e esganiçada (\"É o Bill\", pensou Alice): \"Bem, mal sei — Não, obrigado; já estou melhor — mas estou apavorado demais para contar — tudo o que sei é que uma coisa veio em cima de mim como um boneco de mola, e eu subi como um foguete!\"</p><p>\"Pois foi, meu velho!\" disseram os outros.</p><p>\"Temos de tocar fogo na casa!\" disse a voz do Coelho; e Alice gritou o mais alto que pôde: \"Se fizerem isso, eu solto a Dinah em vocês!\" Imediatamente se fez um silêncio absoluto, e Alice pensou consigo mesma: \"O que será que eles _vão_ fazer agora! Se tivessem juízo, tirariam o telhado.\" Depois de um ou dois minutos, começaram a se mexer de novo, e Alice ouviu o Coelho dizer: \"Um carrinho de mão cheio serve, para começar.\"</p><p>\"Um carrinho de mão cheio de _quê?_\" pensou Alice; mas não teve muito tempo para duvidar, pois no instante seguinte uma chuva de pedrinhas entrou chacoalhando pela janela, e algumas acertaram o rosto dela. \"Vou pôr um fim nisso\", disse consigo mesma, e gritou: \"É melhor vocês não fazerem isso de novo!\" O que produziu outro silêncio absoluto.</p><p>Alice notou com alguma surpresa que as pedrinhas estavam todas se transformando em bolinhos assim que caíam no chão, e uma ideia luminosa lhe veio à cabeça. \"Se eu comer um desses bolinhos\", pensou, \"com certeza vai causar _alguma_ mudança no meu tamanho; e, como não pode me deixar maior, deve me deixar menor, imagino.\"</p><p>Então ela engoliu um dos bolinhos e ficou encantada ao ver que começou a encolher na hora. Assim que ficou pequena o bastante para passar pela porta, saiu correndo da casa e encontrou uma verdadeira multidão de bichinhos e passarinhos esperando lá fora. O pobre Lagartinho, Bill, estava no meio, sustentado por dois porquinhos-da-índia, que lhe davam alguma coisa de uma garrafa. Todos avançaram sobre Alice no instante em que ela apareceu; mas ela correu o mais rápido que pôde e logo se viu a salvo numa mata fechada.</p><p>\"A primeira coisa que tenho de fazer\", disse Alice consigo mesma, vagando pela mata, \"é voltar a crescer até o meu tamanho certo; e a segunda é encontrar o caminho até aquele jardim lindo. Acho que esse é o melhor plano.\"</p><p>Parecia um excelente plano, sem dúvida, muito bem organizado e simples; a única dificuldade era que ela não fazia a menor ideia de como começar; e, enquanto espreitava ansiosa entre as árvores, um latido agudo bem acima da cabeça dela a fez olhar para cima num sobressalto.</p><p>Um filhote de cachorro enorme olhava para ela com olhos grandes e redondos, esticando fracamente uma pata, tentando tocá-la. \"Coitadinho!\" disse Alice, em tom dengoso, e tentou com todas as forças assobiar para ele; mas ficou terrivelmente assustada o tempo todo com a ideia de que ele pudesse estar com fome, e nesse caso era bem provável que a comesse, apesar de todo o seu dengo.</p><p>Quase sem saber o que fazia, ela pegou um graveto e o estendeu para o filhote; então o filhote saltou no ar com todas as patas de uma vez, com um ganido de alegria, avançou sobre o graveto e fingiu mordê-lo; então Alice se esquivou para trás de um grande cardo, para não ser atropelada; e, no instante em que apareceu do outro lado, o filhote avançou de novo sobre o graveto e caiu de ponta-cabeça na pressa de pegá-lo; então Alice, achando que era como brincar com um cavalo de carroça e esperando a qualquer momento ser pisoteada, correu de novo em volta do cardo; então o filhote começou uma série de arremetidas curtas contra o graveto, avançando um pouquinho a cada vez e recuando uma distância boa, latindo rouco o tempo todo, até que por fim se sentou a uma boa distância, ofegante, com a língua pendurada para fora da boca e os olhos grandes meio fechados.</p><p>Isso pareceu a Alice uma boa oportunidade de fugir; então ela partiu na hora e correu até ficar bem cansada e sem fôlego, e até o latido do filhote soar bem fraco ao longe.</p><p>\"E mesmo assim, que filhotinho adorável ele era!\" disse Alice, encostada num botão-de-ouro para descansar, abanando-se com uma das folhas: \"Eu adoraria ensinar truques a ele, se — se eu tivesse o tamanho certo para isso! Oh, céus! Quase esqueci que tenho de crescer de novo! Deixe-me ver — como _é_ que se faz isso? Imagino que deva comer ou beber alguma coisa; mas a grande questão é: o quê?\"</p><p>A grande questão era certamente: o quê? Alice olhou em volta para as flores e as folhas de grama, mas não viu nada que parecesse a coisa certa para comer ou beber nas circunstâncias. Havia um cogumelo grande crescendo perto dela, mais ou menos da mesma altura que ela; e, depois de olhar por baixo dele, dos dois lados e por trás, ocorreu-lhe que bem podia olhar e ver o que havia em cima.</p><p>Ela se esticou na ponta dos pés e espiou por cima da borda do cogumelo, e seus olhos encontraram imediatamente os de uma grande lagarta azul, que estava sentada no topo com os braços cruzados, fumando tranquilamente um longo narguilé, sem dar a menor atenção a ela nem a mais nada.\n</p>", "subsections": [], "readTime": "12 min"}, {"type": "chapter", "title": "Capítulo V: Conselhos de uma Lagarta", "html": "<p>\nA Lagarta e Alice olharam uma para a outra por algum tempo em silêncio; por fim, a Lagarta tirou o narguilé da boca e dirigiu-se a ela com uma voz lânguida e sonolenta.</p><p>— Quem é _você?_ — disse a Lagarta.</p><p>Esse não era um começo encorajador para uma conversa. Alice respondeu, um tanto timidamente:</p><p>— Eu... eu mal sei, senhor, neste momento... ao menos sei quem eu _era_ quando me levantei esta manhã, mas acho que devo ter mudado várias vezes desde então.</p><p>— O que você quer dizer com isso? — disse a Lagarta, severamente. — Explique-se!</p><p>— Receio não poder me explicar, senhor — disse Alice —, porque não sou eu mesma, veja.</p><p>— Não vejo — disse a Lagarta.</p><p>— Receio não poder dizê-lo com mais clareza — respondeu Alice, muito educadamente —, pois eu mesma não consigo entender, para começar; e ter tantos tamanhos diferentes num mesmo dia é muito confuso.</p><p>— Não é — disse a Lagarta.</p><p>— Bem, talvez você ainda não tenha descoberto isso — disse Alice —; mas quando você tiver de se transformar em crisálida, e algum dia você vai, e depois em borboleta, creio que vai achar um pouco estranho, não vai?</p><p>— Nem um pouco — disse a Lagarta.</p><p>— Bem, talvez os seus sentimentos sejam diferentes — disse Alice —; tudo o que sei é que para _mim_ seria muito estranho.</p><p>— Você! — disse a Lagarta, com desprezo. — Quem é _você_?</p><p>Isso os trouxe de volta ao começo da conversa. Alice ficou um pouco irritada com as observações tão _muito_ curtas da Lagarta e, erguendo-se, disse com muita gravidade:</p><p>— Penso que você deveria me dizer primeiro quem _você_ é.</p><p>— Por quê? — disse a Lagarta.</p><p>Aqui havia outra pergunta intrigante; e, como Alice não conseguia pensar em nenhuma boa razão, e como a Lagarta parecia estar num estado de espírito _muito_ desagradável, ela se virou para ir embora.</p><p>— Volte! — chamou a Lagarta atrás dela. — Tenho algo importante a dizer!</p><p>Isso parecia promissor, certamente: Alice voltou e se aproximou de novo.</p><p>— Mantenha a calma — disse a Lagarta.</p><p>— Só isso? — disse Alice, engolindo a raiva o melhor que podia.</p><p>— Não — disse a Lagarta.</p><p>Alice achou que bem podia esperar, já que não tinha mais nada a fazer, e talvez, afinal, aquilo lhe dissesse algo que valesse a pena ouvir. Durante alguns minutos a Lagarta fumou sem falar, mas por fim desdobrou os braços, tirou o narguilé da boca novamente e disse:</p><p>— Então você acha que mudou, não é?</p><p>— Receio que sim, senhor — disse Alice —; não consigo me lembrar das coisas como antes, e não fico com o mesmo tamanho nem por dez minutos seguidos!</p><p>— Não consegue se lembrar de _quê_? — disse a Lagarta.</p><p>— Bem, tentei dizer \"Como a abelhinha laboriosa\", mas saiu tudo diferente! — respondeu Alice, com uma voz muito melancólica.</p><p>— Recite \"_Você é velho, Padre William_\" — disse a Lagarta.</p><p>Alice cruzou as mãos e começou:</p><p>— \"Você é velho, Padre William\", disse o jovem,\n\"e o seu cabelo ficou todo branco;\ne, no entanto, você fica de cabeça para baixo...\nnão acha que, na sua idade, isso é correto?\"</p><p>\"Na minha juventude\", respondeu Padre William ao filho,\n\"eu temia que isso pudesse prejudicar o cérebro;\nmas, agora que tenho a certeza de que não tenho nenhum,\npois bem, eu o faço de novo e de novo.\"</p><p>\"Você é velho\", disse o jovem, \"como já mencionei,\ne está ficando incrivelmente gordo;\nno entanto, você deu uma cambalhota para trás porta adentro...\ndiga-me, qual é a razão disso?\"</p><p>\"Na minha juventude\", disse o sábio, sacudindo os cabelos grisalhos,\n\"mantive todos os meus membros muito flexíveis\ncom o uso desta pomada, um xelim a caixa...\npermite-me vender-lhe um par?\"</p><p>\"Você é velho\", disse o jovem, \"e as suas mandíbulas são fracas demais\npara qualquer coisa mais dura que sebo;\nno entanto, você deu conta do ganso, com os ossos e o bico...\ndiga-me, como conseguiu fazer isso?\"</p><p>\"Na minha juventude\", disse o pai, \"dediquei-me ao direito,\ne argumentei cada caso com a minha esposa;\ne a força muscular que isso deu à minha mandíbula\ndurou o resto da minha vida.\"</p><p>\"Você é velho\", disse o jovem, \"e ninguém poderia supor\nque o seu olho fosse tão firme como sempre;\nno entanto, você equilibrou uma enguia na ponta do nariz...\no que o tornou tão terrivelmente esperto?\"</p><p>\"Já respondi a três perguntas, e isso é suficiente\",\ndisse o pai; \"não se dê ares!\nVocê acha que posso ouvir o dia inteiro essa bobagem?\nVá embora, ou eu o chuto escada abaixo!\"</p><p>— Não foi dito direito — disse a Lagarta.</p><p>— Não _bem_ direito, receio — disse Alice, timidamente —; algumas palavras saíram alteradas.</p><p>— Está errado do começo ao fim — disse a Lagarta, decididamente; e houve silêncio por alguns minutos.</p><p>A Lagarta foi a primeira a falar.</p><p>— De que tamanho você quer ser? — perguntou.</p><p>— Oh, não faço questão quanto ao tamanho — respondeu Alice, apressadamente —; só que a gente não gosta de mudar com tanta frequência, sabe.</p><p>— Eu _não_ sei — disse a Lagarta.</p><p>Alice não disse nada: nunca em sua vida tinha sido tão contrariada, e sentia que estava perdendo a paciência.</p><p>— Você está satisfeita agora? — disse a Lagarta.</p><p>— Bem, eu gostaria de ser um _pouquinho_ maior, senhor, se não se importa — disse Alice —: três polegadas é uma altura tão miserável.</p><p>— É uma altura muito boa, sim! — disse a Lagarta, zangada, erguendo-se ereta ao falar (ela tinha exatamente três polegadas de altura).</p><p>— Mas eu não estou acostumada! — suplicou a pobre Alice, num tom lastimoso. E pensou consigo mesma: \"Como eu gostaria que as criaturas não se ofendessem tão facilmente!\"</p><p>— Você vai se acostumar com o tempo — disse a Lagarta; e pôs o narguilé na boca e começou a fumar de novo.</p><p>Desta vez Alice esperou pacientemente até que ela resolvesse falar novamente. Em um ou dois minutos, a Lagarta tirou o narguilé da boca, bocejou uma ou duas vezes e se sacudiu. Então desceu do cogumelo e se arrastou pela grama, limitando-se a observar ao partir:</p><p>— Um lado vai fazê-la crescer mais alta, e o outro lado vai fazê-la ficar mais baixa.</p><p>— Um lado de _quê?_ O outro lado de _quê?_ — pensou Alice consigo mesma.</p><p>— Do cogumelo — disse a Lagarta, como se Alice tivesse perguntado em voz alta; e no momento seguinte já estava fora de vista.</p><p>Alice ficou olhando pensativamente para o cogumelo por um minuto, tentando descobrir quais eram os dois lados dele; e, como ele era perfeitamente redondo, achou essa uma questão muito difícil. No entanto, por fim, esticou os braços ao redor dele o mais longe que pôde e partiu um pedacinho da borda com cada mão.</p><p>— E agora, qual é qual? — disse consigo mesma, e mordiscou um pouco do pedaço da mão direita para experimentar o efeito: no momento seguinte sentiu um violento golpe por baixo do queixo: o pedaço a atingira no pé!</p><p>Ela ficou bastante assustada com essa mudança tão súbita, mas sentiu que não havia tempo a perder, pois estava encolhendo rapidamente; então pôs-se imediatamente a comer um pouco do outro pedaço. Seu queixo estava tão pressionado contra o pé que mal havia espaço para abrir a boca; mas ela conseguiu por fim e logrou engolir um naco do pedaço da mão esquerda.</p><p><em> </em> *</p><p>— Ora, minha cabeça está livre, finalmente! — disse Alice num tom de alegria, que se transformou em alarme no momento seguinte, quando descobriu que seus ombros haviam sumido: tudo o que podia ver, ao olhar para baixo, era um imenso pescoço comprido, que parecia erguer-se como um talo de um mar de folhas verdes que se estendia muito abaixo dela.</p><p>— O que _pode_ ser toda essa coisa verde? — disse Alice. — E para onde _foram_ meus ombros? E, oh, minhas pobres mãos, por que não consigo vê-las?</p><p>Ela as agitava enquanto falava, mas nenhum resultado parecia seguir-se, exceto um leve tremor entre as folhas verdes distantes.</p><p>Como não parecia haver a menor chance de levar as mãos até a cabeça, ela tentou levar a cabeça até elas, e ficou encantada ao descobrir que seu pescoço se dobrava facilmente em qualquer direção, como uma serpente. Acabara de conseguir curvá-lo num gracioso ziguezague e ia mergulhar entre as folhas, que descobriu não serem nada além dos topos das árvores sob as quais estivera vagando, quando um sibilo agudo a fez recuar apressadamente: uma grande pomba voara em seu rosto e a espancava violentamente com as asas.</p><p>— Serpente! — gritou a Pomba.</p><p>— Eu _não_ sou uma serpente! — disse Alice, indignada. — Deixe-me em paz!</p><p>— Serpente, repito! — repetiu a Pomba, mas em tom mais contido, e acrescentou com uma espécie de soluço: — Já tentei de todos os jeitos, e nada parece agradá-las!</p><p>— Não faço a menor ideia do que você está falando — disse Alice.</p><p>— Já tentei as raízes das árvores, e já tentei as margens, e já tentei as sebes — continuou a Pomba, sem dar atenção a ela —; mas aquelas serpentes! Não há como contentá-las!</p><p>Alice ficava cada vez mais intrigada, mas achou que não adiantava dizer mais nada até a Pomba terminar.</p><p>— Como se não fosse trabalho suficiente chocar os ovos — disse a Pomba —; mas tenho de ficar de vigia contra as serpentes noite e dia! Ora, não preguei o olho nestas três semanas!</p><p>— Sinto muito que você tenha sido incomodada — disse Alice, que começava a entender o sentido daquilo.</p><p>— E justamente quando eu havia tomado a árvore mais alta do bosque — continuou a Pomba, elevando a voz até um guincho —, e justamente quando eu pensava que estaria livre delas de uma vez, elas precisam vir se contorcendo lá do céu! Ugh, Serpente!</p><p>— Mas eu _não_ sou uma serpente, estou lhe dizendo! — disse Alice. — Eu sou uma... eu sou uma...</p><p>— Bem! O que _é_ você? — disse a Pomba. — Posso ver que você está tentando inventar alguma coisa!</p><p>— Eu... eu sou uma menininha — disse Alice, um tanto hesitante, ao se lembrar do número de mudanças pelas quais passara naquele dia.</p><p>— Essa é boa, sim! — disse a Pomba num tom do mais profundo desprezo. — Já vi muitas menininhas em minha vida, mas nunca _uma_ com um pescoço assim! Não, não! Você é uma serpente; e não adianta negar. Suponho que vai me dizer em seguida que nunca provou um ovo!</p><p>— Eu _já_ provei ovos, certamente — disse Alice, que era uma criança muito sincera —; mas as menininhas comem ovos tanto quanto as serpentes, sabe.</p><p>— Não acredito — disse a Pomba —; mas, se comem, então são uma espécie de serpente, é tudo o que posso dizer.</p><p>Essa era uma ideia tão nova para Alice que ela ficou totalmente em silêncio por um ou dois minutos, o que deu à Pomba a oportunidade de acrescentar:</p><p>— Você está à procura de ovos, sei disso muito bem; e o que me importa se você é uma menininha ou uma serpente?</p><p>— Importa muito para _mim_ — disse Alice, apressadamente —; mas não estou à procura de ovos, como acontece; e, se estivesse, não quereria os _seus_: não gosto deles crus.</p><p>— Bem, então vá embora! — disse a Pomba num tom amuado, ao se acomodar de novo no ninho. Alice agachou-se entre as árvores o melhor que pôde, pois seu pescoço não parava de se enroscar nos galhos, e de vez em quando ela precisava parar para desenroscá-lo. Depois de um tempo, lembrou-se de que ainda segurava os pedaços de cogumelo nas mãos, e pôs-se a trabalhar com muito cuidado, mordiscando primeiro um e depois o outro, e crescendo ora mais alta, ora mais baixa, até conseguir se reduzir à sua altura habitual.</p><p>Havia tanto tempo que ela não ficava perto do tamanho certo que aquilo pareceu bastante estranho a princípio; mas ela se acostumou em poucos minutos e começou a falar consigo mesma, como de costume.</p><p>— Ora, metade do meu plano está feita agora! Como são intrigantes todas essas mudanças! Nunca sei o que vou ser, de um minuto para outro! No entanto, voltei ao meu tamanho certo: a próxima coisa é entrar naquele lindo jardim... como _será_ que isso se faz, eu me pergunto?</p><p>Ao dizer isso, ela deu de repente num lugar aberto, com uma casinha de cerca de quatro pés de altura.</p><p>— Quem quer que more ali — pensou Alice —, não posso aparecer diante deles _deste_ tamanho: ora, eu os assustaria até tirar-lhes o juízo!</p><p>Então começou a mordiscar de novo o pedaço da mão direita e não se atreveu a se aproximar da casa até ter se reduzido a nove polegadas de altura.\n</p>", "subsections": [], "readTime": "10 min"}, {"type": "chapter", "title": "Capítulo VI: Porco e Pimenta", "html": "<p>\nPor um minuto ou dois ela ficou parada olhando a casa, imaginando o que fazer em seguida, quando de repente um lacaio em libré saiu correndo do bosque (ela o considerou um lacaio porque estava de libré: caso contrário, julgando apenas pelo rosto, ela o teria chamado de peixe) e bateu ruidosamente à porta com os nós dos dedos. A porta foi aberta por outro lacaio em libré, de rosto redondo e olhos grandes como os de uma rã; e ambos os lacaios, Alice notou, tinham cabelo empoado que se enrolava por toda a cabeça. Ela sentiu muita curiosidade em saber o que se passava e se aproximou um pouco do bosque para escutar.</p><p>O Lacaio-Peixe começou tirando de debaixo do braço uma grande carta, quase tão grande quanto ele próprio, e a entregou ao outro, dizendo em tom solene: \"Para a Duquesa. Um convite da Rainha para jogar croqué.\" O Lacaio-Rã repetiu, no mesmo tom solene, apenas mudando um pouco a ordem das palavras: \"Da Rainha. Um convite para a Duquesa jogar croqué.\"</p><p>Então ambos se curvaram profundamente, e os cachos se enroscaram uns nos outros. Alice riu tanto com aquilo que teve de correr de volta para o bosque com medo de que a ouvissem; e quando espiou de novo, o Lacaio-Peixe havia partido, e o outro estava sentado no chão perto da porta, olhando estupidamente para o céu.</p><p>Alice foi timidamente até a porta e bateu.</p><p>— Não adianta nada bater — disse o Lacaio —, e isso por duas razões. Primeiro, porque estou do mesmo lado da porta que você; segundo, porque estão fazendo um barulho tão grande lá dentro que ninguém poderia ouvi-la.</p><p>E certamente havia um barulho extraordinário vindo de dentro — um uivo e espirros constantes e, de vez em quando, um grande estrondo, como se um prato ou uma chaleira tivesse se quebrado em pedaços.</p><p>— Por favor, então — disse Alice —, como faço para entrar?</p><p>— Poderia haver algum sentido em você bater — continuou o Lacaio, sem lhe dar atenção — se houvesse a porta entre nós. Por exemplo, se você estivesse <em>dentro</em>, poderia bater, e eu poderia deixá-la sair, sabe.</p><p>Ele olhava para o céu o tempo todo enquanto falava, e Alice achou isso decididamente descortês. \"Mas talvez ele não tenha culpa\", disse consigo mesma; \"seus olhos estão tão <em>muito</em> perto do topo da cabeça. Mas de qualquer forma ele poderia responder às perguntas.\" — Como faço para entrar? — repetiu ela, em voz alta.</p><p>— Vou ficar sentado aqui — observou o Lacaio — até amanhã...</p><p>Nesse momento a porta da casa se abriu, e um grande prato veio deslizando para fora, direto na cabeça do Lacaio: apenas roçou o seu nariz e se quebrou contra uma das árvores atrás dele.</p><p>— ...ou depois de amanhã, talvez — continuou o Lacaio no mesmo tom, exatamente como se nada tivesse acontecido.</p><p>— Como faço para entrar? — perguntou Alice de novo, em voz mais alta.</p><p>— <em>Você</em> deve entrar de algum jeito? — disse o Lacaio. — Essa é a primeira pergunta, sabe.</p><p>Sem dúvida era: só que Alice não gostou de ouvir aquilo. \"É realmente terrível\", murmurou consigo mesma, \"o jeito como todas as criaturas discutem. É o bastante para enlouquecer a gente!\"</p><p>O Lacaio pareceu achar aquela uma boa oportunidade para repetir a sua observação, com variações. — Vou ficar sentado aqui — disse ele —, de vez em quando, por dias e dias.</p><p>— Mas o que <em>eu</em> devo fazer? — disse Alice.</p><p>— O que você quiser — disse o Lacaio, e começou a assobiar.</p><p>— Oh, não adianta falar com ele — disse Alice, desesperada —: ele é perfeitamente idiota! E abriu a porta e entrou.</p><p>A porta dava direto para uma grande cozinha, cheia de fumaça de uma ponta a outra: a Duquesa estava sentada num tamborete de três pernas no meio, embalando um bebê; a cozinheira estava debruçada sobre o fogo, mexendo um grande caldeirão que parecia cheio de sopa.</p><p>— Com certeza há pimenta demais nessa sopa! — disse Alice consigo mesma, o melhor que pôde entre espirros.</p><p>Certamente havia pimenta demais no ar. Até a Duquesa espirrava de vez em quando; e quanto ao bebê, espirrava e uivava alternadamente, sem um momento de pausa. As únicas coisas na cozinha que não espirravam eram a cozinheira e um grande gato que estava sentado junto à lareira, sorrindo de orelha a orelha.</p><p>— Por favor, você poderia me dizer — disse Alice, um pouco timidamente, pois não tinha certeza se seria boa educação falar primeiro — por que o seu gato sorri desse jeito?</p><p>— É um gato de Cheshire — disse a Duquesa —, e é por isso. Porco!</p><p>Ela disse a última palavra com tamanha violência repentina que Alice deu um pulo; mas percebeu no momento seguinte que aquilo era dirigido ao bebê, e não a ela, então criou coragem e continuou:</p><p>— Eu não sabia que gatos de Cheshire sempre sorriam; na verdade, eu não sabia que gatos <em>podiam</em> sorrir.</p><p>— Todos podem — disse a Duquesa —; e a maioria deles sorri.</p><p>— Não conheço nenhum que sorria — disse Alice, muito educadamente, sentindo-se bastante satisfeita por ter entrado numa conversa.</p><p>— Você não sabe muita coisa — disse a Duquesa —; e isso é um fato.</p><p>Alice não gostou nem um pouco do tom dessa observação e achou que seria melhor introduzir outro assunto de conversa. Enquanto tentava escolher um, a cozinheira tirou o caldeirão de sopa do fogo e, de imediato, começou a atirar tudo o que estivesse ao seu alcance na Duquesa e no bebê — os ferros do fogo vieram primeiro; depois seguiu-se uma chuva de panelas, pratos e travessas. A Duquesa não lhes dava atenção, mesmo quando a acertavam; e o bebê já uivava tanto que era impossível dizer se os golpes o machucavam ou não.</p><p>— Oh, <em>por favor</em>, preste atenção no que está fazendo! — gritou Alice, pulando para cima e para baixo numa agonia de terror. — Oh, lá se vai o <em>precioso</em> nariz dele! — quando uma panela excepcionalmente grande passou zunindo perto dele, quase o levando junto.</p><p>— Se todo mundo cuidasse da própria vida — disse a Duquesa num rosnado rouco —, o mundo giraria bem mais depressa do que gira.</p><p>— O que <em>não</em> seria uma vantagem — disse Alice, que se sentiu muito satisfeita por ter a oportunidade de exibir um pouco do seu conhecimento. — Pense no trabalho que isso daria com o dia e a noite! Veja, a Terra leva vinte e quatro horas para girar em torno do seu eixo...</p><p>— Falando em eixos — disse a Duquesa —, cortem-lhe a cabeça!</p><p>Alice olhou ansiosamente para a cozinheira, para ver se ela pretendia seguir a sugestão; mas a cozinheira estava ocupada mexendo a sopa e parecia não estar ouvindo, então ela continuou: \"Vinte e quatro horas, <em>acho</em>; ou são doze? Eu...\"</p><p>— Oh, não me <em>aborreça</em> — disse a Duquesa —; eu nunca suportei números! E com isso começou a embalar o filho de novo, cantando uma espécie de canção de ninar enquanto o fazia, dando-lhe um solavanco violento ao fim de cada verso:</p><p>\"Fale grosseiro com seu menininho,\nE bata nele quando espirrar:\nEle só faz isso para incomodar,\nPorque sabe que provoca.\"\nCORO.\n(No qual a cozinheira e o bebê se juntaram):\n\"Uau! Uau! Uau!\"</p><p>Enquanto a Duquesa cantava a segunda estrofe da canção, ficava atirando o bebê violentamente para cima e para baixo, e o pobrezinho uivava tanto que Alice mal conseguia ouvir as palavras:</p><p>\"Falo severamente com meu menino,\nBato nele quando espirra;\nPois ele pode apreciar plenamente\nA pimenta quando lhe apraz!\"\nCORO.\n\"Uau! Uau! Uau!\"</p><p>— Aqui! Você pode embalá-lo um pouco, se quiser! — disse a Duquesa a Alice, atirando-lhe o bebê enquanto falava. — Preciso ir me aprontar para jogar croqué com a Rainha —, e saiu apressada da sala. A cozinheira atirou uma frigideira atrás dela quando saiu, mas por pouco não a acertou.</p><p>Alice pegou o bebê com alguma dificuldade, pois era uma criaturinha de formato estranho, esticando braços e pernas em todas as direções, \"bem como uma estrela-do-mar\", pensou Alice. O pobrezinho estava bufando como uma máquina a vapor quando ela o pegou, e ficava se dobrando e se esticando de novo, de modo que, no todo, durante o primeiro minuto ou dois, ela fazia o máximo que podia para segurá-lo.</p><p>Assim que descobriu a maneira certa de embalá-lo (que era torcê-lo numa espécie de nó e depois segurar firmemente a sua orelha direita e o seu pé esquerdo, para impedir que se desfizesse), ela o carregou para o ar livre. \"Se eu não levar esta criança comigo\", pensou Alice, \"eles certamente a matarão em um ou dois dias: não seria assassinato deixá-la para trás?\" Ela disse as últimas palavras em voz alta, e a coisinha grunhiu em resposta (já tinha parado de espirrar nessa altura).</p><p>— Não grunha — disse Alice —; essa não é uma maneira nada apropriada de se expressar.</p><p>O bebê grunhiu de novo, e Alice olhou muito ansiosamente para o seu rosto para ver o que havia com ele. Não havia dúvida de que tinha um nariz <em>muito</em> arrebitado, muito mais parecido com um focinho do que com um nariz de verdade; além disso, os seus olhos estavam ficando extremamente pequenos para um bebê: no todo, Alice não gostou nada da aparência daquilo. \"Mas talvez fosse só soluço\", pensou, e olhou de novo para os seus olhos, para ver se havia lágrimas.</p><p>Não, não havia lágrimas. — Se você vai virar um porco, meu querido — disse Alice, seriamente —, não quero mais nada com você. Cuidado agora! O pobrezinho soluçou de novo (ou grunhiu, era impossível dizer qual), e seguiram por algum tempo em silêncio.</p><p>Alice estava começando a pensar consigo mesma: \"Agora, o que vou fazer com esta criatura quando a levar para casa?\", quando ele grunhiu de novo, tão violentamente que ela olhou para baixo, para o seu rosto, com certo alarme. Desta vez não havia <em>nenhum</em> engano: não era mais nem menos que um porco, e ela sentiu que seria bem absurdo carregá-lo adiante.</p><p>Então ela pôs a criaturinha no chão e sentiu-se bastante aliviada ao vê-la trotar tranquilamente para dentro do bosque. \"Se tivesse crescido\", disse consigo mesma, \"teria feito uma criança horrivelmente feia: mas é um porco muito bonito, acho.\" E começou a pensar em outras crianças que conhecia, que poderiam muito bem virar porcos, e estava justamente dizendo a si mesma: \"se ao menos alguém soubesse o jeito certo de transformá-las...\", quando foi um pouco sobressaltada ao ver o Gato de Cheshire sentado num galho de árvore a poucos metros de distância.</p><p>O Gato apenas sorriu quando viu Alice. Parecia bem-humorado, ela pensou: ainda assim tinha garras <em>muito</em> longas e muitos dentes, de modo que sentiu que deveria ser tratado com respeito.</p><p>— Gatinho de Cheshire — começou ela, um pouco timidamente, pois não sabia nada se ele gostaria do nome: no entanto, ele apenas sorriu um pouco mais largo. \"Ora, ele está satisfeito até agora\", pensou Alice, e continuou.</p><p>— Você poderia me dizer, por favor, para que lado eu devo ir daqui?</p><p>— Isso depende muito de onde você quer chegar — disse o Gato.</p><p>— Não me importo muito com onde... — disse Alice.</p><p>— Então não importa para que lado você vá — disse o Gato.</p><p>— ...desde que eu chegue a <em>algum</em> lugar — acrescentou Alice como explicação.</p><p>— Oh, você com certeza vai chegar — disse o Gato —, se apenas caminhar o bastante.</p><p>Alice sentiu que aquilo não podia ser contestado, então tentou outra pergunta. — Que tipo de pessoas moram por aqui?</p><p>— Nessa <em>direção</em> — disse o Gato, acenando com a pata direita — mora um Chapeleiro: e nessa <em>direção</em> —, acenando com a outra pata —, mora uma Lebre de Março. Visite qualquer um deles, como preferir: os dois são loucos.</p><p>— Mas eu não quero ir para o meio de gente louca — observou Alice.</p><p>— Oh, você não pode evitar isso — disse o Gato —: somos todos loucos aqui. Eu sou louco. Você é louca.</p><p>— Como você sabe que eu sou louca? — disse Alice.</p><p>— Você deve ser — disse o Gato —, ou não teria vindo para cá.</p><p>Alice não achou que aquilo provasse nada; no entanto, continuou: — E como você sabe que você é louco?</p><p>— Para começar — disse o Gato —, um cachorro não é louco. Você concede isso?</p><p>— Suponho que sim — disse Alice.</p><p>— Bem, então — continuou o Gato —, veja, um cachorro rosna quando está zangado e abana o rabo quando está satisfeito. Ora, <em>eu</em> rosno quando estou satisfeito e abano o rabo quando estou zangado. Portanto, sou louco.</p><p>— <em>Eu</em> chamo isso de ronronar, não de rosnar — disse Alice.</p><p>— Chame como quiser — disse o Gato. — Você vai jogar croqué com a Rainha hoje?</p><p>— Eu gostaria muito — disse Alice —, mas ainda não fui convidada.</p><p>— Você me verá lá — disse o Gato, e desapareceu.</p><p>Alice não ficou muito surpresa com isso; estava ficando tão acostumada com coisas estranhas acontecendo. Enquanto olhava para o lugar onde ele estivera, ele apareceu de repente de novo.</p><p>— A propósito, o que foi feito do bebê? — disse o Gato. — Quase me esqueci de perguntar.</p><p>— Ele virou um porco — disse Alice calmamente, como se ele tivesse voltado de uma maneira natural.</p><p>— Eu sabia que viraria — disse o Gato, e desapareceu de novo.</p><p>Alice esperou um pouco, meio esperando vê-lo de novo, mas ele não apareceu, e depois de um minuto ou dois ela caminhou na direção em que se dizia que morava a Lebre de Março. \"Já vi chapeleiros antes\", disse consigo mesma; \"a Lebre de Março será muito mais interessante, e talvez, como estamos em maio, ela não esteja completamente louca — pelo menos não tão louca quanto estava em março.\" Enquanto dizia isso, olhou para cima, e lá estava o Gato de novo, sentado num galho de árvore.</p><p>— Você disse porco, ou figo? — disse o Gato.</p><p>— Eu disse porco — respondeu Alice —; e queria que você parasse de aparecer e desaparecer tão de repente: isso deixa a gente tonta.</p><p>— Tudo bem — disse o Gato; e desta vez desapareceu bem devagar, começando pela ponta do rabo e terminando pelo sorriso, que permaneceu algum tempo depois que o resto dele já tinha ido.</p><p>\"Ora! Muitas vezes vi um gato sem sorriso\", pensou Alice; \"mas um sorriso sem gato! É a coisa mais curiosa que já vi na vida!\"</p><p>Não tinha ido muito mais longe quando avistou a casa da Lebre de Março: achou que devia ser a casa certa, porque as chaminés tinham formato de orelhas e o telhado era coberto de pelos. Era uma casa tão grande que ela não quis se aproximar antes de mordiscar mais um pouco do pedaço esquerdo do cogumelo e se erguer até cerca de dois pés de altura: mesmo assim, caminhou até ela com bastante timidez, dizendo a si mesma: \"E se ele estiver completamente louco, afinal! Quase desejo ter ido ver o Chapeleiro em vez disso!\"\n</p>", "subsections": [], "readTime": "12 min"}, {"type": "chapter", "title": "Capítulo VII: Um Chá Maluco", "html": "<p>\n<em>Título original: \"A Mad Tea-Party\" (</em>Alice's Adventures in Wonderland<em>, Lewis Carroll, 1865).</em></p><div class=\"mini-toc\"><strong>In this chapter:</strong><ul><li class=\"mt-2\"><a href=\"#a-mesa-de-ch-\">A mesa de chá</a></li><li class=\"mt-2\"><a href=\"#a-charada-do-corvo-e-da-escrivaninha\">A charada do corvo e da escrivaninha</a></li><li class=\"mt-2\"><a href=\"#o-rel-gio-do-chapeleiro\">O relógio do Chapeleiro</a></li><li class=\"mt-2\"><a href=\"#o-tempo\">O Tempo</a></li><li class=\"mt-2\"><a href=\"#sempre-hora-do-ch-\">Sempre hora do chá</a></li><li class=\"mt-2\"><a href=\"#as-tr-s-irm-zinhas\">As três irmãzinhas</a></li><li class=\"mt-2\"><a href=\"#de-volta-ao-jardim\">De volta ao jardim</a></li></ul></div><p><h2 id=\"a-mesa-de-ch-\">A mesa de chá</h2></p><p>Havia uma mesa posta sob uma árvore, em frente à casa, e a Lebre de Março e o Chapeleiro estavam tomando chá nela; um Arganaz estava sentado entre os dois, profundamente adormecido, e os outros dois o usavam como almofada, apoiando os cotovelos nele e conversando por cima de sua cabeça. \"Deve ser muito desconfortável para o Arganaz\", pensou Alice; \"mas, como ele está dormindo, suponho que não se importa.\"</p><p>A mesa era grande, mas os três se amontoavam juntos num dos cantos dela. \"Não tem lugar! Não tem lugar!\", gritaram ao ver Alice se aproximar. \"Tem _muito_ lugar!\", disse Alice, indignada, e sentou-se numa grande poltrona, numa das pontas da mesa.</p><p>\"Quer um pouco de vinho?\", disse a Lebre de Março num tom encorajador.</p><p>Alice olhou ao redor da mesa, mas não havia nada além de chá. \"Não vejo vinho nenhum\", observou.</p><p>\"Não há nenhum\", disse a Lebre de Março.</p><p>\"Então não foi nada gentil da sua parte oferecê-lo\", disse Alice, irritada.</p><p>\"Não foi nada gentil da sua parte sentar-se sem ser convidada\", disse a Lebre de Março.</p><p>\"Não sabia que era a _sua_ mesa\", disse Alice; \"está posta para muito mais do que três pessoas.\"</p><p>\"Seu cabelo precisa de um corte\", disse o Chapeleiro. Ele vinha olhando para Alice havia algum tempo com grande curiosidade, e aquela foi sua primeira fala.</p><p>\"Você devia aprender a não fazer observações pessoais\", disse Alice com certa severidade; \"é
