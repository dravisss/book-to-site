to escutava, ou parecia escutar, todo o lugar ao seu redor tornava-se vivo com as estranhas criaturas do sonho de sua irmãzinha.</p><p>A relva alta sussurrava a seus pés quando o Coelho Branco passava apressado—o Camundongo assustado atravessava a poça vizinha a chapinhar—ela podia ouvir o tinir das xícaras de chá quando a Lebre de Março e seus amigos compartilhavam sua refeição interminável, e a voz estridente da Rainha mandando executar seus infelizes convidados—mais uma vez o porquinho-bebê espirrava no colo da Duquesa, enquanto pratos e travessas se estilhaçavam ao seu redor—mais uma vez o guincho do Grifo, o chiado do lápis de lousa do Lagarto e o engasgo dos porquinhos-da-índia sufocados enchiam o ar, misturados aos soluços distantes do miserável Falso Cágado.</p><p>Assim ela permaneceu sentada, de olhos fechados, quase acreditando estar no País das Maravilhas, embora soubesse que bastava abri-los de novo para que tudo se transformasse na realidade monótona—a relva seria apenas o sussurro do vento, e a poça ondularia ao balanço dos juncos—o tinir das xícaras se transformaria no tilintar dos chocalhos das ovelhas, e os gritos estridentes da Rainha na voz do pastorzinho—e o espirro do bebê, o guincho do Grifo e todos os outros ruídos esquisitos se transformariam (ela sabia) no clamor confuso do movimentado terreiro—enquanto o mugido do gado ao longe tomaria o lugar dos pesados soluços do Falso Cágado.</p><p>Por fim, imaginou como aquela mesma irmãzinha, no futuro, seria ela própria uma mulher crescida; e como conservaria, através de todos os anos maduros, o coração simples e amoroso da infância; e como reuniria ao seu redor outras criancinhas, e faria _seus_ olhos brilharem e se animarem com muitas histórias estranhas, talvez até com o sonho do País das Maravilhas de muito tempo atrás; e como sentiria com elas todas as suas simples tristezas e encontraria prazer em todas as suas simples alegrias, lembrando-se da própria infância e dos felizes dias de verão.</p><p>FIM\n</p>", "subsections": [{"level": 2, "title": "A Regra Quarenta e Dois", "id": "a-regra-quarenta-e-dois"}, {"level": 2, "title": "A carta e os versos", "id": "a-carta-e-os-versos"}, {"level": 2, "title": "O veredicto", "id": "o-veredicto"}, {"level": 2, "title": "O despertar", "id": "o-despertar"}, {"level": 2, "title": "O sonho da irmã", "id": "o-sonho-da-irm-"}], "readTime": "9 min"}];
var currentIdx = 0;
var widths = ['680px','560px','780px'];

(function initTheme() {
  var saved = localStorage.getItem('bm-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeButton();
  if (localStorage.getItem('bm-sepia') === 'sepia') { document.documentElement.setAttribute('data-mode', 'sepia'); document.getElementById('sepia-btn').classList.add('on'); }
})();

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = (cur === 'dark') ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('bm-theme', next || 'light');
  updateThemeButton();
}
function updateThemeButton() { document.getElementById('theme-btn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '🌙' : '☀️'; }

function toggleSepia() {
  var el = document.documentElement;
  if (el.getAttribute('data-mode') === 'sepia') el.removeAttribute('data-mode');
  else el.setAttribute('data-mode', 'sepia');
  document.getElementById('sepia-btn').classList.toggle('on', el.getAttribute('data-mode') === 'sepia');
  localStorage.setItem('bm-sepia', el.getAttribute('data-mode') || '');
}

function savePosition() { localStorage.setItem('bm-last-chapter', currentIdx); localStorage.setItem('bm-scroll', window.scrollY); }
function restorePosition() {
  var saved = localStorage.getItem('bm-last-chapter');
  if (saved !== null) { var idx = parseInt(saved); if (idx >= 0 && idx < BOOK.length && BOOK[idx].type === 'chapter') { showChapter(idx); setTimeout(function() { window.scrollTo(0, parseInt(localStorage.getItem('bm-scroll') || '0')); }, 200); } }
}

function buildTOC() {
  var toc = document.getElementById('toc');
  BOOK.forEach(function(ch, i) {
    if (ch.type === 'part') { var el = document.createElement('div'); el.className = 'part'; el.textContent = ch.title; toc.appendChild(el); }
    else {
      var a = document.createElement('a'); a.className = 'ch-link'; a.dataset.idx = i;
      a.innerHTML = ch.title + (ch.readTime ? '<span class="time">'+ch.readTime+'</span>' : '');
      a.onclick = function(e) { e.preventDefault(); toggleChapter(i); };
      toc.appendChild(a);
      if (ch.subsections && ch.subsections.length) {
        var subDiv = document.createElement('div'); subDiv.className = 'subs'; subDiv.dataset.for = i;
        ch.subsections.forEach(function(sub) {
          var sa = document.createElement('a'); sa.className = 'sub-link' + (sub.level===3 ? ' l3' : '');
          sa.href = '#'+sub.id; sa.textContent = sub.title;
          sa.onclick = function(e) { e.preventDefault(); showChapter(i, sub.id); };
          subDiv.appendChild(sa);
        });
        toc.appendChild(subDiv);
      }
    }
  });
}

function toggleChapter(idx) {
  var prev = document.querySelector('#sidebar nav .ch-link.active');
  if (prev && parseInt(prev.dataset.idx) === idx) { prev.classList.remove('active'); var subs = document.querySelector('#sidebar nav .subs[data-for="'+idx+'"]'); if (subs) subs.style.display = 'none'; return; }
  showChapter(idx);
}

function showChapter(idx, scrollTo) {
  currentIdx = idx; var ch = BOOK[idx];
  document.querySelectorAll('#sidebar nav .ch-link.active').forEach(function(a) { a.classList.remove('active'); });
  document.querySelectorAll('#sidebar nav .subs').forEach(function(s) { s.style.display = 'none'; });
  var link = document.querySelector('#sidebar nav .ch-link[data-idx="'+idx+'"]');
  if (link) { link.classList.add('active'); var subs = document.querySelector('#sidebar nav .subs[data-for="'+idx+'"]'); if (subs) subs.style.display = 'block'; }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('content').innerHTML = '<div class="chapter-header"><div class="chapter-title">'+ch.title+'</div>'+(ch.readTime ? '<div class="chapter-meta">⏱ '+ch.readTime+' de leitura</div>' : '')+'</div>'+ch.html+'<div class="nav-bottom">'+prevLink(idx)+nextLink(idx)+'</div>';
  document.getElementById('progress-fill').style.width = '0%';
  if (scrollTo) { setTimeout(function() { var el = document.getElementById(scrollTo); if (el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 100); }
  else { window.scrollTo(0,0); }
  savePosition();
}

function prevLink(idx) { for(var i=idx-1;i>=0;i--) if(BOOK[i].type==='chapter') return '<a href="#" onclick="showChapter('+i+')">← '+BOOK[i].title+'</a>'; return '<span></span>'; }
function nextLink(idx) { for(var i=idx+1;i<BOOK.length;i++) if(BOOK[i].type==='chapter') return '<a href="#" onclick="showChapter('+i+')">'+BOOK[i].title+' →</a>'; return '<span></span>'; }

function doSearch() {
  var q = document.getElementById('search').value.toLowerCase();
  if (!q || q.length < 2) { showChapter(currentIdx); return; }
  for (var i = 0; i < BOOK.length; i++) {
    if (BOOK[i].type === 'chapter' && BOOK[i].html.toLowerCase().indexOf(q) !== -1) {
      showChapter(i);
      setTimeout(function() {
        var c = document.getElementById('content');
        var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        c.innerHTML = c.innerHTML.replace(/<mark>|<\/mark>/g,'');
        c.innerHTML = c.innerHTML.replace(re,'<mark style="background:rgba(201,115,58,.2);color:inherit;padding:1px 2px;border-radius:2px;">$1</mark>');
        var m = c.querySelector('mark'); if (m) m.scrollIntoView({behavior:'smooth',block:'center'});
      }, 50);
      return;
    }
  }
}

var scrollTicking = false;
window.addEventListener('scroll', function() {
  var h = document.documentElement;
  document.getElementById('progress-fill').style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  document.getElementById('back-top').classList.toggle('visible', h.scrollTop > 500);
  if (!scrollTicking) { requestAnimationFrame(function() { var headings = document.querySelectorAll('#content h2, #content h3'); var current = null; headings.forEach(function(h) { if (h.getBoundingClientRect().top < 120) current = h.id; }); document.querySelectorAll('#sidebar nav .sub-link').forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#'+current); }); scrollTicking = false; }); scrollTicking = true; }
});

function setWidth(w) { document.getElementById('content').style.maxWidth = widths[w]; document.querySelectorAll('#controls button').forEach(function(b,i) { if (i>=4 && i<=6) b.classList.toggle('on', i-4===w); }); }
var fontSize = 16;
function changeFont(delta) { fontSize = Math.max(13, Math.min(21, fontSize + delta)); document.documentElement.style.setProperty('--font-size', fontSize+'px'); }
document.addEventListener('keydown', function(e) { if (e.key==='ArrowRight'&&!e.ctrlKey) for(var i=currentIdx+1;i<BOOK.length;i++) if(BOOK[i].type==='chapter'){showChapter(i);break;} if (e.key==='ArrowLeft'&&!e.ctrlKey) for(var i=currentIdx-1;i>=0;i--) if(BOOK[i].type==='chapter'){showChapter(i);break;} });
function scrollToTop() { window.scrollTo({top:0,behavior:'smooth'}); }

window.addEventListener('beforeunload', savePosition);
var saveTimeout;
window.addEventListener('scroll', function() { clearTimeout(saveTimeout); saveTimeout = setTimeout(savePosition, 2000); });

buildTOC();
if (localStorage.getItem('bm-last-chapter')) { restorePosition(); } else { showChapter(0); }
</script>
