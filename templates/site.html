<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__BOOK_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1F3529; --secondary: #5C6B5E; --tertiary: #C9733A;
  --neutral: #E8E2D0; --surface: #F5F1E4; --on-primary: #F5F1E4;
  --bg: var(--neutral); --text: var(--primary); --sidebar-bg: var(--primary);
  --sidebar-text: var(--on-primary); --accent: var(--tertiary); --accent2: var(--tertiary);
  --border: #d5ceba; --link: var(--tertiary);
  --blockquote-bg: var(--surface); --blockquote-border: var(--tertiary);
  --table-header: var(--surface); --table-stripe: #faf8f3; --figcaption: var(--secondary);
  --progress-bg: #d5ceba; --progress-fill: var(--tertiary);
  --content-width: 680px; --font-size: 1rem;
  --citation-color: var(--tertiary); --citation-hover: #a85c28;
  --tooltip-bg: var(--primary); --tooltip-text: var(--on-primary);
  --ff-display: 'Cormorant Garamond', 'Georgia', serif;
  --ff-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px;
  --space-sm: 8px; --space-md: 16px; --space-lg: 32px;
}
[data-theme="dark"] {
  --bg: #1a211e; --text: #d4d9cc; --primary: #d4d9cc;
  --sidebar-bg: #0f1714; --sidebar-text: #d4d9cc; --on-primary: #d4d9cc;
  --neutral: #1a211e; --surface: #222c27;
  --border: #2a362f; --blockquote-bg: #222c27;
  --table-header: #222c27; --table-stripe: #1a211e; --figcaption: #6b7c6e;
  --progress-bg: #2a362f; --citation-hover: #e08544;
  --tooltip-bg: #f5f1e4; --tooltip-text: #1f3529;
}
[data-mode="sepia"] { --bg: #f0e8d0; --surface: #ede2c6; --blockquote-bg: #ede2c6;
  --table-header: #ede2c6; --table-stripe: #f5f0e2; --border: #d4c5a0; }

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--ff-body); font-size:var(--font-size); font-weight:400;
  background:var(--bg); color:var(--text); display:grid;
  grid-template-columns:280px 1fr; min-height:100vh; line-height:1.65;
  -webkit-font-smoothing:antialiased; font-feature-settings:'kern' 1,'liga' 1; }

#sidebar { background:var(--sidebar-bg); color:var(--sidebar-text);
  padding:var(--space-lg) var(--space-md); position:sticky; top:0; height:100vh;
  z-index:10; overflow-y:auto; display:flex; flex-direction:column; }
#sidebar h1 { font-family:var(--ff-display); font-size:1.15rem; line-height:1.3;
  margin-bottom:.25rem; color:var(--tertiary); font-weight:500; letter-spacing:-0.01em; }
#sidebar .authors { font-size:.75rem; letter-spacing:.08em; opacity:.5; margin-bottom:var(--space-md);
  font-family:var(--ff-body); text-transform:uppercase; }
#sidebar input { width:100%; padding:10px 12px; border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-md); background:rgba(255,255,255,.04); color:var(--sidebar-text);
  font-size:.8rem; margin-bottom:var(--space-md); font-family:var(--ff-body); outline:none;
  transition:border-color .2s; }
#sidebar input:focus { border-color:var(--tertiary); }
#sidebar nav { flex:1; overflow-y:auto; }
#sidebar nav .part { font-size:.625rem; text-transform:uppercase; letter-spacing:.12em; opacity:.3;
  margin:var(--space-md) 0 4px; padding-left:8px; font-weight:600; font-family:var(--ff-body); }
#sidebar nav .ch-link { display:flex; align-items:center; padding:6px 8px;
  color:var(--sidebar-text); text-decoration:none; font-size:.8rem; border-radius:var(--radius-sm);
  transition:all .15s; cursor:pointer; font-weight:450; }
#sidebar nav .ch-link:hover { background:rgba(201,115,58,.1); }
#sidebar nav .ch-link.active { background:rgba(201,115,58,.18); color:var(--tertiary); font-weight:550; }
#sidebar nav .ch-link .time { font-size:.65rem; opacity:.35; margin-left:auto; white-space:nowrap; }
#sidebar nav .subs { display:none; margin-left:8px; border-left:1px solid rgba(255,255,255,.06); }
#sidebar nav .ch-link.active+.subs { display:block; }
#sidebar nav .sub-link { display:block; padding:4px 10px; color:var(--sidebar-text);
  text-decoration:none; font-size:.72rem; opacity:.6; border-radius:var(--radius-sm);
  transition:all .12s; }
#sidebar nav .sub-link:hover { opacity:1; background:rgba(201,115,58,.08); }
#sidebar nav .sub-link.active { opacity:1; color:var(--tertiary); }
#sidebar nav .sub-link.l3 { padding-left:20px; font-size:.68rem; }
#controls { display:flex; gap:4px; padding-top:var(--space-md);
  border-top:1px solid rgba(255,255,255,.06); margin-top:var(--space-sm); flex-wrap:wrap; }
#controls button { background:rgba(255,255,255,.04); color:var(--sidebar-text); border:none;
  padding:5px 8px; border-radius:var(--radius-sm); cursor:pointer; font-size:.68rem;
  font-family:var(--ff-body); transition:all .15s; }
#controls button:hover { background:rgba(201,115,58,.12); }
#controls button.on { background:var(--tertiary); color:#fff; }
#controls .sep { width:1px; background:rgba(255,255,255,.06); margin:0 2px; }

#menu-btn { display:none; position:fixed; top:12px; left:12px; z-index:20;
  background:var(--primary); color:var(--on-primary); border:none; font-size:1.2rem;
  padding:8px 10px; border-radius:var(--radius-md); cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.15); font-family:var(--ff-body); }

#content { padding:var(--space-lg) 48px; max-width:var(--content-width); width:100%;
  justify-self:center; }
#content .chapter-header { margin-bottom:40px; }
#content .chapter-title { font-family:var(--ff-display); font-size:2.75rem; font-weight:500;
  line-height:1.15; color:var(--primary); letter-spacing:-0.01em; }
#content .chapter-meta { font-size:.75rem; letter-spacing:.08em; color:var(--secondary);
  text-transform:uppercase; margin-top:8px; font-family:var(--ff-body); }
#content h2 { font-family:var(--ff-display); font-size:1.6rem; font-weight:500;
  margin:48px 0 16px; padding-bottom:8px; border-bottom:1px solid var(--border);
  color:var(--primary); scroll-margin-top:16px; letter-spacing:-0.005em; }
#content h3 { font-family:var(--ff-display); font-size:1.25rem; font-weight:500;
  margin:32px 0 12px; color:var(--primary); scroll-margin-top:16px; }
#content h4 { font-family:var(--ff-display); font-size:1.05rem; font-weight:500; font-style:italic;
  margin:24px 0 8px; color:var(--secondary); }
#content p { margin-bottom:1.1rem; text-align:justify; hyphens:auto; }
#content blockquote { border-left:3px solid var(--tertiary); padding:16px 20px;
  margin:24px 0; background:var(--blockquote-bg); border-radius:0 var(--radius-md) var(--radius-md) 0;
  font-style:italic; }
#content table { width:100%; border-collapse:collapse; margin:24px 0; font-size:.9rem;
  border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border); }
#content th { background:var(--table-header); font-weight:550; padding:12px 16px; text-align:left;
  font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; color:var(--secondary); }
#content td { padding:10px 16px; border-top:1px solid var(--border); }
#content tr:nth-child(even) td { background:var(--table-stripe); }
#content figure { margin:32px 0; text-align:center; }
#content figure img { max-width:100%; border-radius:var(--radius-md);
  box-shadow:0 1px 8px rgba(0,0,0,.06); border:1px solid var(--border); }
#content figure figcaption { font-size:.75rem; letter-spacing:.08em; color:var(--secondary);
  text-transform:uppercase; margin-top:8px; font-family:var(--ff-body); }
#content strong { color:var(--tertiary); font-weight:600; }

.fn-ref { color:var(--tertiary); font-weight:600; cursor:help; position:relative; font-size:.72rem; }
.fn-ref:hover { text-decoration:underline; }
.fn-ref::after { content:attr(data-note); display:none; position:absolute; bottom:calc(100% + 6px);
  left:50%; transform:translateX(-50%); background:var(--tooltip-bg); color:var(--tooltip-text);
  padding:12px 16px; border-radius:var(--radius-md); font-size:.78rem; max-width:400px;
  min-width:200px; line-height:1.5; box-shadow:0 4px 16px rgba(0,0,0,.2); z-index:999;
  white-space:normal; text-align:left; font-style:normal; font-weight:400; pointer-events:none;
  font-family:var(--ff-body); }
.fn-ref:hover::after { display:block; }

.footnotes-section { margin-top:48px; padding-top:24px; border-top:2px solid var(--border); }
.footnotes-section hr { display:none; }
.footnotes-section h3 { font-family:var(--ff-display); font-size:1.1rem; color:var(--primary);
  margin-bottom:16px; font-weight:500; }
.footnote { display:flex; gap:12px; padding:8px 0; font-size:.88rem; line-height:1.55;
  border-bottom:1px solid var(--border); color:var(--secondary); }
.footnote:last-child { border-bottom:none; }
.fn-num { color:var(--tertiary); font-weight:600; min-width:24px; font-size:.72rem; padding-top:2px;
  font-family:var(--ff-body); }

.internal-link { color:var(--tertiary); text-decoration:none; border-bottom:1px dashed var(--tertiary);
  transition:all .15s; font-weight:500; }
.internal-link:hover { color:#a85c28; border-bottom-style:solid; }

.mini-toc { background:var(--surface); border-left:3px solid var(--tertiary); padding:16px 20px;
  margin:20px 0 32px; border-radius:0 var(--radius-md) var(--radius-md) 0; font-size:.9rem;
  line-height:1.9; }
.mini-toc strong { font-size:.78rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--secondary); display:block; margin-bottom:6px; font-family:var(--ff-body);
  font-weight:550; }
.mini-toc ul { list-style:none; padding:0; margin:0; }
.mini-toc li.mt-3 { padding-left:16px; font-size:.85rem; }
.mini-toc a { color:var(--primary); text-decoration:none; transition:color .12s; font-weight:450; }
.mini-toc a:hover { color:var(--tertiary); }

#progress { position:fixed; top:0; left:280px; right:0; height:2px; background:var(--progress-bg);
  z-index:5; }
#progress-fill { height:100%; background:var(--tertiary); width:0%; transition:width .3s; }
#back-top { position:fixed; bottom:32px; right:32px; width:40px; height:40px;
  border-radius:50%; background:var(--tertiary); color:#fff; border:none; font-size:1.1rem;
  cursor:pointer; opacity:0; transition:opacity .3s; box-shadow:0 2px 8px rgba(0,0,0,.12);
  z-index:5; font-family:var(--ff-body); display:flex; align-items:center; justify-content:center; }
#back-top.visible { opacity:.85; } #back-top:hover { opacity:1; }
.nav-bottom { display:flex; justify-content:space-between; margin-top:48px; padding-top:20px;
  border-top:1px solid var(--border); }
.nav-bottom a { color:var(--tertiary); text-decoration:none; font-size:.88rem; font-weight:500; }
.nav-bottom a:hover { color:#a85c28; }

@media (max-width:1024px) {
  body { grid-template-columns:1fr; }
  #sidebar { position:fixed; top:0; left:0; bottom:0; width:280px; z-index:10;
    transform:translateX(-100%); transition:transform .3s; }
  #sidebar.open { transform:translateX(0); }
  #content { padding:24px 32px; }
  #progress { left:0; }
  #menu-btn { display:flex; align-items:center; justify-content:center; }
}
@media (max-width:768px) {
  :root { --font-size:.95rem; }
  #content { padding:20px 16px; }
  #content .chapter-title { font-size:1.75rem; }
  #back-top { right:16px; bottom:16px; }
}
@media (min-width:1800px) { :root { --content-width:760px; } #content { padding:40px 80px; } }
@media print { #sidebar,#menu-btn,#progress,#back-top,.nav-bottom { display:none; }
  #content { margin-left:0; padding:0; max-width:100%; font-size:11pt; } }
</style>
</head>
<body>
<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="progress"><div id="progress-fill"></div></div>
<button id="back-top" onclick="scrollToTop()">↑</button>
<div id="sidebar">
  <h1>__BOOK_TITLE__</h1>
  <div class="authors">__BOOK_AUTHORS__ · __BOOK_YEAR__<br>Tradução: Nommy 🧭 · 2026</div>
  <input type="text" id="search" placeholder="Buscar no livro…" oninput="doSearch()">
  <nav id="toc"></nav>
  <div id="controls">
    <button onclick="changeFont(-1)" title="Fonte menor">A−</button>
    <button onclick="changeFont(1)" title="Fonte maior">A+</button>
    <span class="sep"></span>
    <button onclick="setWidth(1)" title="Estreito">⊟</button>
    <button onclick="setWidth(0)" title="Normal" class="on">⊠</button>
    <button onclick="setWidth(2)" title="Largo">⊞</button>
    <span class="sep"></span>
    <button onclick="toggleSepia()" title="Sépia" id="sepia-btn">📜</button>
    <button onclick="toggleTheme()" title="Tema" id="theme-btn">☀️</button>
  </div>
</div>
<div id="content"></div>
<script>
var BOOK = __BOOK_DATA__;
var currentIdx = 0;
var widths = ['680px','560px','780px'];

(function initTheme() {
  var saved = localStorage.getItem('bm-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeButton();
  if (localStorage.getItem('bm-sepia') === 'sepia') { document.documentElement.setAttribute('data-mode', 'sepia'); document.getElementById('sepia-btn').classList.add('on'); }
})();

function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = (cur === 'dark') ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  localStorage.setItem('bm-theme', next || 'light');
  updateThemeButton();
}
function updateThemeButton() { document.getElementById('theme-btn').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '🌙' : '☀️'; }

function toggleSepia() {
  var el = document.documentElement;
  if (el.getAttribute('data-mode') === 'sepia') el.removeAttribute('data-mode');
  else el.setAttribute('data-mode', 'sepia');
  document.getElementById('sepia-btn').classList.toggle('on', el.getAttribute('data-mode') === 'sepia');
  localStorage.setItem('bm-sepia', el.getAttribute('data-mode') || '');
}

function savePosition() { localStorage.setItem('bm-last-chapter', currentIdx); localStorage.setItem('bm-scroll', window.scrollY); }
function restorePosition() {
  var saved = localStorage.getItem('bm-last-chapter');
  if (saved !== null) { var idx = parseInt(saved); if (idx >= 0 && idx < BOOK.length && BOOK[idx].type === 'chapter') { showChapter(idx); setTimeout(function() { window.scrollTo(0, parseInt(localStorage.getItem('bm-scroll') || '0')); }, 200); } }
}

function buildTOC() {
  var toc = document.getElementById('toc');
  BOOK.forEach(function(ch, i) {
    if (ch.type === 'part') { var el = document.createElement('div'); el.className = 'part'; el.textContent = ch.title; toc.appendChild(el); }
    else {
      var a = document.createElement('a'); a.className = 'ch-link'; a.dataset.idx = i;
      a.innerHTML = ch.title + (ch.readTime ? '<span class="time">'+ch.readTime+'</span>' : '');
      a.onclick = function(e) { e.preventDefault(); toggleChapter(i); };
      toc.appendChild(a);
      if (ch.subsections && ch.subsections.length) {
        var subDiv = document.createElement('div'); subDiv.className = 'subs'; subDiv.dataset.for = i;
        ch.subsections.forEach(function(sub) {
          var sa = document.createElement('a'); sa.className = 'sub-link' + (sub.level===3 ? ' l3' : '');
          sa.href = '#'+sub.id; sa.textContent = sub.title;
          sa.onclick = function(e) { e.preventDefault(); showChapter(i, sub.id); };
          subDiv.appendChild(sa);
        });
        toc.appendChild(subDiv);
      }
    }
  });
}

function toggleChapter(idx) {
  var prev = document.querySelector('#sidebar nav .ch-link.active');
  if (prev && parseInt(prev.dataset.idx) === idx) { prev.classList.remove('active'); var subs = document.querySelector('#sidebar nav .subs[data-for="'+idx+'"]'); if (subs) subs.style.display = 'none'; return; }
  showChapter(idx);
}

function showChapter(idx, scrollTo) {
  currentIdx = idx; var ch = BOOK[idx];
  document.querySelectorAll('#sidebar nav .ch-link.active').forEach(function(a) { a.classList.remove('active'); });
  document.querySelectorAll('#sidebar nav .subs').forEach(function(s) { s.style.display = 'none'; });
  var link = document.querySelector('#sidebar nav .ch-link[data-idx="'+idx+'"]');
  if (link) { link.classList.add('active'); var subs = document.querySelector('#sidebar nav .subs[data-for="'+idx+'"]'); if (subs) subs.style.display = 'block'; }
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('content').innerHTML = '<div class="chapter-header"><div class="chapter-title">'+ch.title+'</div>'+(ch.readTime ? '<div class="chapter-meta">⏱ '+ch.readTime+' de leitura</div>' : '')+'</div>'+ch.html+'<div class="nav-bottom">'+prevLink(idx)+nextLink(idx)+'</div>';
  document.getElementById('progress-fill').style.width = '0%';
  if (scrollTo) { setTimeout(function() { var el = document.getElementById(scrollTo); if (el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 100); }
  else { window.scrollTo(0,0); }
  savePosition();
}

function prevLink(idx) { for(var i=idx-1;i>=0;i--) if(BOOK[i].type==='chapter') return '<a href="#" onclick="showChapter('+i+')">← '+BOOK[i].title+'</a>'; return '<span></span>'; }
function nextLink(idx) { for(var i=idx+1;i<BOOK.length;i++) if(BOOK[i].type==='chapter') return '<a href="#" onclick="showChapter('+i+')">'+BOOK[i].title+' →</a>'; return '<span></span>'; }

function doSearch() {
  var q = document.getElementById('search').value.toLowerCase();
  if (!q || q.length < 2) { showChapter(currentIdx); return; }
  for (var i = 0; i < BOOK.length; i++) {
    if (BOOK[i].type === 'chapter' && BOOK[i].html.toLowerCase().indexOf(q) !== -1) {
      showChapter(i);
      setTimeout(function() {
        var c = document.getElementById('content');
        var re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        c.innerHTML = c.innerHTML.replace(/<mark>|<\/mark>/g,'');
        c.innerHTML = c.innerHTML.replace(re,'<mark style="background:rgba(201,115,58,.2);color:inherit;padding:1px 2px;border-radius:2px;">$1</mark>');
        var m = c.querySelector('mark'); if (m) m.scrollIntoView({behavior:'smooth',block:'center'});
      }, 50);
      return;
    }
  }
}

var scrollTicking = false;
window.addEventListener('scroll', function() {
  var h = document.documentElement;
  document.getElementById('progress-fill').style.width = (h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  document.getElementById('back-top').classList.toggle('visible', h.scrollTop > 500);
  if (!scrollTicking) { requestAnimationFrame(function() { var headings = document.querySelectorAll('#content h2, #content h3'); var current = null; headings.forEach(function(h) { if (h.getBoundingClientRect().top < 120) current = h.id; }); document.querySelectorAll('#sidebar nav .sub-link').forEach(function(a) { a.classList.toggle('active', a.getAttribute('href') === '#'+current); }); scrollTicking = false; }); scrollTicking = true; }
});

function setWidth(w) { document.getElementById('content').style.maxWidth = widths[w]; document.querySelectorAll('#controls button').forEach(function(b,i) { if (i>=4 && i<=6) b.classList.toggle('on', i-4===w); }); }
var fontSize = 16;
function changeFont(delta) { fontSize = Math.max(13, Math.min(21, fontSize + delta)); document.documentElement.style.setProperty('--font-size', fontSize+'px'); }
document.addEventListener('keydown', function(e) { if (e.key==='ArrowRight'&&!e.ctrlKey) for(var i=currentIdx+1;i<BOOK.length;i++) if(BOOK[i].type==='chapter'){showChapter(i);break;} if (e.key==='ArrowLeft'&&!e.ctrlKey) for(var i=currentIdx-1;i>=0;i--) if(BOOK[i].type==='chapter'){showChapter(i);break;} });
function scrollToTop() { window.scrollTo({top:0,behavior:'smooth'}); }

window.addEventListener('beforeunload', savePosition);
var saveTimeout;
window.addEventListener('scroll', function() { clearTimeout(saveTimeout); saveTimeout = setTimeout(savePosition, 2000); });

buildTOC();
if (localStorage.getItem('bm-last-chapter')) { restorePosition(); } else { showChapter(0); }
</script>
</body>
</html>
